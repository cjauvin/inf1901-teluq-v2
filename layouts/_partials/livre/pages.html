{{- range where .Pages.ByWeight "Params.livreExclude" "!=" true -}}
  {{- if .IsSection }}
<section class="page" data-type="module" data-url="{{ .RelPermalink }}" data-titre="{{ .Title }}">
{{ .Content }}
</section>
    {{- partial "livre/pages.html" . -}}
  {{- else }}
<section class="page" data-type="page" data-url="{{ .RelPermalink }}" data-titre="{{ .Title }}">
{{ .Content }}
</section>
  {{- end -}}
{{- end -}}
