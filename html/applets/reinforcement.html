<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apprentissage par renforcement — Gridworld (Q-learning)</title>
  <style>
    :root{--bg:#0b0f14;--muted:#98a4b5;--shadow:0 10px 30px rgba(0,0,0,.35)}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:radial-gradient(1200px 800px at 80% -10%,#1b2636,var(--bg) 60%);color:#e6edf5}
    .wrap{max-width:720px;margin:20px auto;padding:0 12px}
    .panel{background:linear-gradient(180deg,#121821,#0f141c);border:1px solid #1f2a3a;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
    .toolbar{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;padding:12px;border-bottom:1px solid #1f2a3a}
    .tool{grid-column:span 6;display:flex;flex-direction:column;gap:6px;min-width:0}
    .row{display:flex;gap:8px;align-items:center}
    label{font-size:12px;color:#9fb0c3}
    input[type="range"]{width:100%}
    input[type="number"]{width:72px;padding:6px 8px;background:#0c121a;color:#e6edf5;border:1px solid #243244;border-radius:8px}
    .btns{grid-column:span 12;display:flex;gap:8px;flex-wrap:wrap}
    button{appearance:none;border:none;padding:10px 12px;border-radius:12px;background:#0c121a;color:#e6edf5;border:1px solid #243244;cursor:pointer;transition:transform .04s ease,background .2s ease,border-color .2s ease}
    button:hover{background:#121b28;border-color:#2f4057}
    button:active{transform:translateY(1px)}
    button.primary{background:#123024;border-color:#2f6f6a;color:#d7f0e8}
    .canvas-wrap{display:flex;justify-content:center;background:#0a0f15;padding:14px}
    canvas{display:block;width:100%;max-width:460px;height:auto;aspect-ratio:1/1;border-radius:8px}
    .stats{display:flex;gap:12px;padding:10px 12px;color:#c9d4e3;border-top:1px solid #1f2a3a;flex-wrap:wrap}
    .badge{padding:6px 10px;border-radius:999px;background:#0c121a;border:1px solid #243244;font-variant-numeric:tabular-nums;font-size:13px}
    .legend{padding:8px 12px 12px;color:#8fa1b6;font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
    .chip{display:inline-flex;align-items:center;gap:6px}
    .sq{width:13px;height:13px;border-radius:3px;display:inline-block}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="toolbar">
        <div class="tool">
          <label for="eps">Exploration ε (hasard) : <span id="epsVal">0.20</span></label>
          <input id="eps" type="range" min="0" max="1" step="0.05" value="0.2" />
        </div>
        <div class="tool">
          <label for="speed">Vitesse (pas par image) : <span id="speedVal">8</span></label>
          <input id="speed" type="range" min="1" max="40" step="1" value="8" />
        </div>
        <div class="btns">
          <button id="btnRun" class="primary">▶ Entraîner</button>
          <button id="btnEpisode">Un épisode</button>
          <button id="btnReset">Réinitialiser</button>
        </div>
      </div>
      <div class="canvas-wrap"><canvas id="canvas" width="460" height="460"></canvas></div>
      <div class="stats">
        <div class="badge" id="epBadge">Épisodes : 0</div>
        <div class="badge" id="stepBadge">Pas (épisode courant) : 0</div>
        <div class="badge" id="lastBadge">Pas au dernier but : –</div>
      </div>
      <div class="legend">
        <span class="chip"><span class="sq" style="background:#2f6f6a"></span> but (+1)</span>
        <span class="chip"><span class="sq" style="background:#c4564a"></span> piège (−1)</span>
        <span class="chip"><span class="sq" style="background:#3a4557"></span> mur</span>
        <span class="chip"><span class="sq" style="background:#e8c86a"></span> agent</span>
        <span class="chip">teinte verte = valeur apprise ; flèche = meilleure action</span>
      </div>
    </div>
  </div>

  <script>
  (function(){
    const cols = 6, rows = 6;
    const start = {r:5, c:0};
    const goal  = {r:0, c:5};
    const pit   = {r:2, c:4};
    const walls = new Set(['1,3','2,3','3,3']);
    const kEy = (r,c)=> r+','+c;
    const isWall = (r,c)=> walls.has(kEy(r,c));
    const inB = (r,c)=> r>=0 && r<rows && c>=0 && c<cols;
    const sidx = (r,c)=> r*cols + c;
    const nS = rows*cols;
    // actions : N, E, S, O
    const ACT = [[-1,0],[0,1],[1,0],[0,-1]];
    const ARROW = ['↑','→','↓','←'];

    const alpha = 0.4, gamma = 0.9;
    let eps = 0.2, speed = 8;
    let Q, agent, episodes, stepsEp, lastGoalSteps, running=false, raf=null;

    function resetQ(){
      Q = Array.from({length:nS}, ()=> [0,0,0,0]);
      agent = {...start};
      episodes = 0; stepsEp = 0; lastGoalSteps = null;
    }
    function argmax(arr){
      let bi=0, bv=arr[0];
      for(let i=1;i<arr.length;i++){ if(arr[i]>bv){bv=arr[i];bi=i;} }
      return bi;
    }
    function isTerminalCell(r,c){
      return (r===goal.r&&c===goal.c) || (r===pit.r&&c===pit.c);
    }
    function stepOnce(){
      const s = sidx(agent.r, agent.c);
      let a;
      if(Math.random() < eps) a = (Math.random()*4)|0;
      else a = argmax(Q[s]);
      let nr = agent.r + ACT[a][0], nc = agent.c + ACT[a][1];
      if(!inB(nr,nc) || isWall(nr,nc)){ nr = agent.r; nc = agent.c; }
      let r, terminal=false;
      if(nr===goal.r && nc===goal.c){ r = 1; terminal = true; }
      else if(nr===pit.r && nc===pit.c){ r = -1; terminal = true; }
      else { r = -0.02; }
      const ns = sidx(nr,nc);
      const maxNext = terminal ? 0 : Math.max(...Q[ns]);
      Q[s][a] += alpha * (r + gamma*maxNext - Q[s][a]);
      agent = {r:nr, c:nc};
      stepsEp++;
      if(terminal || stepsEp >= 120){
        if(terminal && r===1) lastGoalSteps = stepsEp;
        episodes++; stepsEp = 0; agent = {...start};
      }
    }
    function runEpisode(){
      let guard=0;
      // force au moins un pas puis jusqu'à fin d'épisode
      const startEp = episodes;
      do { stepOnce(); guard++; } while(episodes===startEp && guard<400);
    }

    const cv = document.getElementById('canvas');
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    const cw = W/cols, ch = H/rows;

    function draw(){
      ctx.clearRect(0,0,W,H);
      // échelle des valeurs pour le contraste
      let maxAbs = 0.15;
      for(let s=0;s<nS;s++){ const v=Math.max(...Q[s]); if(Math.abs(v)>maxAbs) maxAbs=Math.abs(v); }
      for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
          const x=c*cw, y=r*ch;
          const goalCell = (r===goal.r&&c===goal.c);
          const pitCell  = (r===pit.r&&c===pit.c);
          const wallCell = isWall(r,c);
          // fond
          if(wallCell){ ctx.fillStyle='#3a4557'; }
          else if(goalCell){ ctx.fillStyle='#2f6f6a'; }
          else if(pitCell){ ctx.fillStyle='#c4564a'; }
          else {
            const v = Math.max(...Q[sidx(r,c)]);
            const t = Math.max(-1, Math.min(1, v/maxAbs));
            if(t>=0){ ctx.fillStyle = `rgba(47,111,106,${0.12+0.62*t})`; }
            else    { ctx.fillStyle = `rgba(196,86,74,${0.10+0.40*(-t)})`; }
          }
          ctx.fillRect(x,y,cw,ch);
          // grille
          ctx.strokeStyle='rgba(10,15,21,0.9)'; ctx.lineWidth=2;
          ctx.strokeRect(x+0.5,y+0.5,cw-1,ch-1);
          // marqueurs but / piège
          if(goalCell||pitCell){
            ctx.fillStyle='#0b0f14'; ctx.font='bold 20px ui-sans-serif,system-ui';
            ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText(goalCell?'+1':'−1', x+cw/2, y+ch/2);
          } else if(!wallCell){
            // flèche de la meilleure action (si la case a été « apprise »)
            const q = Q[sidx(r,c)];
            const vmax = Math.max(...q), vmin=Math.min(...q);
            if(vmax!==0 || vmin!==0){
              const a = argmax(q);
              ctx.fillStyle='rgba(230,237,245,0.85)';
              ctx.font='bold 20px ui-sans-serif,system-ui';
              ctx.textAlign='center'; ctx.textBaseline='middle';
              ctx.fillText(ARROW[a], x+cw/2, y+ch/2);
            }
          }
        }
      }
      // agent
      ctx.beginPath();
      ctx.arc(agent.c*cw+cw/2, agent.r*ch+ch/2, Math.min(cw,ch)*0.26, 0, Math.PI*2);
      ctx.fillStyle='#e8c86a'; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle='#0b0f14'; ctx.stroke();
      // badges
      document.getElementById('epBadge').textContent = 'Épisodes : '+episodes;
      document.getElementById('stepBadge').textContent = 'Pas (épisode courant) : '+stepsEp;
      document.getElementById('lastBadge').textContent = 'Pas au dernier but : '+(lastGoalSteps==null?'–':lastGoalSteps);
    }

    function loop(){
      if(!running) return;
      for(let i=0;i<speed;i++) stepOnce();
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setRunning(on){
      running = on;
      document.getElementById('btnRun').textContent = on ? '⏸ Pause' : '▶ Entraîner';
      if(on){ raf = requestAnimationFrame(loop); }
      else if(raf){ cancelAnimationFrame(raf); raf=null; }
    }

    document.getElementById('btnRun').addEventListener('click', ()=> setRunning(!running));
    document.getElementById('btnEpisode').addEventListener('click', ()=>{ setRunning(false); runEpisode(); draw(); });
    document.getElementById('btnReset').addEventListener('click', ()=>{ setRunning(false); resetQ(); draw(); });
    const epsEl=document.getElementById('eps'), epsVal=document.getElementById('epsVal');
    epsEl.addEventListener('input', ()=>{ eps=parseFloat(epsEl.value); epsVal.textContent=eps.toFixed(2); });
    const spEl=document.getElementById('speed'), spVal=document.getElementById('speedVal');
    spEl.addEventListener('input', ()=>{ speed=parseInt(spEl.value,10); spVal.textContent=speed; });

    resetQ(); draw();
  })();
  </script>
<script src="https://cdn.jsdelivr.net/npm/iframe-resizer/js/iframeResizer.contentWindow.min.js"></script>
</body>
</html>
