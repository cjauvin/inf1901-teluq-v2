name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Build site
        run: hugo --minify --environment production

      # Le cours en PDF et en EPUB, à partir de la page /livre/ (scripts/livre/generer.py),
      # écrits dans public/telechargements/ et offerts par la page « Télécharger le cours en livre ».
      - name: Install pandoc and LaTeX
        # Délai et reprises : un miroir Ubuntu lent a déjà bloqué cette étape 30 minutes
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 -o Acquire::http::Timeout=20 pandoc librsvg2-bin fonts-dejavu-core \
            texlive-luatex texlive-latex-recommended texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended texlive-lang-french lmodern fonts-texgyre fonts-texgyre-math
          fc-list | grep -i -c gyre || true
          luaotfload-tool --update || true

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build PDF and EPUB
        run: uv run scripts/livre/generer.py --site public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
