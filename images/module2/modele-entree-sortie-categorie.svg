<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le modèle de classification : des caractéristiques en entrée, une catégorie en sortie</title>
<desc>Le même schéma en trois temps que pour le prix. À gauche, les caractéristiques d'une maison forment l'entrée : superficie, année, distance du centre, et cette fois le prix, qui a changé de côté. Une flèche mène à une boîte « modèle » au centre. Une autre flèche en ressort vers la droite, donnant la réponse en sortie : « oui », vendue en moins de 30 jours.</desc>
<defs>
<marker id="arrFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5b5249" stroke-width="1.6"/></marker>
</defs>

<rect x="0" y="0" width="680" height="250" rx="14" fill="#efe7d3" stroke="#d9cbac"/>

<!-- entrée : les caractéristiques, le prix compris -->
<text x="130" y="44" font-size="14" fill="#5b5249" text-anchor="middle">les caractéristiques (l'entrée)</text>
<rect x="35" y="58" width="190" height="150" rx="10" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.5"/>
<g stroke="#ece2cc" stroke-width="1">
<line x1="45" y1="95.5" x2="215" y2="95.5"/>
<line x1="45" y1="133" x2="215" y2="133"/>
<line x1="45" y1="170.5" x2="215" y2="170.5"/>
</g>
<g font-size="13.5" fill="#3a3531">
<text x="52" y="82" text-anchor="start">superficie</text><text x="208" y="82" text-anchor="end">180 m²</text>
<text x="52" y="119.5" text-anchor="start">année</text><text x="208" y="119.5" text-anchor="end">1995</text>
<text x="52" y="157" text-anchor="start">distance</text><text x="208" y="157" text-anchor="end">8 km</text>
<text x="52" y="194.5" text-anchor="start" fill="#9a5b33">prix</text><text x="208" y="194.5" text-anchor="end" fill="#9a5b33">420 000 $</text>
</g>

<!-- flèche entrée -> modèle -->
<line x1="232" y1="133" x2="281" y2="133" stroke="#5b5249" stroke-width="2" marker-end="url(#arrFlow)"/>

<!-- le modèle -->
<rect x="286" y="93" width="120" height="80" rx="10" fill="#2f6f6a"/>
<text x="346" y="131" font-size="19" fill="#fffdf8" text-anchor="middle" font-weight="600">modèle</text>
<text x="346" y="150" font-size="11" fill="#fffdf8" text-anchor="middle" opacity="0.85">la recette</text>

<!-- flèche modèle -> sortie -->
<line x1="411" y1="133" x2="460" y2="133" stroke="#5b5249" stroke-width="2" marker-end="url(#arrFlow)"/>

<!-- sortie : la réponse -->
<text x="567" y="44" font-size="14" fill="#5b5249" text-anchor="middle">la réponse (la sortie)</text>
<rect x="478" y="100" width="178" height="66" rx="10" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.5"/>
<text x="567" y="136" font-size="23" fill="#3a6ea5" text-anchor="middle" font-weight="700">oui</text>
<text x="567" y="156" font-size="11" fill="#5b5249" text-anchor="middle">vendue en moins de 30 jours</text>
</svg>
