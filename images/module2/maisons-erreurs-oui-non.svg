<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 505" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le prédicteur bête pour la question en oui/non : ses erreurs</title>
<desc>Exactement le nuage de la page précédente — les mêmes maisons, aux mêmes places, la distance au centre-ville en abscisse et l'année de construction en ordonnée. Mais toutes sont maintenant bleues : le prédicteur bête répond « oui » — vendue en moins de 30 jours — pour chacune, sans jamais les regarder. Un ✗ rouge barre celles qui avaient en réalité traîné : ce sont ses erreurs, et ce sont précisément les maisons qui étaient rouges sur la figure d'origine.</desc>

<rect x="0" y="0" width="660" height="505" rx="14" fill="#efe7d3" stroke="#d9cbac"/>

<g stroke="#e0d4b8" stroke-width="1">
<line x1="80" y1="332.7" x2="630" y2="332.7"/>
<line x1="80" y1="223.6" x2="630" y2="223.6"/>
<line x1="80" y1="114.5" x2="630" y2="114.5"/>
</g>

<g stroke="#b8a888" stroke-width="1.6">
<line x1="80" y1="40" x2="80" y2="380"/>
<line x1="80" y1="380" x2="630" y2="380"/>
</g>

<g stroke="#b8a888" stroke-width="1.4">
<line x1="80.0" y1="380" x2="80.0" y2="386"/>
<line x1="190.0" y1="380" x2="190.0" y2="386"/>
