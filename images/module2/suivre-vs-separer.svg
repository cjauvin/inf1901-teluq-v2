<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Suivre le nuage (régression) ou le séparer (classification)</title>
<desc>À gauche, une droite traverse un nuage de points en suivant sa tendance : c'est la régression. À droite, une droite passe entre un groupe de points bleus et un groupe de points rouges pour les départager : c'est la classification. Même droite, deux usages opposés.</desc>
<rect x="0" y="0" width="660" height="360" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<g stroke="#b8a888" stroke-width="1.6" fill="none">
<line x1="55" y1="55" x2="55" y2="285"/>
<line x1="55" y1="285" x2="300" y2="285"/>
</g>
<line x1="72" y1="255" x2="298" y2="95" stroke="#9a5b33" stroke-width="2.6"/>
<g fill="#2f6f6a" stroke="#efe7d3" stroke-width="1.4">
<circle cx="80" cy="235" r="6"/>
<circle cx="96" cy="250" r="6"/>
<circle cx="118" cy="214" r="6"/>
<circle cx="133" cy="229" r="6"/>
<circle cx="152" cy="180" r="6"/>
<circle cx="171" cy="191" r="6"/>
<circle cx="190" cy="186" r="6"/>
<circle cx="213" cy="143" r="6"/>
<circle cx="231" cy="152" r="6"/>
<circle cx="252" cy="111" r="6"/>
<circle cx="270" cy="124" r="6"/>
<circle cx="292" cy="93" r="6"/>
</g>
<g stroke="#b8a888" stroke-width="1.6" fill="none">
<line x1="375" y1="55" x2="375" y2="285"/>
<line x1="375" y1="285" x2="620" y2="285"/>
</g>
<line x1="392" y1="120" x2="612" y2="248" stroke="#9a5b33" stroke-width="2.6"/>
<g fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.4">
<circle cx="410" cy="205" r="6"/>
<circle cx="430" cy="235" r="6"/>
<circle cx="452" cy="210" r="6"/>
<circle cx="468" cy="250" r="6"/>
<circle cx="440" cy="265" r="6"/>
<circle cx="415" cy="238" r="6"/>
<circle cx="485" cy="235" r="6"/>
</g>
<g fill="#c4564a" stroke="#efe7d3" stroke-width="1.4">
<circle cx="505" cy="95" r="6"/>
<circle cx="528" cy="120" r="6"/>
<circle cx="550" cy="98" r="6"/>
<circle cx="572" cy="128" r="6"/>
<circle cx="545" cy="150" r="6"/>
<circle cx="520" cy="150" r="6"/>
<circle cx="575" cy="90" r="6"/>
</g>
<text x="177" y="320" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">régression</text>
<text x="177" y="343" font-size="14" fill="#5b5249" text-anchor="middle">la droite suit les points</text>
<text x="497" y="320" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">classification</text>
<text x="497" y="343" font-size="14" fill="#5b5249" text-anchor="middle">la droite sépare les points</text>
</svg>