<text x="165" y="125" font-size="13" fill="#9a5b33" text-anchor="middle" font-weight="600">Ce que le filtre a jeté</text>
<text x="362" y="106" font-size="14" fill="#3a3531" font-weight="600">Précision</text>
<rect x="362.0" y="118" width="180.0" height="30" fill="#c4564a" stroke="#efe7d3" stroke-width="1.2"/>
<text x="452.0" y="138.0" font-size="13" fill="#fbf7ee" text-anchor="middle" font-weight="700">40</text>
<rect x="542.0" y="118" width="90.0" height="30" fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.2"/>
<text x="587.0" y="138.0" font-size="13" fill="#fbf7ee" text-anchor="middle" font-weight="700">20</text>
<text x="362" y="170" font-size="13" fill="#3a3531">= 40 / 60 = 67 %</text>
<text x="362" y="188" font-size="12" fill="#7a6f63">Parmi ce que le filtre a jeté,</text>
<text x="362" y="204" font-size="12" fill="#7a6f63">la part de vrais pourriels</text>
<text x="362" y="250" font-size="14" fill="#3a3531" font-weight="600">Rappel</text>
<rect x="362.0" y="262" width="216.0" height="30" fill="#c4564a" stroke="#efe7d3" stroke-width="1.2"/>
<text x="470.0" y="282.0" font-size="13" fill="#fbf7ee" text-anchor="middle" font-weight="700">40</text>
<rect x="578.0" y="262" width="54.0" height="30" fill="#e0a89f" stroke="#efe7d3" stroke-width="1.2"/>
<text x="605.0" y="282.0" font-size="13" fill="#fbf7ee" text-anchor="middle" font-weight="700">10</text>
<text x="362" y="314" font-size="13" fill="#3a3531">= 40 / 50 = 80 %</text>
<text x="362" y="332" font-size="12" fill="#7a6f63">Parmi les vrais pourriels,</text>
<text x="362" y="348" font-size="12" fill="#7a6f63">la part que le filtre a attrapée</text>
<circle cx="150" cy="402" r="5" fill="#c4564a"/><text x="160" y="406" font-size="12.5" fill="#3a3531">pourriel</text>
<circle cx="240" cy="402" r="5" fill="#3a6ea5"/><text x="250" y="406" font-size="12.5" fill="#3a3531">courriel légitime</text>
<rect x="380" y="396" width="14" height="12" fill="#e0a89f"/><text x="400" y="406" font-size="12.5" fill="#3a3531">pourriels passés au travers</text>
</svg>
