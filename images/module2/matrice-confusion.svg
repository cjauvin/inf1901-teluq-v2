<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La matrice de confusion d'un filtre anti-pourriel</title>
<desc>Un tableau à quatre cases croisant la réalité (pourriel ou courriel légitime, en lignes) et la décision du filtre (jeté ou gardé, en colonnes), pour 1000 courriels dont 50 pourriels. Vrais positifs : 40 pourriels jetés. Faux négatifs : 10 pourriels gardés. Faux positifs : 20 courriels légitimes jetés. Vrais négatifs : 930 courriels légitimes gardés. Les deux cases d'erreur sont teintées en rouge.</desc>
<rect x="0" y="0" width="660" height="420" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="330" y="44" font-size="16" fill="#3a3531" text-anchor="middle" font-weight="600">1000 courriels, dont 50 pourriels : ce que le filtre en a fait</text>
<text x="400" y="78" font-size="13" fill="#5b5249" text-anchor="middle" font-style="italic">décision du filtre</text>
<text x="305.0" y="104" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="600">jeté</text>
<text x="495.0" y="104" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="600">gardé</text>
<text x="24" y="216" font-size="13" fill="#5b5249" text-anchor="middle" font-style="italic" transform="rotate(-90 24 216)">réalité</text>
<text x="194" y="164.0" font-size="14" fill="#3a3531" text-anchor="end" font-weight="600">pourriel</text>
<text x="194" y="182.0" font-size="12" fill="#7a6f63" text-anchor="end">50 en tout</text>
<text x="194" y="260.0" font-size="14" fill="#3a3531" text-anchor="end" font-weight="600">légitime</text>
<text x="194" y="278.0" font-size="12" fill="#7a6f63" text-anchor="end">950 en tout</text>
<rect x="210" y="120" width="190" height="96" fill="#2f6f6a" fill-opacity="0.1" stroke="#b8a888" stroke-width="1.2"/>
<text x="305.0" y="160" font-size="26" fill="#2f6f6a" text-anchor="middle" font-weight="700">40</text>
<text x="305.0" y="182" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">vrais positifs</text>
<text x="305.0" y="200" font-size="11.5" fill="#7a6f63" text-anchor="middle">pourriels bien jetés</text>
<rect x="400" y="120" width="190" height="96" fill="#c4564a" fill-opacity="0.16" stroke="#b8a888" stroke-width="1.2"/>
<text x="495.0" y="160" font-size="26" fill="#c4564a" text-anchor="middle" font-weight="700">10</text>
<text x="495.0" y="182" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">faux négatifs</text>
<text x="495.0" y="200" font-size="11.5" fill="#7a6f63" text-anchor="middle">pourriels passés au travers</text>
<rect x="210" y="216" width="190" height="96" fill="#c4564a" fill-opacity="0.16" stroke="#b8a888" stroke-width="1.2"/>
<text x="305.0" y="256" font-size="26" fill="#c4564a" text-anchor="middle" font-weight="700">20</text>
<text x="305.0" y="278" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">faux positifs</text>
<text x="305.0" y="296" font-size="11.5" fill="#7a6f63" text-anchor="middle">vrais courriels jetés</text>
<rect x="400" y="216" width="190" height="96" fill="#2f6f6a" fill-opacity="0.1" stroke="#b8a888" stroke-width="1.2"/>
<text x="495.0" y="256" font-size="26" fill="#2f6f6a" text-anchor="middle" font-weight="700">930</text>
<text x="495.0" y="278" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">vrais négatifs</text>
<text x="495.0" y="296" font-size="11.5" fill="#7a6f63" text-anchor="middle">vrais courriels bien gardés</text>
<g font-size="13" fill="#3a3531" text-anchor="middle">
<text x="330" y="352">Taux de bonnes réponses : (40 + 930) / 1000 = 97 %, à peine mieux que « jamais un pourriel » (95 %)</text>
<text x="330" y="376">Précision : 40 / (40 + 20) = 67 %  ·  Rappel : 40 / (40 + 10) = 80 %</text>
</g>
</svg>
