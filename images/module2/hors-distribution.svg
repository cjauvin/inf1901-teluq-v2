<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Hors distribution : la droite répond, mais plus rien ne la garantit</title>
<desc>Le nuage des vingt maisons (de 112 à 280 m²) et sa droite, avec la zone couverte par les données ombrée. Loin à droite, un manoir de 600 m² pour lequel la droite, prolongée en pointillé, annonce un prix d'environ 1696 000 dollars, accompagné d'un point d'interrogation : le modèle répond avec le même aplomb, mais aucune donnée ne le soutient plus.</desc>
