<text x="470" y="112" font-size="13" fill="#3a3531" text-anchor="end">Un manoir de 600 m² : la droite annonce 1696 k$,</text>
<text x="470" y="130" font-size="12" fill="#7a6f63" text-anchor="end">avec le même aplomb, mais plus rien ne la garantit</text>
<text x="330" y="458" font-size="13" fill="#5b5249" text-anchor="middle">Dans la zone couverte, le score du test veut dire quelque chose ; au-delà, il ne dit plus rien.</text>
