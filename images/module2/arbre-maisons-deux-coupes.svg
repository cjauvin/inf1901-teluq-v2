<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Deux questions à égalité : la distance ou l'année</title>
<desc>Deux fois le même petit plan distance × année avec les vingt maisons. À gauche, la coupe verticale de la question « À plus de 11 km du centre ? » : bleu à gauche, rouge à droite. À droite, la coupe horizontale de la question « Construite après 1989 ? » : bleu en haut, rouge en bas. Dans les deux cas, les mêmes deux exceptions sont du mauvais côté : deux erreurs sur vingt, à égalité.</desc>
