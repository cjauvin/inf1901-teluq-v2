<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>L'arbre de régression : le prix par paliers</title>
<desc>Le nuage des maisons (superficie, prix) avec, en pointillé pâle, la droite ajustée, et en trait plein brun un escalier à quatre marches : l'arbre de régression à deux niveaux de questions coupe la superficie à 194 m², puis à 154 et à 237, et prédit dans chaque intervalle le prix moyen des maisons qui s'y trouvent.</desc>

<rect x="0" y="0" width="660" height="460" rx="14" fill="#efe7d3" stroke="#d9cbac"/>

