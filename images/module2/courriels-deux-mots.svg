<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Des courriels placés dans le plan de deux mots du vocabulaire</title>
<desc>Un plan dont les deux axes sont deux mots du vocabulaire : en abscisse, le nombre de fois où « gratuit » apparaît dans le courriel ; en ordonnée, le nombre de fois où « réunion » y apparaît. Chaque courriel est un point à coordonnées entières. Les pourriels, en rouge, se massent le long de l'axe « gratuit » ; les courriels légitimes, en bleu, le long de l'axe « réunion ». Deux courriels sont nommés : « Cliquez ici, c'est gratuit ! », en (1, 0), et « Le rapport pour la réunion de lundi », en (0, 1).</desc>
<rect x="0" y="0" width="660" height="520" rx="14" fill="#efe7d3" stroke="#d9cbac"/>

<!-- grille aux valeurs entières -->
<g stroke="#e0d4b8" stroke-width="1">
<line x1="80" y1="318" x2="630" y2="318"/><line x1="80" y1="256" x2="630" y2="256"/><line x1="80" y1="194" x2="630" y2="194"/><line x1="80" y1="132" x2="630" y2="132"/><line x1="80" y1="70" x2="630" y2="70"/>
<line x1="180" y1="40" x2="180" y2="380"/><line x1="280" y1="40" x2="280" y2="380"/><line x1="380" y1="40" x2="380" y2="380"/><line x1="480" y1="40" x2="480" y2="380"/><line x1="580" y1="40" x2="580" y2="380"/>
</g>
<g stroke="#b8a888" stroke-width="1.6">
<line x1="80" y1="40" x2="80" y2="380"/>
<line x1="80" y1="380" x2="630" y2="380"/>
</g>
<g font-size="13" fill="#5b5249" text-anchor="middle">
<text x="80" y="402">0</text><text x="180" y="402">1</text><text x="280" y="402">2</text><text x="380" y="402">3</text><text x="480" y="402">4</text><text x="580" y="402">5</text>
<text x="355" y="430" font-size="15" fill="#3a3531">nombre de fois où « gratuit » apparaît</text>
</g>
<g font-size="13" fill="#5b5249" text-anchor="end">
<text x="68" y="384.5">0</text><text x="68" y="322.5">1</text><text x="68" y="260.5">2</text><text x="68" y="198.5">3</text><text x="68" y="136.5">4</text><text x="68" y="74.5">5</text>
</g>
<text x="18" y="210" font-size="15" fill="#3a3531" text-anchor="middle" transform="rotate(-90 18 210)">nombre de fois où « réunion » apparaît</text>

<!-- les deux courriels nommés -->
<g font-size="13" fill="#3a3531" font-style="italic">
<text x="150" y="232" text-anchor="start">« Le rapport pour la réunion de lundi »</text>
<text x="205" y="292" text-anchor="start">« Cliquez ici, c'est gratuit ! »</text>
</g>
<g stroke="#8c8175" stroke-width="1.2" stroke-dasharray="3 3" fill="none">
<line x1="146" y1="236" x2="88" y2="311"/>
<line x1="201" y1="296" x2="184" y2="371"/>
</g>

<!-- pourriels -->
<g fill="#c4564a" stroke="#efe7d3" stroke-width="1.5">
<circle cx="180" cy="380" r="7"/><circle cx="280" cy="380" r="7"/><circle cx="380" cy="380" r="7"/><circle cx="580" cy="380" r="7"/>
<circle cx="280" cy="318" r="7"/><circle cx="480" cy="318" r="7"/><circle cx="580" cy="256" r="7"/>
</g>
<!-- courriels légitimes -->
<g fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.5">
<circle cx="80" cy="318" r="7"/><circle cx="80" cy="256" r="7"/><circle cx="80" cy="132" r="7"/><circle cx="80" cy="70" r="7"/>
<circle cx="180" cy="256" r="7"/><circle cx="180" cy="194" r="7"/><circle cx="180" cy="132" r="7"/>
</g>

<!-- légende -->
<circle cx="170" cy="470" r="7" fill="#c4564a" stroke="#efe7d3" stroke-width="1.5"/>
<text x="186" y="474" font-size="14" fill="#3a3531" text-anchor="start">pourriel</text>
<circle cx="300" cy="470" r="7" fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.5"/>
<text x="316" y="474" font-size="14" fill="#3a3531" text-anchor="start">courriel légitime</text>
<text x="355" y="502" font-size="13" fill="#5b5249" text-anchor="middle">Deux mots du vocabulaire, donc deux axes parmi des dizaines de milliers.</text>
</svg>
