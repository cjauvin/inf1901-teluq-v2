<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Du classifieur naïf au réseau bayésien</title>
<desc>Deux panneaux. À gauche, le classifieur bayésien naïf dessiné comme un graphe : un nœud « pourriel ? » relié par des flèches à trois nœuds de mots, « gratuit », « carte » et « réunion », sans flèche entre les mots. À droite, un réseau bayésien plus riche : « grippe » pointe vers « fièvre » et « toux », « rhume » pointe aussi vers « toux », et « fièvre » pointe vers « fatigue ».</desc>
<defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
<rect x="0" y="0" width="700" height="330" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="350.0" y="34" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Deux réseaux bayésiens</text>
<rect x="22" y="54" width="320" height="250" rx="10" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.2"/>
<text x="182" y="80" font-size="13.5" fill="#3a3531" text-anchor="middle" font-weight="700">Le classifieur naïf</text>
<text x="182" y="98" font-size="12" fill="#5b5249" text-anchor="middle">les mots ne dépendent que de la classe</text>
<rect x="358" y="54" width="320" height="250" rx="10" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.2"/>
<text x="518" y="80" font-size="13.5" fill="#3a3531" text-anchor="middle" font-weight="700">Un réseau plus riche</text>
<text x="518" y="98" font-size="12" fill="#5b5249" text-anchor="middle">chaque flèche est une influence directe</text>
<line x1="164.9" y1="167.1" x2="98.6" y2="233.4" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#pointe)"/>
<line x1="182.0" y1="168.0" x2="182.0" y2="232.0" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#pointe)"/>
<line x1="199.1" y1="167.1" x2="265.4" y2="233.4" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#pointe)"/>
<rect x="127.0" y="132" width="110" height="36" rx="18" fill="#fbf7ee" stroke="#c4564a" stroke-width="2"/>
<text x="182" y="154.5" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">pourriel ?</text>
<rect x="39.0" y="232" width="86" height="36" rx="18" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="2"/>
<text x="82" y="254.5" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">gratuit</text>
<rect x="139.0" y="232" width="86" height="36" rx="18" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="2"/>
<text x="182" y="254.5" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">carte</text>
<rect x="239.0" y="232" width="86" height="36" rx="18" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="2"/>
<text x="282" y="254.5" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">réunion</text>
<line x1="444.9" y1="162.9" x2="435.1" y2="197.1" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#pointe)"/>
<line x1="473.6" y1="160.0" x2="536.4" y2="200.0" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#pointe)"/>
<line x1="590.0" y1="162.5" x2="570.0" y2="197.5" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#pointe)"/>
<line x1="441.6" y1="232.3" x2="458.4" y2="257.7" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#pointe)"/>
<rect x="407.0" y="127" width="86" height="36" rx="18" fill="#fbf7ee" stroke="#c4564a" stroke-width="2"/>
<text x="450" y="149.5" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">grippe</text>
<rect x="557.0" y="127" width="86" height="36" rx="18" fill="#fbf7ee" stroke="#c4564a" stroke-width="2"/>
<text x="600" y="149.5" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">rhume</text>
<rect x="387.0" y="197" width="86" height="36" rx="18" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="2"/>
<text x="430" y="219.5" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">fièvre</text>
<rect x="517.0" y="197" width="86" height="36" rx="18" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="2"/>
<text x="560" y="219.5" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">toux</text>
<rect x="427.0" y="257" width="86" height="36" rx="18" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="2"/>
<text x="470" y="279.5" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">fatigue</text>
<text x="350.0" y="320" font-size="12" fill="#7a6f63" text-anchor="middle">En rouge, les causes ; en bleu, ce qu'on observe.</text>
</svg>
