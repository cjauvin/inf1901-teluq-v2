<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le XOR : aucune droite ne sépare les deux classes</title>
<desc>Quatre points aux coins d'un carré : deux bleus sur une diagonale (en bas à gauche et en haut à droite), deux rouges sur l'autre diagonale (en haut à gauche et en bas à droite) — la configuration du XOR. Deux panneaux montrent chacun une droite différente qui tente de séparer les bleus des rouges ; dans les deux cas, un point reste du mauvais côté, cerclé de rouge. Aucune droite ne peut réussir.</desc>
<rect x="0" y="0" width="720" height="330" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<rect x="60" y="58" width="200" height="200" rx="8" fill="#f6efdd" stroke="#d9cbac" stroke-width="1.4"/>
<line x1="78" y1="240" x2="246" y2="240" stroke="#c3b79a" stroke-width="1.3"/>
<line x1="78" y1="240" x2="78" y2="72" stroke="#c3b79a" stroke-width="1.3"/>
<text x="244" y="252" font-size="11" fill="#8a7d6e" text-anchor="end" font-style="italic">x₁</text>
<text x="72" y="76" font-size="11" fill="#8a7d6e" text-anchor="start" font-style="italic">x₂</text>
<text x="160" y="46" font-size="13.5" fill="#5b5249" text-anchor="middle" font-weight="600">Une droite…</text>
<line x1="60" y1="128" x2="190" y2="258" stroke="#5b5249" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="230" cy="88" r="18" fill="none" stroke="#c4564a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="252" y="74" font-size="15" fill="#c4564a" text-anchor="middle" font-weight="700">✗</text>
<circle cx="90" cy="228" r="12" fill="#3a6ea5" stroke="#f3ecda" stroke-width="2"/>
<circle cx="230" cy="88" r="12" fill="#3a6ea5" stroke="#f3ecda" stroke-width="2"/>
<circle cx="90" cy="88" r="12" fill="#c4564a" stroke="#f3ecda" stroke-width="2"/>
<circle cx="230" cy="228" r="12" fill="#c4564a" stroke="#f3ecda" stroke-width="2"/>
<rect x="430" y="58" width="200" height="200" rx="8" fill="#f6efdd" stroke="#d9cbac" stroke-width="1.4"/>
<line x1="448" y1="240" x2="616" y2="240" stroke="#c3b79a" stroke-width="1.3"/>
<line x1="448" y1="240" x2="448" y2="72" stroke="#c3b79a" stroke-width="1.3"/>
<text x="614" y="252" font-size="11" fill="#8a7d6e" text-anchor="end" font-style="italic">x₁</text>
<text x="442" y="76" font-size="11" fill="#8a7d6e" text-anchor="start" font-style="italic">x₂</text>
<text x="530" y="46" font-size="13.5" fill="#5b5249" text-anchor="middle" font-weight="600">…ou une autre</text>
<line x1="500" y1="58" x2="630" y2="188" stroke="#5b5249" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="460" cy="228" r="18" fill="none" stroke="#c4564a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="482" y="214" font-size="15" fill="#c4564a" text-anchor="middle" font-weight="700">✗</text>
<circle cx="460" cy="228" r="12" fill="#3a6ea5" stroke="#f3ecda" stroke-width="2"/>
<circle cx="600" cy="88" r="12" fill="#3a6ea5" stroke="#f3ecda" stroke-width="2"/>
<circle cx="460" cy="88" r="12" fill="#c4564a" stroke="#f3ecda" stroke-width="2"/>
<circle cx="600" cy="228" r="12" fill="#c4564a" stroke="#f3ecda" stroke-width="2"/>
<text x="360" y="298" font-size="13.5" fill="#3a3531" text-anchor="middle">Le XOR : les bleus sur une diagonale, les rouges sur l'autre. Quelle que soit la droite,</text>
<text x="360" y="317" font-size="13.5" fill="#3a3531" text-anchor="middle">un point reste toujours du mauvais côté (cerclé de rouge).</text>
</svg>