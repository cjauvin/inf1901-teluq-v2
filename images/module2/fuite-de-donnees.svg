<svg viewBox="0 0 660 356" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Une fuite de données : le test n'est plus neuf</title>
<desc>Le même découpage entraînement / test, mais deux exemples du bloc de test ont un jumeau dans le bloc d'entraînement, reliés par un trait pointillé : les mêmes exemples, sous un déguisement. Le modèle les reconnaît au lieu de généraliser, et le score du test ment.</desc>
<rect x="0" y="0" width="660" height="356" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="330" y="40" font-size="16" fill="#3a3531" text-anchor="middle" font-weight="600">Une fuite : deux exemples du test ont un jumeau dans l'entraînement</text>
<rect x="40" y="70" width="395" height="176" rx="11" fill="#2f6f6a" fill-opacity="0.07" stroke="#b8a888" stroke-width="1.4"/>
<g fill="#2f6f6a" stroke="#efe7d3" stroke-width="1.3">
<circle cx="76.5" cy="115" r="7"/>
<circle cx="122.5" cy="115" r="7"/>
<circle cx="168.5" cy="115" r="7"/>
<circle cx="214.5" cy="115" r="7"/>
<circle cx="260.5" cy="115" r="7"/>
<circle cx="306.5" cy="115" r="7"/>
<circle cx="352.5" cy="115" r="7"/>
<circle cx="398.5" cy="115" r="7"/>
<circle cx="76.5" cy="147" r="7"/>
<circle cx="122.5" cy="147" r="7"/>
<circle cx="168.5" cy="147" r="7"/>
<circle cx="214.5" cy="147" r="7"/>
<circle cx="260.5" cy="147" r="7"/>
<circle cx="306.5" cy="147" r="7"/>
<circle cx="398.5" cy="147" r="7"/>
<circle cx="76.5" cy="179" r="7"/>
<circle cx="122.5" cy="179" r="7"/>
<circle cx="168.5" cy="179" r="7"/>
<circle cx="214.5" cy="179" r="7"/>
<circle cx="260.5" cy="179" r="7"/>
<circle cx="306.5" cy="179" r="7"/>
<circle cx="352.5" cy="179" r="7"/>
<circle cx="398.5" cy="179" r="7"/>
<circle cx="76.5" cy="211" r="7"/>
<circle cx="122.5" cy="211" r="7"/>
<circle cx="168.5" cy="211" r="7"/>
<circle cx="214.5" cy="211" r="7"/>
<circle cx="260.5" cy="211" r="7"/>
<circle cx="306.5" cy="211" r="7"/>
<circle cx="352.5" cy="211" r="7"/>
</g>
<g fill="#9a5b33" stroke="#c4564a" stroke-width="2">
<circle cx="352.5" cy="147" r="7"/>
<circle cx="398.5" cy="211" r="7"/>
</g>
<g stroke="#c4564a" stroke-width="1.4" fill="none" stroke-dasharray="4 4">
<path d="M361.5 145 C 412.5 125, 460.0 125, 501.0 145"/>
<path d="M407.5 209 C 458.5 189, 535.0 189, 576.0 209"/>
</g>
<text x="238" y="93" font-size="12.5" fill="#5b5249" text-anchor="middle">≈ 4 cinquièmes</text>
<text x="238" y="270" font-size="15" fill="#2f6f6a" text-anchor="middle" font-weight="600">Ensemble d'entraînement</text>
<text x="238" y="290" font-size="12.5" fill="#7a6f63" text-anchor="middle">Le modèle apprend ici</text>
<rect x="475" y="70" width="145" height="176" rx="11" fill="#9a5b33" fill-opacity="0.08" stroke="#9a5b33" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.95"/>
<g fill="#9a5b33" stroke="#efe7d3" stroke-width="1.3">
<circle cx="510.0" cy="115" r="7"/>
<circle cx="585.0" cy="115" r="7"/>
<circle cx="510.0" cy="147" r="7"/>
<circle cx="585.0" cy="147" r="7"/>
<circle cx="510.0" cy="179" r="7"/>
<circle cx="585.0" cy="179" r="7"/>
<circle cx="510.0" cy="211" r="7"/>
<circle cx="585.0" cy="211" r="7"/>
</g>
<text x="548" y="93" font-size="12.5" fill="#5b5249" text-anchor="middle">≈ 1 cinquième</text>
<text x="548" y="270" font-size="15" fill="#9a5b33" text-anchor="middle" font-weight="600">Ensemble de test</text>
<text x="548" y="290" font-size="12.5" fill="#7a6f63" text-anchor="middle">Censé être neuf</text>
<text x="330" y="330" font-size="13" fill="#5b5249" text-anchor="middle">Le modèle reconnaît ces deux-là au lieu de généraliser : le score du test le récompense pour sa mémoire.</text>
</svg>
