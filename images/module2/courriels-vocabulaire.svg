<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>L'espace du vocabulaire : le courriel entier est un seul point</title>
<desc>Le même dessin que pour l'image faite de pixels, transposé aux mots. D'une origine partent en éventail des axes, un par mot du vocabulaire : « gratuit », « réunion », « bonjour », trois points pour les dizaines de milliers d'autres mots, puis « zèbre », le dernier. Dans cet espace est posée une vignette minuscule, un courriel vu de loin, reliée par des pointillés à un panneau agrandi où on le lit : « Objet : Cliquez ici, c'est gratuit ! », suivi d'un boniment publicitaire. La vignette et le panneau sont bordés de rouge, c'est un pourriel. À côté, d'autres courriels : des points rouges (pourriels) et bleus (courriels légitimes).</desc>
<rect x="0" y="0" width="660" height="450" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8a888"/></marker></defs>
<g stroke="#b8a888" stroke-width="1.6" marker-end="url(#fl)">
<line x1="70" y1="340" x2="70.0" y2="70.0"/>
<line x1="70" y1="340" x2="196.8" y2="101.6"/>
<line x1="70" y1="340" x2="282.8" y2="173.8"/>
<line x1="70" y1="340" x2="340.0" y2="340.0"/>
</g>
<g font-size="15" fill="#3a3531">
<text x="70" y="54" text-anchor="middle">« gratuit »</text>
<text x="197" y="88" text-anchor="middle">« réunion »</text>
<text x="295" y="178" text-anchor="start">« bonjour »</text>
<text x="352" y="345" text-anchor="start">« zèbre »</text>
</g>
<g fill="#8c8175">
<circle cx="309.6" cy="252.8" r="2.6"/>
<circle cx="318.5" cy="282.6" r="2.6"/>
<circle cx="323.6" cy="313.3" r="2.6"/>
</g>
<g stroke="#8c8175" stroke-width="1.2" stroke-dasharray="4 4" fill="none">
<line x1="238" y1="139" x2="430" y2="100"/>
<line x1="238" y1="181" x2="430" y2="310"/>
</g>
<g fill="#c4564a" stroke="#efe7d3" stroke-width="1.5">
<circle cx="172" cy="202" r="6"/>
<circle cx="255" cy="250" r="6"/>
</g><g fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.5">
<circle cx="160" cy="220" r="6"/>
<circle cx="145" cy="240" r="6"/>
<circle cx="290" cy="275" r="6"/>
</g>
<rect x="206" y="139" width="32" height="42" fill="#fbf7ee" stroke="#c4564a" stroke-width="1.6"/>
<g stroke="#b8a888" stroke-width="1" stroke-linecap="round">
<line x1="210" y1="145" x2="229.2" y2="145" stroke="#8c8175"/>
<line x1="210" y1="150" x2="231.6" y2="150"/>
<line x1="210" y1="155" x2="226.8" y2="155"/>
<line x1="210" y1="160" x2="230.4" y2="160"/>
<line x1="210" y1="165" x2="224.4" y2="165"/>
<line x1="210" y1="170" x2="231.6" y2="170"/>
<line x1="210" y1="175" x2="219.6" y2="175"/>
</g>
<text x="535" y="88" font-size="13" fill="#5b5249" font-style="italic" text-anchor="middle">Le même courriel, de près</text>
<rect x="430" y="100" width="210" height="210" rx="4" fill="#fbf7ee" stroke="#c4564a" stroke-width="1.6"/>
<text x="442" y="124" font-size="11" fill="#3a3531" font-weight="700">Objet : Cliquez ici, c'est gratuit !</text>
<line x1="442" y1="134" x2="628" y2="134" stroke="#d9cbac" stroke-width="1"/>
<g font-size="12" fill="#5b5249">
<text x="442" y="158">Félicitations ! Vous avez été</text>
<text x="442" y="178">choisi pour recevoir un</text>
<text x="442" y="198">téléphone dernier cri. Cliquez</text>
<text x="442" y="218">ici avant minuit : livraison</text>
<text x="442" y="238">offerte, sans engagement.</text>
<text x="442" y="258">Offre réservée aux 100</text>
<text x="442" y="278">premiers, ne tardez pas !</text>
</g>
<circle cx="200" cy="376" r="6" fill="#c4564a" stroke="#efe7d3" stroke-width="1.5"/>
<text x="214" y="380" font-size="14" fill="#3a3531">pourriel</text>
<circle cx="320" cy="376" r="6" fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.5"/>
<text x="334" y="380" font-size="14" fill="#3a3531">courriel légitime</text>
<g font-size="13" fill="#5b5249" text-anchor="middle">
<text x="330" y="410">Le courriel entier est un seul point de cet espace ; les autres points, d'autres courriels.</text>
<text x="330" y="430">Un axe par mot du vocabulaire, donc des dizaines de milliers d'axes.</text>
</g>
</svg>
