<text x="570.0" y="236" font-size="11.5" fill="#5b5249" text-anchor="middle">0 sur 5</text>
<text x="330" y="338" font-size="13" fill="#5b5249" text-anchor="middle">Chaque feuille : maisons vendues vite sur maisons de la feuille ; 0 erreur sur 20, mais six feuilles</text>
