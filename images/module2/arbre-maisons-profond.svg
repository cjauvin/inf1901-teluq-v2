<text x="90.0" y="236" font-size="11.5" fill="#5b5249" text-anchor="middle">8 sur 8</text>
<line x1="186.0" y1="144" x2="234.0" y2="192" stroke="#b8a888" stroke-width="1.4"/>
<text x="220.0" y="172.0" font-size="11.5" fill="#7a6f63" text-anchor="start" font-style="italic">oui</text>
<rect x="158.2" y="192" width="151.6" height="30" rx="7" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.2"/>
<text x="234.0" y="212" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">À plus de 5,5 km ?</text>
