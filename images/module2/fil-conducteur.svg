<text x="277" y="153" font-size="11" fill="#6b625a" text-anchor="middle">de prédiction,</text>
<text x="277" y="165" font-size="11" fill="#6b625a" text-anchor="middle">réglable par</text>
<text x="277" y="177" font-size="11" fill="#6b625a" text-anchor="middle">des paramètres</text>
