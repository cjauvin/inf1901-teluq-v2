<svg viewBox="0 0 720 304" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le fil conducteur du module : données, modèle, erreur, généraliser</title>
<desc>Une épine dorsale en quatre stations, chacune glosée : « données » (les exemples dont on dispose), « modèle » (une fonction de prédiction, réglable par des paramètres), « erreur » (à quel point le modèle est bon pour prédire les exemples) et « généraliser » (bien prédire des exemples jamais vus). Entre « modèle » et « erreur », une boucle de retour figure l'entraînement : on règle les paramètres du modèle pour minimiser l'erreur de prédiction, encore et encore.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5b5249" stroke-width="1.7"/></marker>
<marker id="art" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2f6f6a" stroke-width="1.9"/></marker>
</defs>
