<line x1="341.0" y1="88.0" x2="380.0" y2="88.0" stroke="#5b5249" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="508.0" y1="88.0" x2="547.0" y2="88.0" stroke="#5b5249" stroke-width="1.8" marker-end="url(#ar)"/>
