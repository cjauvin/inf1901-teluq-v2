<svg viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Les trois façons d'apprendre</title>
<desc>Trois panneaux. Supervisé : des points étiquetés (bleus et rouges), la réponse est donnée. Non supervisé : les mêmes points, tous gris (sans étiquette), que l'algorithme regroupe en cercles pointillés. Renforcement : une boucle entre un agent et son environnement, reliée par une action et une récompense.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5b5249" stroke-width="1.7"/></marker>
</defs>
<rect x="0" y="0" width="680" height="270" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<rect x="16" y="20" width="205" height="180" rx="10" fill="none" stroke="#e0d4b8" stroke-width="1.3"/>
<rect x="237" y="20" width="205" height="180" rx="10" fill="none" stroke="#e0d4b8" stroke-width="1.3"/>
<rect x="458" y="20" width="205" height="180" rx="10" fill="none" stroke="#e0d4b8" stroke-width="1.3"/>
<g fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.2">
<circle cx="61" cy="150" r="5.5"/>
<circle cx="78" cy="165" r="5.5"/>
<circle cx="54" cy="132" r="5.5"/>
<circle cx="86" cy="145" r="5.5"/>
<circle cx="69" cy="138" r="5.5"/>
</g>
<g fill="#c4564a" stroke="#efe7d3" stroke-width="1.2">
<circle cx="136" cy="80" r="5.5"/>
<circle cx="156" cy="95" r="5.5"/>
<circle cx="131" cy="105" r="5.5"/>
<circle cx="166" cy="78" r="5.5"/>
<circle cx="148" cy="92" r="5.5"/>
</g>
<ellipse cx="290" cy="146" rx="30" ry="27" fill="none" stroke="#8a7d6e" stroke-width="1.5" stroke-dasharray="5 5"/>
<ellipse cx="368" cy="90" rx="30" ry="24" fill="none" stroke="#8a7d6e" stroke-width="1.5" stroke-dasharray="5 5"/>
<g fill="#9a8f7e" stroke="#efe7d3" stroke-width="1.2">
<circle cx="282" cy="150" r="5.5"/>
<circle cx="299" cy="165" r="5.5"/>
<circle cx="275" cy="132" r="5.5"/>
<circle cx="307" cy="145" r="5.5"/>
<circle cx="290" cy="138" r="5.5"/>
</g>
<g fill="#9a8f7e" stroke="#efe7d3" stroke-width="1.2">
<circle cx="357" cy="80" r="5.5"/>
<circle cx="377" cy="95" r="5.5"/>
<circle cx="352" cy="105" r="5.5"/>
<circle cx="387" cy="78" r="5.5"/>
<circle cx="369" cy="92" r="5.5"/>
</g>
<rect x="468" y="76" width="52" height="32" rx="9" fill="#efe7d3" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="494" y="96" font-size="12" fill="#3a3531" text-anchor="middle" font-weight="600">agent</text>
<rect x="572" y="76" width="84" height="32" rx="9" fill="#efe7d3" stroke="#9a5b33" stroke-width="1.8"/>
<text x="614" y="96" font-size="11" fill="#3a3531" text-anchor="middle" font-weight="600">environnement</text>
<path d="M 520 84 Q 546 48 572 84" fill="none" stroke="#5b5249" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="546" y="44" font-size="12" fill="#3a3531" text-anchor="middle">action</text>
<path d="M 572 100 Q 546 136 520 100" fill="none" stroke="#5b5249" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="546" y="154" font-size="12" fill="#3a3531" text-anchor="middle">récompense</text>
<text x="118" y="230" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">supervisé</text>
<text x="118" y="250" font-size="12" fill="#7a6f63" text-anchor="middle">la réponse est donnée</text>
<text x="340" y="230" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">non supervisé</text>
<text x="340" y="250" font-size="12" fill="#7a6f63" text-anchor="middle">on découvre des groupes</text>
<text x="560" y="230" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">renforcement</text>
<text x="560" y="250" font-size="12" fill="#7a6f63" text-anchor="middle">agir, puis être récompensé</text>
</svg>