</g>
<circle cx="340" cy="205" r="11" fill="#efe7d3" stroke="#3a3531" stroke-width="2.4"/>
<text x="340" y="210" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="700">?</text>
<text x="340" y="62" font-size="16" fill="#3a3531" text-anchor="middle" font-weight="600">à qui je ressemble le plus ?</text>
<line x1="340" y1="74" x2="340" y2="190" stroke="#8a7d6e" stroke-width="1.4" marker-end="url(#arrb)"/>
<text x="230" y="342" font-size="14.5" fill="#3a6ea5" text-anchor="middle" font-weight="600">portrait du « bleu »</text>
<text x="452" y="80" font-size="14.5" fill="#c4564a" text-anchor="middle" font-weight="600">portrait du « rouge »</text>
</svg>