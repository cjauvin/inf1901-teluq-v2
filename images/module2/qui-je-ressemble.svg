<svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>À quel portrait le point ressemble-t-il le plus ?</title>
<desc>Deux nuages de points, l'un bleu, l'autre rouge, chacun entouré d'un halo évoquant sa répartition (son portrait). Un point neuf, à classer, se trouve entre les deux et demande : à qui je ressemble le plus ? C'est l'idée de la classification générative.</desc>
<defs>
<marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8a7d6e" stroke-width="1.6"/></marker>
</defs>
