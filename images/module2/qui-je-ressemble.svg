<ellipse cx="452" cy="150" rx="86" ry="60" fill="#c4564a" opacity="0.13"/>
<ellipse cx="452" cy="150" rx="86" ry="60" fill="none" stroke="#c4564a" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.6"/>
<g stroke="#8a7d6e" stroke-width="1.4" stroke-dasharray="3 4" fill="none">
<line x1="334" y1="209" x2="262" y2="244" marker-end="url(#arrb)"/>
<line x1="346" y1="201" x2="420" y2="158" marker-end="url(#arrb)"/>
</g>
<g fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.3">
<circle cx="200" cy="230" r="6"/>
<circle cx="245" cy="238" r="6"/>
<circle cx="215" cy="266" r="6"/>
<circle cx="258" cy="260" r="6"/>
<circle cx="228" cy="248" r="6"/>
<circle cx="190" cy="256" r="6"/>
<circle cx="252" cy="224" r="6"/>
<circle cx="222" cy="280" r="6"/>
<circle cx="270" cy="246" r="6"/>
</g>
<g fill="#c4564a" stroke="#efe7d3" stroke-width="1.3">
<circle cx="422" cy="135" r="6"/>
<circle cx="466" cy="142" r="6"/>
<circle cx="440" cy="162" r="6"/>
<circle cx="480" cy="156" r="6"/>
<circle cx="452" cy="148" r="6"/>
<circle cx="415" cy="166" r="6"/>
