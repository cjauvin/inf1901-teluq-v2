<svg viewBox="0 0 700 270" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Programmation classique ou apprentissage automatique</title>
<desc>Deux schémas de flux. À gauche (programmation classique) : on fournit à l'ordinateur les règles et les données, il produit les réponses. À droite (apprentissage automatique) : on lui fournit les données et les réponses, il produit les règles (le modèle). Les « règles » (en brun) et les « réponses » (en teal) changent de côté d'un panneau à l'autre.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5b5249" stroke-width="1.7"/></marker></defs>
<rect x="0" y="0" width="700" height="270" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<line x1="350" y1="44" x2="350" y2="232" stroke="#e0d4b8" stroke-width="1.4"/>
<text x="178" y="38" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="700">Programmation classique</text>
<rect x="30" y="80" width="88" height="40" rx="9" fill="rgba(138,125,110,0.14)" stroke="#8a7d6e" stroke-width="1.8"/>
<text x="74" y="100" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="600" dominant-baseline="middle">données</text>
<rect x="30" y="156" width="88" height="40" rx="9" fill="rgba(154,91,51,0.16)" stroke="#9a5b33" stroke-width="1.8"/>
<text x="74" y="176" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="600" dominant-baseline="middle">règles</text>
<rect x="134" y="109" width="100" height="58" rx="9" fill="#e8dcc0" stroke="#5b5249" stroke-width="1.8"/>
<text x="184" y="138" font-size="12" fill="#3a3531" text-anchor="middle" font-weight="600" dominant-baseline="middle">programme</text>
<text x="184" y="181" font-size="11.5" fill="#7a6f63" text-anchor="middle">(algorithme)</text>
<rect x="248" y="118" width="84" height="40" rx="9" fill="rgba(47,111,106,0.16)" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="290" y="138" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="600" dominant-baseline="middle">réponses</text>
<line x1="118" y1="104" x2="134" y2="126" stroke="#5b5249" stroke-width="1.7" marker-end="url(#a)"/>
<line x1="118" y1="172" x2="134" y2="150" stroke="#5b5249" stroke-width="1.7" marker-end="url(#a)"/>
<line x1="234" y1="138" x2="248" y2="138" stroke="#5b5249" stroke-width="1.7" marker-end="url(#a)"/>
<text x="522" y="38" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="700">Apprentissage automatique</text>
<rect x="374" y="80" width="88" height="40" rx="9" fill="rgba(138,125,110,0.14)" stroke="#8a7d6e" stroke-width="1.8"/>
<text x="418" y="100" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="600" dominant-baseline="middle">données</text>
<rect x="374" y="156" width="88" height="40" rx="9" fill="rgba(47,111,106,0.16)" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="418" y="176" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="600" dominant-baseline="middle">réponses</text>
<rect x="478" y="109" width="100" height="58" rx="9" fill="#e8dcc0" stroke="#5b5249" stroke-width="1.8"/>
<text x="528" y="138" font-size="12" fill="#3a3531" text-anchor="middle" font-weight="600" dominant-baseline="middle">apprentissage</text>
<text x="528" y="181" font-size="11.5" fill="#7a6f63" text-anchor="middle">(algorithme)</text>
<rect x="592" y="118" width="84" height="40" rx="9" fill="rgba(154,91,51,0.16)" stroke="#9a5b33" stroke-width="1.8"/>
<text x="634" y="138" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="600" dominant-baseline="middle">règles</text>
<text x="634" y="172" font-size="11.5" fill="#7a6f63" text-anchor="middle">(le modèle)</text>
<line x1="462" y1="104" x2="478" y2="126" stroke="#5b5249" stroke-width="1.7" marker-end="url(#a)"/>
<line x1="462" y1="172" x2="478" y2="150" stroke="#5b5249" stroke-width="1.7" marker-end="url(#a)"/>
<line x1="578" y1="138" x2="592" y2="138" stroke="#5b5249" stroke-width="1.7" marker-end="url(#a)"/>
<text x="350" y="252" font-size="12" fill="#7a6f63" text-anchor="middle">Les règles (brun) et les réponses (teal) changent de côté</text>
</svg>