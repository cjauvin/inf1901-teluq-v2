<rect x="50" y="78.0" width="84" height="84" fill="none" stroke="#d9cbac" stroke-width="1.5"/>
<text x="92.0" y="178.0" font-size="11" fill="#5b5249" text-anchor="middle">entrée</text>
<polygon points="150,78 230,102 230,138 150,162" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="190.0" y="124" font-size="11.5" fill="#3a3531" text-anchor="middle" font-weight="600">encodeur</text>
<line x1="138" y1="120" x2="146" y2="120" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="366" y="72.0" width="96" height="96" fill="#efe7d3" stroke="#b8a888" stroke-width="1.2"/>
<text x="414.0" y="184.0" font-size="11" fill="#5b5249" text-anchor="middle">espace latent</text>
<path d="M437.2352941176471 86.11764705882354 L447.2352941176471 86.11764705882354 M442.2352941176471 81.11764705882354 L442.2352941176471 91.11764705882354" stroke="#7a6f63" stroke-width="1.2"/>
<text x="433.2352941176471" y="90.11764705882354" font-size="10" fill="#7a6f63" text-anchor="end">centre</text>
<line x1="234" y1="120" x2="362" y2="120" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<text x="298.0" y="112" font-size="11" fill="#5b5249" text-anchor="middle">un point</text>
<circle cx="405.2" cy="138.4" r="4" fill="#3a3531"/>
<line x1="466" y1="120" x2="482" y2="120" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<polygon points="486,102 566,78 566,162 486,138" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="526.0" y="124" font-size="11.5" fill="#3a3531" text-anchor="middle" font-weight="600">décodeur</text>
<image x="594" y="78.0" width="84" height="84" xlink:href="data:image/png;base64,"/>
<rect x="594" y="78.0" width="84" height="84" fill="none" stroke="#d9cbac" stroke-width="1.5"/>
<text x="636.0" y="178.0" font-size="11" fill="#5b5249" text-anchor="middle">sortie</text>
<line x1="570" y1="120" x2="590" y2="120" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<path d="M92.0 184 L92.0 192 L636.0 192 L636.0 184" fill="none" stroke="#7a6f63" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="364.0" y="207" font-size="11" fill="#5b5249" text-anchor="middle">erreur de reconstruction : l'entrée et la sortie doivent se ressembler</text>
