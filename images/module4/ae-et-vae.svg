<polygon points="196,334 280,388 280,420 196,474" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="238.0" y="408" font-size="11.5" fill="#3a3531" text-anchor="middle" font-weight="600">encodeur</text>
<line x1="184" y1="404" x2="192" y2="404" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="302" y="369" width="66" height="26" rx="6" fill="#fbf7ee" stroke="#c4564a" stroke-width="1.6"/>
<text x="335.0" y="386" font-size="11.5" fill="#3a3531" text-anchor="middle" font-weight="600">centre</text>
<line x1="282" y1="404" x2="299" y2="382" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<line x1="370" y1="382" x2="389" y2="404" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="302" y="413" width="66" height="26" rx="6" fill="#fbf7ee" stroke="#c4564a" stroke-width="1.6"/>
<text x="335.0" y="430" font-size="11.5" fill="#3a3531" text-anchor="middle" font-weight="600">taille</text>
<line x1="282" y1="404" x2="299" y2="426" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<line x1="370" y1="426" x2="389" y2="404" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="392" y="371.0" width="66" height="66" fill="#efe7d3" stroke="#b8a888" stroke-width="1.2"/>
<text x="425.0" y="453.0" font-size="11" fill="#5b5249" text-anchor="middle">espace latent</text>
<path d="M439.4117647058823 380.70588235294116 L449.4117647058823 380.70588235294116 M444.4117647058823 375.70588235294116 L444.4117647058823 385.70588235294116" stroke="#7a6f63" stroke-width="1.2"/>
<text x="435.4117647058823" y="384.70588235294116" font-size="10" fill="#7a6f63" text-anchor="end">centre</text>
<circle cx="419.0" cy="416.6" r="18.6" fill="url(#cloche)"/>
<circle cx="419.0" cy="416.6" r="11.6" fill="none" stroke="#c4564a" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="414.5" cy="423.0" r="4" fill="#3a3531"/>
<line x1="426.81507292593983" y1="405.5561722711806" x2="440.36650014879064" y2="386.41866054425384" stroke="#c4564a" stroke-width="1.6" marker-end="url(#pr)"/>
<line x1="462" y1="404" x2="478" y2="404" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<text x="425.0" y="347.0" font-size="11" fill="#c4564a" text-anchor="middle">zone floue, et un</text>
<text x="425.0" y="361.0" font-size="11" fill="#c4564a" text-anchor="middle">point tiré au hasard</text>
<polygon points="482,388 566,334 566,474 482,420" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="524.0" y="408" font-size="11.5" fill="#3a3531" text-anchor="middle" font-weight="600">décodeur</text>
<image x="586" y="334.0" width="140" height="140" xlink:href="data:image/png;base64,"/>
<rect x="586" y="334.0" width="140" height="140" fill="none" stroke="#d9cbac" stroke-width="1.5"/>
<text x="656.0" y="490.0" font-size="11" fill="#5b5249" text-anchor="middle">sortie</text>
<line x1="570" y1="404" x2="582" y2="404" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<path d="M110.0 500 L110.0 508 L656.0 508 L656.0 500" fill="none" stroke="#7a6f63" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="383.0" y="523" font-size="11" fill="#5b5249" text-anchor="middle">erreur de reconstruction : l'entrée et la sortie doivent se ressembler</text>
<text x="425.0" y="490.0" font-size="11" fill="#c4564a" text-anchor="middle">+ pénalité : ramener la zone vers le centre de la carte</text>
</svg>
