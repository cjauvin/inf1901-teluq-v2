<rect x="258" y="309" width="80" height="26" rx="6" fill="#fbf7ee" stroke="#c4564a" stroke-width="1.6"/>
<text x="298.0" y="326" font-size="11.5" fill="#3a3531" text-anchor="middle" font-weight="600">taille</text>
<line x1="232" y1="300" x2="255" y2="322" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<line x1="340" y1="322" x2="363" y2="300" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="366" y="252.0" width="96" height="96" fill="#efe7d3" stroke="#b8a888" stroke-width="1.2"/>
<text x="414.0" y="364.0" font-size="11" fill="#5b5249" text-anchor="middle">espace latent</text>
<path d="M437.2352941176471 266.11764705882354 L447.2352941176471 266.11764705882354 M442.2352941176471 261.11764705882354 L442.2352941176471 271.11764705882354" stroke="#7a6f63" stroke-width="1.2"/>
<text x="433.2352941176471" y="270.11764705882354" font-size="10" fill="#7a6f63" text-anchor="end">centre</text>
<circle cx="405.2" cy="318.4" r="27.1" fill="url(#cloche)"/>
<circle cx="405.2" cy="318.4" r="16.8" fill="none" stroke="#c4564a" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="398.7" cy="327.6" r="4" fill="#3a3531"/>
<line x1="416.11474704070577" y1="303.00544254916053" x2="438.1900295605554" y2="271.8304252501362" stroke="#c4564a" stroke-width="1.6" marker-end="url(#pr)"/>
<line x1="466" y1="300" x2="482" y2="300" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<text x="414.0" y="242.0" font-size="11" fill="#c4564a" text-anchor="middle">zone floue, et un point tiré au hasard</text>
<polygon points="486,282 566,258 566,342 486,318" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="526.0" y="304" font-size="11.5" fill="#3a3531" text-anchor="middle" font-weight="600">décodeur</text>
<image x="594" y="258.0" width="84" height="84" xlink:href="data:image/png;base64,"/>
<rect x="594" y="258.0" width="84" height="84" fill="none" stroke="#d9cbac" stroke-width="1.5"/>
<text x="636.0" y="358.0" font-size="11" fill="#5b5249" text-anchor="middle">sortie</text>
<line x1="570" y1="300" x2="590" y2="300" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<path d="M92.0 370 L92.0 378 L636.0 378 L636.0 370" fill="none" stroke="#7a6f63" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="364.0" y="393" font-size="11" fill="#5b5249" text-anchor="middle">erreur de reconstruction : l'entrée et la sortie doivent se ressembler</text>
