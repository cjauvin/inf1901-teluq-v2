<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Autoencodeur et autoencodeur variationnel</title>
<desc>Deux rangées. En haut, l'autoencodeur ordinaire : un 7 manuscrit entre dans l'encodeur, qui le réduit à un point sur une petite carte de l'espace latent ; le décodeur reconstruit le 7 à partir de ce point. L'erreur de reconstruction compare l'entrée et la sortie. En bas, l'autoencodeur variationnel : l'encodeur donne deux sorties, le centre et la taille d'une zone floue, dessinée sur la carte comme une tache en forme de cloche ; un point est tiré au hasard dans cette zone, et le décodeur reconstruit le 7 à partir de ce point. Une pénalité ramène la zone vers le centre de la carte. Les éléments propres à l'autoencodeur variationnel sont en rouge.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c4564a"/></marker><radialGradient id="cloche"><stop offset="0" stop-color="#c4564a" stop-opacity="0.55"/><stop offset="1" stop-color="#c4564a" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="800" height="550" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="400.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">De l'autoencodeur à l'autoencodeur variationnel</text>
<rect x="20" y="50" width="760" height="236" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="36" y="72" font-size="13" fill="#9a5b33" font-weight="700">Autoencodeur ordinaire</text>
<image x="40" y="86.0" width="140" height="140" xlink:href="data:image/png;base64,"/>
<rect x="40" y="86.0" width="140" height="140" fill="none" stroke="#d9cbac" stroke-width="1.5"/>
<text x="110.0" y="242.0" font-size="11" fill="#5b5249" text-anchor="middle">entrée</text>
<polygon points="196,86 280,140 280,172 196,226" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="238.0" y="160" font-size="11.5" fill="#3a3531" text-anchor="middle" font-weight="600">encodeur</text>
<line x1="184" y1="156" x2="192" y2="156" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="392" y="123.0" width="66" height="66" fill="#efe7d3" stroke="#b8a888" stroke-width="1.2"/>
<text x="425.0" y="205.0" font-size="11" fill="#5b5249" text-anchor="middle">espace latent</text>
<path d="M439.4117647058823 132.7058823529412 L449.4117647058823 132.7058823529412 M444.4117647058823 127.70588235294119 L444.4117647058823 137.7058823529412" stroke="#7a6f63" stroke-width="1.2"/>
<text x="435.4117647058823" y="136.7058823529412" font-size="10" fill="#7a6f63" text-anchor="end">centre</text>
<line x1="284" y1="156" x2="388" y2="156" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<text x="336.0" y="148" font-size="11" fill="#5b5249" text-anchor="middle">un point</text>
<circle cx="419.0" cy="168.6" r="4" fill="#3a3531"/>
<line x1="462" y1="156" x2="478" y2="156" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<polygon points="482,140 566,86 566,226 482,172" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="524.0" y="160" font-size="11.5" fill="#3a3531" text-anchor="middle" font-weight="600">décodeur</text>
<image x="586" y="86.0" width="140" height="140" xlink:href="data:image/png;base64,"/>
<rect x="586" y="86.0" width="140" height="140" fill="none" stroke="#d9cbac" stroke-width="1.5"/>
<text x="656.0" y="242.0" font-size="11" fill="#5b5249" text-anchor="middle">sortie</text>
<line x1="570" y1="156" x2="582" y2="156" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<path d="M110.0 252 L110.0 260 L656.0 260 L656.0 252" fill="none" stroke="#7a6f63" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="383.0" y="275" font-size="11" fill="#5b5249" text-anchor="middle">erreur de reconstruction : l'entrée et la sortie doivent se ressembler</text>
<rect x="20" y="298" width="760" height="236" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="36" y="320" font-size="13" fill="#9a5b33" font-weight="700">Autoencodeur variationnel (VAE)</text>
<image x="40" y="334.0" width="140" height="140" xlink:href="data:image/png;base64,"/>
<rect x="40" y="334.0" width="140" height="140" fill="none" stroke="#d9cbac" stroke-width="1.5"/>
