<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>TF-IDF</title>
<desc>Deux tableaux, des mots en rangées et trois documents en colonnes : botanique, biologie et sport. À gauche, le sac de mots, avec le nombre d'occurrences : le mot « le » apparaît 12, 10 et 15 fois, photosynthèse 3, 1 et 0 fois, chlorophylle 2, 0 et 0 fois, match 0, 0 et 4 fois, but 0, 0 et 3 fois. À droite, les poids TF-IDF : « le », présent dans les trois documents, reçoit un poids nul partout ; chlorophylle, match et but, propres à un seul document, reçoivent les poids les plus élevés. En bas, la formule : le poids d'un mot dans un document est son nombre d'occurrences multiplié par le logarithme du nombre de documents divisé par le nombre de documents qui contiennent le mot.</desc>
