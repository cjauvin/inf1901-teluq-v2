<rect x="410" y="52" width="370" height="398" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="595.0" y="78" font-size="13" fill="#9a5b33" text-anchor="middle" font-weight="700">Depuis 2022 : le système</text>
<text x="595.0" y="96" font-size="11" fill="#5b5249" text-anchor="middle">un assistant comme ChatGPT</text>
<text x="595.0" y="128" font-size="11.5" fill="#3a6ea5" text-anchor="middle" font-style="italic">« Capitale de l'Australie ? »</text>
<text x="595.0" y="158" font-size="11.5" fill="#3a6ea5" text-anchor="middle" font-style="italic">« Traduis : the house is small »</text>
<text x="595.0" y="188" font-size="11.5" fill="#3a6ea5" text-anchor="middle" font-style="italic">« Écris un programme qui… »</text>
<line x1="595.0" y1="200" x2="595.0" y2="222" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="450" y="226" width="290" height="84" rx="10" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="2.4"/>
<text x="595.0" y="256" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="700">grand modèle de langage</text>
<text x="595.0" y="284" font-size="11.5" fill="#5b5249" text-anchor="middle">prédit le mot suivant, encore et encore</text>
<line x1="595.0" y1="314" x2="595.0" y2="334" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<text x="595.0" y="352" font-size="12" fill="#3a3531" text-anchor="middle">Canberra.</text>
<text x="595.0" y="374" font-size="12" fill="#3a3531" text-anchor="middle">La maison est petite.</text>
<text x="595.0" y="396" font-size="12" fill="#3a3531" text-anchor="middle">def trier(liste): …</text>
<text x="595.0" y="432" font-size="11" fill="#5b5249" text-anchor="middle">le modèle de langage fait lui-même tout le travail</text>
