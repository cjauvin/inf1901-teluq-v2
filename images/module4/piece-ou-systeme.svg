<text x="400.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Le modèle de langage : d'une pièce du système au système lui-même</text>
<rect x="20" y="52" width="370" height="398" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
