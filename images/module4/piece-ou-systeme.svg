<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le modèle de langage, de la pièce au système</title>
<desc>Deux panneaux. À gauche, « Avant : une pièce du système » : dans un système de reconnaissance de la parole, un signal sonore passe par un composant qui analyse les sons et propose trois transcriptions, « un verre d'eau », « un vert d'eau » et « un ver d'eau ». Un petit modèle de langage, en arbitre, leur donne des probabilités, 0,92, 0,07 et 0,01, et retient « un verre d'eau ». À droite, « Depuis 2022 : le système » : un grand modèle de langage, au centre, reçoit trois demandes, une question sur la capitale de l'Australie, une phrase anglaise à traduire et une demande de programme, et produit lui-même les trois réponses.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
