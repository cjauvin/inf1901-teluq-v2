<rect x="26" y="298" width="788" height="34" rx="6" fill="#1f2421"/>
<text x="40" y="320" font-size="12.5" fill="#e5e7e0" font-family="ui-monospace, Menlo, monospace"><tspan fill="#8fd3c9">$</tspan> git log --format=%an <tspan fill="#e0a36b">|</tspan> sort <tspan fill="#e0a36b">|</tspan> uniq -c <tspan fill="#e0a36b">|</tspan> sort -rn <tspan fill="#e0a36b">|</tspan> head -2</text>
<text x="420.0" y="358" font-size="11.5" fill="#3a3531" text-anchor="middle">Le symbole <tspan font-family="ui-monospace, Menlo, monospace" fill="#9a5b33" font-weight="700">|</tspan>, le tube, envoie le texte produit par un programme au suivant.</text>
<text x="420.0" y="376" font-size="11" fill="#5b5249" text-anchor="middle">Aucun de ces programmes ne sait répondre à la question ; ensemble, en une ligne, ils y répondent.</text>
</svg>
