<rect x="690" y="76" width="140" height="66" rx="9" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="760.0" y="98" font-size="11.5" fill="#2f6f6a" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, monospace">head -2</text>
