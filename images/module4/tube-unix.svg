<text x="760.0" y="131" font-size="10.5" fill="#5b5249" text-anchor="middle">premières lignes</text>
<line x1="760.0" y1="144" x2="760.0" y2="160" stroke="#7a6f63" stroke-width="1.4" marker-end="url(#p)"/>
<rect x="700" y="164" width="120" height="108" rx="5" fill="#1f2421"/>
