<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 390" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Un tube Unix</title>
<desc>La question : qui a fait le plus de modifications dans ce projet ? En bas, la ligne de commande qui y répond : git log --format=%an, puis sort, puis uniq -c, puis sort -rn, puis head -2, reliés par le symbole |, le tube. Au-dessus, cinq boîtes, une par programme, avec le texte qui sort de chacune. git log donne le nom de l'auteur de chaque modification : Grace, Ada, Grace, Linus, Grace, Ada. sort les trie : Ada, Ada, Grace, Grace, Grace, Linus. uniq -c compte les lignes identiques qui se suivent : 2 Ada, 3 Grace, 1 Linus. sort -rn trie par nombre, du plus grand au plus petit : 3 Grace, 2 Ada, 1 Linus. head -2 garde les deux premières lignes : 3 Grace, 2 Ada. Chaque programme fait une seule chose, lit du texte et en produit.</desc>
