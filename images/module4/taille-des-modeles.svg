<text x="400.0" y="370" font-size="10.5" fill="#5b5249" text-anchor="middle">2018</text>
<text x="460.0" y="334" font-size="11" fill="#7a6f63" text-anchor="middle">—</text>
<text x="460.0" y="356" font-size="11" fill="#3a3531" text-anchor="middle" font-weight="600">GPT-2</text>
<text x="460.0" y="370" font-size="10.5" fill="#5b5249" text-anchor="middle">2019</text>
<rect x="500.8" y="303.4" width="38.4" height="36.6" fill="#2f6f6a"/>
<text x="520.0" y="297.4" font-size="10.5" fill="#3a3531" text-anchor="middle">300 milliards</text>
<text x="520.0" y="356" font-size="11" fill="#3a3531" text-anchor="middle" font-weight="600">GPT-3</text>
<text x="520.0" y="370" font-size="10.5" fill="#5b5249" text-anchor="middle">2020</text>
<rect x="560.8" y="252.1" width="38.4" height="87.9" fill="#2f6f6a"/>
<text x="580.0" y="246.1" font-size="10.5" fill="#3a3531" text-anchor="middle">1 400 milliards</text>
<text x="580.0" y="356" font-size="11" fill="#3a3531" text-anchor="middle" font-weight="600">Chinchilla</text>
<text x="580.0" y="370" font-size="10.5" fill="#5b5249" text-anchor="middle">2022</text>
<rect x="620.8" y="173.2" width="38.4" height="166.8" fill="#2f6f6a"/>
<text x="640.0" y="167.2" font-size="10.5" fill="#3a3531" text-anchor="middle">15 000 milliards</text>
<text x="640.0" y="356" font-size="11" fill="#3a3531" text-anchor="middle" font-weight="600">Llama 3.1</text>
<text x="640.0" y="370" font-size="10.5" fill="#5b5249" text-anchor="middle">2024</text>
<line x1="370" y1="340" x2="670" y2="340" stroke="#b8a888" stroke-width="1.4"/>
<text x="350.0" y="434" font-size="11.5" fill="#7a6f63" text-anchor="middle">La taille de GPT-4 (2023) et des modèles suivants des grandes entreprises n'a pas été publiée.</text>
</svg>
