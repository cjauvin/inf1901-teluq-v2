<text x="130" y="70" font-size="14.5" fill="#3a6ea5" font-style="italic" font-weight="700">chat dort sur <tspan fill="#5b5249" font-weight="400">… ?</tspan></text>
<text x="330" y="70" font-size="11" fill="#5b5249">on va chercher les rangées de ces trois mots dans la table</text>
