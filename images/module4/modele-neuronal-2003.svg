<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le modèle de langage neuronal de 2003</title>
<desc>Le contexte « chat dort sur » entre dans le modèle, dessiné comme un grand cadre. Dans le cadre, à gauche, la table des plongements : une rangée de nombres pour chaque mot du vocabulaire, aboie, canapé, chat, chien, dort, le, sur. Les rangées de chat, dort et sur sont surlignées. Leurs plongements sont mis bout à bout, puis passent dans une couche cachée de neurones, qui donne la probabilité de chaque mot suivant : le en tête, puis un, son et mon. Une flèche rouge, en bas, revient en sens inverse, de l'erreur jusqu'à la table : la rétropropagation ajuste les poids des neurones et aussi les plongements. Une étiquette sur le cadre indique que les paramètres du modèle sont la table des plongements et les poids des neurones, appris ensemble.</desc>
