<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 530" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Une histoire du traitement de la langue</title>
<desc>Une frise chronologique verticale, de 1913 à 2022, avec trois ères qui se chevauchent, marquées par des bandes de couleur : les règles, d'environ 1950 à 1990 ; les statistiques, d'environ 1975 à 2014 ; les réseaux de neurones, depuis 2003. Les jalons : 1913, Markov compte les lettres d'Eugène Onéguine ; 1948, Shannon : un modèle de langage ; 1954, expérience Georgetown-IBM ; 1957, grammaires de Chomsky ; 1966, rapport ALPAC ; ELIZA ; 1970, SHRDLU ; 1972, TF-IDF ; 1977, TAUM-MÉTÉO ; 1980, HMM en reconnaissance vocale ; 1990, traduction statistique d'IBM ; LSA ; 1993, Penn Treebank ; 1995, lissage de Kneser-Ney ; 2001, CRF ; 2003, modèle de langage neuronal ; 2006, Google Traduction (statistique) ; 2013, word2vec ; 2014, séquence à séquence ; 2016, Google Traduction (neuronal) ; 2017, Transformer ; 2018, BERT, GPT ; 2020, GPT-3 ; 2022, ChatGPT.</desc>
<rect x="0" y="0" width="660" height="530" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="330.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Le traitement de la langue : trois ères qui se chevauchent</text>
<rect x="470" y="131" width="12" height="12" rx="3" fill="#9a5b33"/>
<text x="490" y="142" font-size="12" fill="#9a5b33" font-weight="700">les règles</text>
<rect x="470" y="155" width="12" height="12" rx="3" fill="#2f6f6a"/>
<text x="490" y="166" font-size="12" fill="#2f6f6a" font-weight="700">les statistiques</text>
<rect x="470" y="179" width="12" height="12" rx="3" fill="#c4564a"/>
<text x="490" y="190" font-size="12" fill="#c4564a" font-weight="700">les réseaux de neurones</text>
<rect x="53" y="97" width="10" height="150" rx="5" fill="#9a5b33" fill-opacity="0.8"/>
<rect x="73" y="192" width="10" height="188" rx="5" fill="#2f6f6a" fill-opacity="0.8"/>
<rect x="93" y="306" width="10" height="169" rx="5" fill="#c4564a" fill-opacity="0.8"/>
<line x1="85" y1="68" x2="122" y2="68" stroke="#2f6f6a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="78" cy="68" r="3" fill="#efe7d3"/>
<text x="130" y="72" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#2f6f6a">1913</tspan>   Markov compte les lettres d'Eugène Onéguine</text>
<line x1="85" y1="87" x2="122" y2="87" stroke="#2f6f6a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="78" cy="87" r="3" fill="#efe7d3"/>
<text x="130" y="91" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#2f6f6a">1948</tspan>   Shannon : un modèle de langage</text>
<line x1="65" y1="106" x2="122" y2="106" stroke="#9a5b33" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="58" cy="106" r="3" fill="#efe7d3"/>
<text x="130" y="110" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#9a5b33">1954</tspan>   expérience Georgetown-IBM</text>
<line x1="65" y1="125" x2="122" y2="125" stroke="#9a5b33" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="58" cy="125" r="3" fill="#efe7d3"/>
<text x="130" y="129" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#9a5b33">1957</tspan>   grammaires de Chomsky</text>
<line x1="65" y1="144" x2="122" y2="144" stroke="#9a5b33" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="58" cy="144" r="3" fill="#efe7d3"/>
<text x="130" y="148" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#9a5b33">1966</tspan>   rapport ALPAC ; ELIZA</text>
<line x1="65" y1="163" x2="122" y2="163" stroke="#9a5b33" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="58" cy="163" r="3" fill="#efe7d3"/>
<text x="130" y="167" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#9a5b33">1970</tspan>   SHRDLU</text>
<line x1="85" y1="182" x2="122" y2="182" stroke="#2f6f6a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="78" cy="182" r="3" fill="#efe7d3"/>
<text x="130" y="186" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#2f6f6a">1972</tspan>   TF-IDF</text>
<line x1="65" y1="201" x2="122" y2="201" stroke="#9a5b33" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="58" cy="201" r="3" fill="#efe7d3"/>
<text x="130" y="205" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#9a5b33">1977</tspan>   TAUM-MÉTÉO</text>
<line x1="85" y1="220" x2="122" y2="220" stroke="#2f6f6a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="78" cy="220" r="3" fill="#efe7d3"/>
<text x="130" y="224" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#2f6f6a">1980</tspan>   HMM en reconnaissance vocale</text>
<line x1="85" y1="239" x2="122" y2="239" stroke="#2f6f6a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="78" cy="239" r="3" fill="#efe7d3"/>
<text x="130" y="243" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#2f6f6a">1990</tspan>   traduction statistique d'IBM ; LSA</text>
<line x1="85" y1="258" x2="122" y2="258" stroke="#2f6f6a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="78" cy="258" r="3" fill="#efe7d3"/>
<text x="130" y="262" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#2f6f6a">1993</tspan>   Penn Treebank</text>
<line x1="85" y1="277" x2="122" y2="277" stroke="#2f6f6a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="78" cy="277" r="3" fill="#efe7d3"/>
<text x="130" y="281" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#2f6f6a">1995</tspan>   lissage de Kneser-Ney</text>
<line x1="85" y1="296" x2="122" y2="296" stroke="#2f6f6a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
