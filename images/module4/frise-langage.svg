<circle cx="98" cy="467" r="3" fill="#efe7d3"/>
<text x="130" y="471" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#c4564a">2022</tspan>   ChatGPT</text>
<text x="330.0" y="514" font-size="10.5" fill="#5b5249" text-anchor="middle">Une ère n'efface pas la précédente : le modèle de langage de Shannon traverse toute l'histoire.</text>
</svg>
