<line x1="105" y1="315" x2="122" y2="315" stroke="#c4564a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="98" cy="315" r="3" fill="#efe7d3"/>
<text x="130" y="319" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#c4564a">2003</tspan>   modèle de langage neuronal</text>
<line x1="85" y1="334" x2="122" y2="334" stroke="#2f6f6a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="78" cy="334" r="3" fill="#efe7d3"/>
<text x="130" y="338" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#2f6f6a">2006</tspan>   Google Traduction (statistique)</text>
<line x1="105" y1="353" x2="122" y2="353" stroke="#c4564a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="98" cy="353" r="3" fill="#efe7d3"/>
<text x="130" y="357" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#c4564a">2013</tspan>   word2vec</text>
<line x1="105" y1="372" x2="122" y2="372" stroke="#c4564a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="98" cy="372" r="3" fill="#efe7d3"/>
<text x="130" y="376" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#c4564a">2014</tspan>   séquence à séquence</text>
<line x1="105" y1="391" x2="122" y2="391" stroke="#c4564a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="98" cy="391" r="3" fill="#efe7d3"/>
<text x="130" y="395" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#c4564a">2016</tspan>   Google Traduction (neuronal)</text>
<line x1="105" y1="410" x2="122" y2="410" stroke="#c4564a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="98" cy="410" r="3" fill="#efe7d3"/>
<text x="130" y="414" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#c4564a">2017</tspan>   Transformer</text>
<line x1="105" y1="429" x2="122" y2="429" stroke="#c4564a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="98" cy="429" r="3" fill="#efe7d3"/>
<text x="130" y="433" font-size="12" fill="#3a3531"><tspan font-weight="700" fill="#c4564a">2018</tspan>   BERT, GPT</text>
<line x1="105" y1="448" x2="122" y2="448" stroke="#c4564a" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
<circle cx="98" cy="448" r="3" fill="#efe7d3"/>
