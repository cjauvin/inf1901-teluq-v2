<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Suivre un raisonnement dans le modèle</title>
<desc>En bas, la question donnée au modèle : « La capitale de l'État où se trouve Dallas est… ». Au-dessus, les caractéristiques internes qui s'activent, reliées par des flèches selon leur influence. Le mot « Dallas » active une caractéristique « Texas », qui n'apparaît nulle part dans la question. Les mots « capitale » et « État » activent une caractéristique « dire une capitale ». Les deux se combinent pour produire la réponse, « Austin ». À droite, une intervention : si l'on remplace, dans le modèle, la caractéristique « Texas » par « Californie », il répond « Sacramento ».</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f6a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c4564a"/></marker></defs>
<rect x="0" y="0" width="840" height="430" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="420.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Suivre un raisonnement dans le modèle : un graphe d'attribution</text>
<rect x="20" y="50" width="540" height="360" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<rect x="44" y="352" width="30.8" height="28" rx="5" fill="#efe7d3" stroke="#7a6f63" stroke-width="0.8"/>
<text x="59.4" y="371" font-size="12" fill="#3a3531" text-anchor="middle" font-style="italic">La</text>
<rect x="80.8" y="352" width="75.2" height="28" rx="5" fill="#e6eef6" stroke="#3a6ea5" stroke-width="1.4"/>
<text x="118.4" y="371" font-size="12" fill="#3a3531" text-anchor="middle" font-style="italic">capitale</text>
<rect x="162.0" y="352" width="82.60000000000001" height="28" rx="5" fill="#e6eef6" stroke="#3a6ea5" stroke-width="1.4"/>
<text x="203.3" y="371" font-size="12" fill="#3a3531" text-anchor="middle" font-style="italic">de l'État</text>
<rect x="250.60000000000002" y="352" width="104.80000000000001" height="28" rx="5" fill="#efe7d3" stroke="#7a6f63" stroke-width="0.8"/>
<text x="303.0" y="371" font-size="12" fill="#3a3531" text-anchor="middle" font-style="italic">où se trouve</text>
<rect x="361.40000000000003" y="352" width="60.400000000000006" height="28" rx="5" fill="#e6eef6" stroke="#3a6ea5" stroke-width="1.4"/>
<text x="391.6" y="371" font-size="12" fill="#3a3531" text-anchor="middle" font-style="italic">Dallas</text>
<rect x="427.80000000000007" y="352" width="45.6" height="28" rx="5" fill="#efe7d3" stroke="#7a6f63" stroke-width="0.8"/>
<text x="450.6000000000001" y="371" font-size="12" fill="#3a3531" text-anchor="middle" font-style="italic">est…</text>
<text x="290" y="406" font-size="10" fill="#5b5249" text-anchor="middle">la question</text>
<rect x="316.6" y="214" width="150" height="44" rx="10" fill="#efe7d3" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="391.6" y="233" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">Texas</text>
<text x="391.6" y="249" font-size="10" fill="#5b5249" text-anchor="middle">une étape interne</text>
<rect x="80.85000000000002" y="214" width="160" height="44" rx="10" fill="#efe7d3" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="160.85000000000002" y="233" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">dire une capitale</text>
<text x="160.85000000000002" y="249" font-size="10" fill="#5b5249" text-anchor="middle">le genre de réponse</text>
<line x1="391.6" y1="350" x2="391.6" y2="260" stroke="#2f6f6a" stroke-width="2" marker-end="url(#pt)"/>
<line x1="118.4" y1="350" x2="130.85000000000002" y2="260" stroke="#2f6f6a" stroke-width="2" marker-end="url(#pt)"/>
<line x1="203.3" y1="350" x2="180.85000000000002" y2="260" stroke="#2f6f6a" stroke-width="2" marker-end="url(#pt)"/>
<rect x="206.22500000000002" y="90" width="140" height="44" rx="10" fill="#f3e3d3" stroke="#9a5b33" stroke-width="1.8"/>
<text x="276.225" y="109" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">Austin</text>
<text x="276.225" y="125" font-size="10" fill="#5b5249" text-anchor="middle">la réponse</text>
<line x1="391.6" y1="212" x2="306.225" y2="136" stroke="#2f6f6a" stroke-width="2" marker-end="url(#pt)"/>
<line x1="160.85000000000002" y1="212" x2="246.22500000000002" y2="136" stroke="#2f6f6a" stroke-width="2" marker-end="url(#pt)"/>
<text x="475.6" y="240" font-size="10.5" fill="#5b5249">absent de la</text>
<text x="475.6" y="254" font-size="10.5" fill="#5b5249">question !</text>
<rect x="576" y="50" width="244" height="360" rx="10" fill="#fbf7ee" stroke="#c4564a" stroke-width="1.4"/>
<text x="698" y="76" font-size="12.5" fill="#c4564a" text-anchor="middle" font-weight="700">Une intervention</text>
<text x="698" y="102" font-size="11" fill="#3a3531" text-anchor="middle">On remplace, à l'intérieur du</text>
<text x="698" y="118" font-size="11" fill="#3a3531" text-anchor="middle">modèle, la caractéristique</text>
<rect x="598.0" y="144" width="200" height="44" rx="10" fill="#efe7d3" stroke="#c4564a" stroke-width="1.8"/>
<text x="698" y="163" font-size="12.5" fill="#c4564a" text-anchor="middle" font-weight="700">Texas  →  Californie</text>
<text x="698" y="179" font-size="10" fill="#5b5249" text-anchor="middle">modifiée à la main</text>
<line x1="698" y1="190" x2="698" y2="236" stroke="#c4564a" stroke-width="2" marker-end="url(#pr)"/>
<rect x="618.0" y="240" width="160" height="44" rx="10" fill="#f3e3d3" stroke="#9a5b33" stroke-width="1.8"/>
<text x="698" y="259" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">Sacramento</text>
<text x="698" y="275" font-size="10" fill="#5b5249" text-anchor="middle">la nouvelle réponse</text>
<text x="698" y="318" font-size="11" fill="#3a3531" text-anchor="middle">L'étape « Texas » n'est donc pas</text>
<text x="698" y="334" font-size="11" fill="#3a3531" text-anchor="middle">une illusion : elle est vraiment</text>
<text x="698" y="350" font-size="11" fill="#3a3531" text-anchor="middle">utilisée pour répondre.</text>
</svg>
