<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le sac des mots voisins</title>
<desc>À gauche, un tableau : trois mots en rangées, chat, chien et démocratie, et en colonnes dix mots voisins, avec le nombre de fois où chacun est apparu près du mot. Chat et chien ont des rangées semblables : croquettes, dort, caresse et vétérinaire reviennent souvent, et miaule pour l'un, aboie pour l'autre. Démocratie a une rangée différente : vote, élection et liberté. La colonne du mot « le » est grisée : il est voisin de tout, avec des comptes très élevés pour les trois mots. Une mention indique 99 990 autres colonnes, presque toutes à zéro. Une flèche « réduire » mène, à droite, à trois vecteurs de trois nombres seulement. Ceux de chat et de chien se ressemblent, avec une ressemblance de 0,98 ; ceux de chat et de démocratie, presque pas, avec une ressemblance de −0,1.</desc>
