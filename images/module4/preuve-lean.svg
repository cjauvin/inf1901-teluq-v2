<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Une preuve vérifiée par une machine</title>
<desc>À gauche, un énoncé en français, « la somme de deux nombres pairs est paire », et sa traduction en Lean, un langage de preuve : pour tous entiers naturels a et b, s'il existe x tel que a égale 2 fois x, et y tel que b égale 2 fois y, alors il existe z tel que a plus b égale 2 fois z. Suivent trois étapes de preuve : extraire x, extraire y, puis proposer z égal à x plus y, le calcul étant fait par une procédure automatique. Lean répond : aucune erreur, la preuve est acceptée. À droite, une boucle : le modèle de langage propose une preuve ; Lean la vérifie ; si elle est acceptée, c'est une récompense pour l'entraînement ; si elle est refusée, le message d'erreur revient au modèle, qui corrige. En bas : le vérificateur est un petit programme écrit par des humains, auquel on peut se fier ; il n'y a rien à croire sur parole.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f6a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c4564a"/></marker></defs>
<rect x="0" y="0" width="840" height="430" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="420.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Une preuve vérifiée par une machine</text>
<rect x="20" y="50" width="452" height="320" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="36" y="74" font-size="12.5" fill="#9a5b33" font-weight="700">L'énoncé</text>
<text x="36" y="94" font-size="12.5" fill="#3a3531" font-style="italic">« La somme de deux nombres pairs est paire. »</text>
<text x="36" y="122" font-size="12.5" fill="#9a5b33" font-weight="700">La même chose en Lean, avec sa preuve</text>
<rect x="32" y="134" width="428" height="130" rx="6" fill="#1f2421"/>
<text x="44" y="156" font-size="11.5" fill="#e5e7e0" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">theorem somme_pairs (a b : Nat)</text>
<text x="44" y="175" font-size="11.5" fill="#e5e7e0" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    (ha : ∃ x, a = 2 * x) (hb : ∃ y, b = 2 * y) :</text>
<text x="44" y="194" font-size="11.5" fill="#e5e7e0" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    ∃ z, a + b = 2 * z := by</text>
<text x="44" y="213" font-size="11.5" fill="#8fd3a0" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  obtain ⟨x, hx⟩ := ha</text>
<text x="44" y="232" font-size="11.5" fill="#8fd3a0" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  obtain ⟨y, hy⟩ := hb</text>
<text x="44" y="251" font-size="11.5" fill="#8fd3a0" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  exact ⟨x + y, by omega⟩</text>
<rect x="32" y="294" width="428" height="30" rx="6" fill="#dcebe8" stroke="#2f6f6a"/>
<text x="46" y="314" font-size="12" fill="#2f6f6a" font-weight="700">Lean : aucune erreur. La preuve est acceptée.</text>
<text x="36" y="348" font-size="11" fill="#5b5249">En vert, les étapes de la preuve : Lean vérifie chacune d'elles,</text>
<text x="36" y="364" font-size="11" fill="#5b5249">et refuserait la moindre étape fausse ou incomplète.</text>
<rect x="488" y="50" width="332" height="320" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="654" y="74" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">La boucle</text>
<rect x="534.0" y="94.0" width="196" height="44" rx="9" fill="#efe7d3" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="632" y="113" font-size="12" fill="#3a3531" text-anchor="middle" font-weight="700">le modèle de langage</text>
<text x="632" y="129" font-size="10.5" fill="#5b5249" text-anchor="middle">propose une preuve, en Lean</text>
<rect x="534.0" y="184.0" width="196" height="44" rx="9" fill="#efe7d3" stroke="#3a6ea5" stroke-width="1.8"/>
<text x="632" y="203" font-size="12" fill="#3a3531" text-anchor="middle" font-weight="700">Lean</text>
<text x="632" y="219" font-size="10.5" fill="#5b5249" text-anchor="middle">vérifie chaque étape</text>
<line x1="632" y1="140" x2="632" y2="180" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#p)"/>
<rect x="498.0" y="272.0" width="136" height="52" rx="9" fill="#dcebe8" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="566" y="295" font-size="12" fill="#3a3531" text-anchor="middle" font-weight="700">acceptée</text>
<text x="566" y="311" font-size="10.5" fill="#5b5249" text-anchor="middle">une récompense exacte</text>
<rect x="642.0" y="272.0" width="140" height="52" rx="9" fill="#f6dcd6" stroke="#c4564a" stroke-width="1.8"/>
<text x="712" y="295" font-size="12" fill="#3a3531" text-anchor="middle" font-weight="700">refusée</text>
<text x="712" y="311" font-size="10.5" fill="#5b5249" text-anchor="middle">avec un message d'erreur</text>
<line x1="606" y1="230" x2="586" y2="268" stroke="#2f6f6a" stroke-width="1.8" marker-end="url(#pt)"/>
<line x1="658" y1="230" x2="690" y2="268" stroke="#c4564a" stroke-width="1.8" marker-end="url(#pr)"/>
<path d="M782 290 C 806 210 800 116 736 116" fill="none" stroke="#c4564a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#pr)"/>
<text x="790" y="200" font-size="10.5" fill="#c4564a" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke">le modèle</text>
<text x="790" y="213" font-size="10.5" fill="#c4564a" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke">corrige</text>
<text x="566" y="342" font-size="10.5" fill="#2f6f6a" text-anchor="middle">sert à l'entraînement</text>
<text x="566" y="356" font-size="10.5" fill="#2f6f6a" text-anchor="middle">par renforcement</text>
<text x="420.0" y="396" font-size="12" fill="#3a3531" text-anchor="middle">Le vérificateur est un petit programme, écrit et éprouvé par des humains :</text>
<text x="420.0" y="414" font-size="12" fill="#3a3531" text-anchor="middle">une preuve acceptée n'a pas à être crue sur parole, même si c'est une machine qui l'a trouvée.</text>
</svg>
