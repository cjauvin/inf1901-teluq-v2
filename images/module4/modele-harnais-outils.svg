<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le modèle, le harnais et les outils</title>
<desc>Trois zones côte à côte, séparées par des frontières en pointillés. À gauche, chez le fournisseur du modèle : le modèle, des milliards de paramètres sur des processeurs graphiques ; il sait prolonger un texte, jeton après jeton, mais n'a ni réseau, ni fichiers, ni horloge, ni mémoire d'un appel à l'autre. Au milieu, chez l'entreprise qui offre l'assistant, ou sur l'ordinateur de l'utilisateur : le harnais, un programme classique, relié à l'utilisateur ; il tient la conversation, assemble le texte, lit et vérifie les appels, exécute les outils, applique les permissions et demande des confirmations. Le harnais envoie le texte au modèle et reçoit sa suite, parfois un appel. À droite, le monde : les outils, des programmes ordinaires, comme une base de données, une recherche sur le Web, une messagerie et un bac à sable pour exécuter du code. Le harnais les exécute et reçoit leurs résultats. En bas : le modèle propose, le harnais dispose.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
<rect x="0" y="0" width="840" height="500" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="420.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Qui fait quoi, et où : le modèle, le harnais, les outils</text>
<rect x="20" y="52" width="220" height="372" rx="12" fill="none" stroke="#b8a888" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="130.0" y="72" font-size="11.5" fill="#7a6f63" text-anchor="middle" font-weight="700">chez le fournisseur</text>
<text x="130.0" y="87" font-size="11.5" fill="#7a6f63" text-anchor="middle" font-weight="700">du modèle</text>
<rect x="300" y="52" width="240" height="372" rx="12" fill="none" stroke="#b8a888" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="420.0" y="72" font-size="11.5" fill="#7a6f63" text-anchor="middle" font-weight="700">chez l'entreprise qui offre l'assistant,</text>
<text x="420.0" y="87" font-size="11.5" fill="#7a6f63" text-anchor="middle" font-weight="700">ou sur l'ordinateur de l'utilisateur</text>
<rect x="600" y="52" width="220" height="372" rx="12" fill="none" stroke="#b8a888" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="710.0" y="72" font-size="11.5" fill="#7a6f63" text-anchor="middle" font-weight="700">le monde</text>
<rect x="32" y="150" width="196" height="190" rx="10" fill="#efe7d3" stroke="#2f6f6a" stroke-width="2"/>
<text x="130.0" y="174" font-size="14" fill="#2f6f6a" text-anchor="middle" font-weight="700">le modèle</text>
<text x="130.0" y="191" font-size="10.5" fill="#5b5249" text-anchor="middle">des milliards de paramètres,</text>
<text x="46" y="234" font-size="11.5" fill="#2f6f6a" font-weight="700">✓</text>
<text x="62" y="234" font-size="11.5" fill="#3a3531">prolonger un texte</text>
<text x="46" y="252" font-size="11.5" fill="#c4564a" font-weight="700">✗</text>
<text x="62" y="252" font-size="11.5" fill="#3a3531">aucun accès au réseau</text>
<text x="46" y="270" font-size="11.5" fill="#c4564a" font-weight="700">✗</text>
<text x="62" y="270" font-size="11.5" fill="#3a3531">aucun accès aux fichiers</text>
<text x="46" y="288" font-size="11.5" fill="#c4564a" font-weight="700">✗</text>
<text x="62" y="288" font-size="11.5" fill="#3a3531">aucune horloge</text>
<text x="46" y="306" font-size="11.5" fill="#c4564a" font-weight="700">✗</text>
<text x="62" y="306" font-size="11.5" fill="#3a3531">rien ne reste d'un appel</text>
<text x="130" y="205" font-size="10.5" fill="#5b5249" text-anchor="middle">sur des processeurs graphiques</text>
<rect x="350" y="94" width="140" height="30" rx="15" fill="#3a6ea5"/>
<text x="420" y="113.5" font-size="12" fill="#fbf7ee" text-anchor="middle" font-weight="700">l'utilisateur</text>
<line x1="410" y1="126" x2="410" y2="146" stroke="#7a6f63" stroke-width="1.5" marker-end="url(#p)"/>
<line x1="430" y1="148" x2="430" y2="128" stroke="#7a6f63" stroke-width="1.5" marker-end="url(#p)"/>
<rect x="314" y="150" width="212" height="222" rx="10" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="2"/>
<text x="420.0" y="174" font-size="14" fill="#3a6ea5" text-anchor="middle" font-weight="700">le harnais</text>
<text x="420.0" y="191" font-size="10.5" fill="#5b5249" text-anchor="middle">un programme classique</text>
<text x="328" y="216" font-size="11.5" fill="#2f6f6a" font-weight="700">✓</text>
<text x="344" y="216" font-size="11.5" fill="#3a3531">tient la conversation</text>
<text x="328" y="234" font-size="11.5" fill="#2f6f6a" font-weight="700">✓</text>
<text x="344" y="234" font-size="11.5" fill="#3a3531">assemble le texte</text>
<text x="328" y="252" font-size="11.5" fill="#2f6f6a" font-weight="700">✓</text>
<text x="344" y="252" font-size="11.5" fill="#3a3531">lit et vérifie les appels</text>
<text x="328" y="270" font-size="11.5" fill="#2f6f6a" font-weight="700">✓</text>
<text x="344" y="270" font-size="11.5" fill="#3a3531">exécute les outils</text>
<text x="328" y="288" font-size="11.5" fill="#2f6f6a" font-weight="700">✓</text>
<text x="344" y="288" font-size="11.5" fill="#3a3531">applique les permissions</text>
<text x="328" y="306" font-size="11.5" fill="#2f6f6a" font-weight="700">✓</text>
<text x="344" y="306" font-size="11.5" fill="#3a3531">demande des confirmations</text>
<text x="328" y="324" font-size="11.5" fill="#2f6f6a" font-weight="700">✓</text>
<text x="344" y="324" font-size="11.5" fill="#3a3531">affiche la réponse</text>
<rect x="618" y="104" width="184" height="52" rx="8" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="710" y="127" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">base de données</text>
<text x="710" y="144" font-size="10.5" fill="#5b5249" text-anchor="middle">le catalogue</text>
<rect x="618" y="174" width="184" height="52" rx="8" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="710" y="205" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">recherche Web</text>
<rect x="618" y="244" width="184" height="52" rx="8" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="710" y="267" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">messagerie</text>
<text x="710" y="284" font-size="10.5" fill="#5b5249" text-anchor="middle">envoyer un courriel</text>
<rect x="618" y="314" width="184" height="52" rx="8" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="710" y="337" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">bac à sable</text>
<text x="710" y="354" font-size="10.5" fill="#5b5249" text-anchor="middle">exécuter du code, isolé</text>
<text x="710" y="394" font-size="10.5" fill="#5b5249" text-anchor="middle">des programmes ordinaires</text>
<line x1="312" y1="214" x2="232" y2="214" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<text x="270" y="205" font-size="10.5" fill="#5b5249" text-anchor="middle" stroke="#efe7d3" stroke-width="5" paint-order="stroke">texte</text>
<line x1="230" y1="262" x2="310" y2="262" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<text x="270" y="280" font-size="10.5" fill="#5b5249" text-anchor="middle" stroke="#efe7d3" stroke-width="5" paint-order="stroke">la suite,</text>
<text x="270" y="293" font-size="10.5" fill="#5b5249" text-anchor="middle" stroke="#efe7d3" stroke-width="5" paint-order="stroke">parfois</text>
<text x="270" y="306" font-size="10.5" fill="#5b5249" text-anchor="middle" stroke="#efe7d3" stroke-width="5" paint-order="stroke">un appel</text>
<line x1="528" y1="214" x2="612" y2="214" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<text x="570" y="205" font-size="10.5" fill="#5b5249" text-anchor="middle" stroke="#efe7d3" stroke-width="5" paint-order="stroke">exécute</text>
<line x1="614" y1="262" x2="530" y2="262" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<text x="570" y="280" font-size="10.5" fill="#5b5249" text-anchor="middle" stroke="#efe7d3" stroke-width="5" paint-order="stroke">résultat</text>
<text x="420.0" y="460" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="700"><tspan fill="#2f6f6a">le modèle propose</tspan>, <tspan fill="#3a6ea5">le harnais dispose</tspan></text>
<text x="420.0" y="482" font-size="11" fill="#5b5249" text-anchor="middle">ce qu'un assistant peut faire dans le monde dépend des outils que son harnais lui branche, et des permissions qu'il accorde</text>
</svg>
