<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 576" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La température</title>
<desc>Trois diagrammes à barres superposés donnent la probabilité de tirer chaque lettre, de e à k, classées de la plus fréquente à la plus rare. À température basse, la barre du e domine toutes les autres, et le tirage ne donne presque que des e. À température 1, les barres suivent les fréquences du français, et le tirage mêle des lettres courantes. À température haute, les barres sont presque toutes de la même hauteur, et le tirage contient des lettres rares comme w, k ou z.</desc>
