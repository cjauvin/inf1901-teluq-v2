<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Un numéro par mot, ou un plongement</title>
<desc>Deux panneaux. À gauche, trois mots, chat, chien et démocratie, codés chacun par une rangée de cases où une seule case est pleine, à une position différente : les trois paires de mots sont à la même distance. À droite, une carte calculée à partir de vrais plongements : chat, chien, lapin et cheval forment un groupe, rouge, bleu et vert un autre, démocratie, république et liberté un troisième, loin des deux premiers.</desc>
