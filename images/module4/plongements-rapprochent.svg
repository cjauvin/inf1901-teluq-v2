<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Les plongements se rapprochent</title>
<desc>À gauche, une carte des plongements à deux dimensions d'un petit modèle de langage, pendant son entraînement. Chat, chien, camion et tracteur partent de positions tirées au hasard, marquées par des cercles vides, et suivent une trajectoire en pointillés jusqu'à leur position finale, marquée par un point plein. À la fin, chat et chien sont voisins, de même que camion et tracteur. À droite, des barres : la probabilité de « dort » après « le chat », une suite présente dans le corpus, vaut 8 % ; après « le chien », une suite jamais vue, 8 % ; après « le tracteur », 0 %. Un modèle à n-grammes donnerait 0 % à « le chien dort ».</desc>
<rect x="0" y="0" width="840" height="430" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="420.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Pendant l'entraînement, les mots qui partagent leurs contextes se rapprochent</text>
<rect x="30" y="54" width="420" height="356" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="240.0" y="76" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">Les plongements, du début à la fin de l'entraînement</text>
