<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Les plongements se rapprochent</title>
<desc>Trois panneaux reliés par des flèches. 1, le corpus : le chat et le chien mangent, courent, jouent, sautent, boivent et grandissent ; seul le chat dort ; « le chien dort » n'a jamais été vu. Le camion et le tracteur roulent, freinent, accélèrent, tournent, reculent et klaxonnent. 2, les plongements à deux dimensions, au départ et à la fin de l'entraînement : chat et chien partent à une distance de 2,2 et finissent à 0,6 ; camion et tracteur partent à 2,8 et finissent à 0,4 ; les deux paires restent éloignées l'une de l'autre. 3, la conséquence : chien étant placé près de chat, le modèle donne à « dort » la même probabilité après « le chien » qu'après « le chat », 7 %, contre 0 % après « le tracteur ». Un modèle à n-grammes donnerait 0 % à « le chien dort ».</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f6a"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3a6ea5"/></marker></defs>
<rect x="0" y="0" width="900" height="450" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="450.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Les mots qui partagent leurs contextes se rapprochent, et l'un profite de l'autre</text>
<rect x="20" y="54" width="232" height="376" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="136.0" y="78" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">1. Le corpus</text>
<text x="36" y="108" font-size="12" fill="#2f6f6a" font-weight="700">le chat</text>
<text x="102" y="108" font-size="12" fill="#3a3531" font-style="italic">mange, court, joue,</text>
<text x="102" y="126" font-size="12" fill="#3a3531" font-style="italic">saute, boit, grandit</text>
<text x="36" y="154" font-size="12" fill="#2f6f6a" font-weight="700">le chien</text>
<text x="102" y="154" font-size="12" fill="#3a3531" font-style="italic">mange, court, joue,</text>
<text x="102" y="172" font-size="12" fill="#3a3531" font-style="italic">saute, boit, grandit</text>
<text x="36" y="200" font-size="12" fill="#2f6f6a" font-weight="700">le chat</text>
<text x="102" y="200" font-size="12" fill="#3a3531" font-style="italic">dort</text>
<rect x="30" y="218" width="212" height="28" rx="6" fill="#f6dcd6"/>
<text x="36" y="236" font-size="12" fill="#c4564a" font-weight="700">le chien <tspan font-style="italic" font-weight="400">dort</tspan> : jamais vu</text>
<text x="36" y="272" font-size="12" fill="#3a6ea5" font-weight="700">le camion</text>
<text x="36" y="290" font-size="12" fill="#3a6ea5" font-weight="700">le tracteur</text>
<text x="124" y="272" font-size="12" fill="#3a3531" font-style="italic">roule, freine,</text>
<text x="124" y="290" font-size="12" fill="#3a3531" font-style="italic">accélère, tourne…</text>
<rect x="316" y="54" width="300" height="376" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="466.0" y="78" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">2. Les plongements se rapprochent</text>
<line x1="258" y1="230" x2="310" y2="230" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#p)"/>
<text x="284.0" y="204" font-size="9.5" fill="#5b5249" text-anchor="middle">on</text>
<text x="284.0" y="216" font-size="9.5" fill="#5b5249" text-anchor="middle">entraîne</text>
<line x1="487.9" y1="195.9" x2="530.4" y2="134.1" stroke="#2f6f6a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#pt)"/>
<circle cx="484.0" cy="201.7" r="5" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.6"/>
<text x="477.2" y="215.6" font-size="10.5" fill="#5b5249" font-style="italic" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke">chat</text>
<line x1="373.0" y1="152.3" x2="493.2" y2="144.2" stroke="#2f6f6a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#pt)"/>
<circle cx="366.0" cy="152.8" r="5" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.6"/>
<text x="354.0" y="157.6" font-size="10.5" fill="#5b5249" font-style="italic" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke">chien</text>
<line x1="560.1" y1="327.6" x2="512.1" y2="297.3" stroke="#3a6ea5" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#pb)"/>
<circle cx="566.0" cy="331.3" r="5" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="576.2" y="341.7" font-size="10.5" fill="#5b5249" font-style="italic" text-anchor="start" stroke="#fbf7ee" stroke-width="4" paint-order="stroke">camion</text>
<line x1="422.0" y1="265.9" x2="478.1" y2="276.7" stroke="#3a6ea5" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#pb)"/>
<circle cx="415.2" cy="264.5" r="5" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="403.4" y="266.2" font-size="10.5" fill="#5b5249" font-style="italic" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke">tracteur</text>
<circle cx="535.5" cy="126.7" r="6" fill="#2f6f6a"/>
<text x="546.5" y="130.7" font-size="12.5" fill="#2f6f6a" font-weight="700" text-anchor="start" stroke="#fbf7ee" stroke-width="4" paint-order="stroke">chat</text>
<circle cx="502.1" cy="143.5" r="6" fill="#2f6f6a"/>
<text x="502.1" y="131.5" font-size="12.5" fill="#2f6f6a" font-weight="700" text-anchor="middle" stroke="#fbf7ee" stroke-width="4" paint-order="stroke">chien</text>
<circle cx="504.5" cy="292.5" r="6" fill="#3a6ea5"/>
<text x="493.5" y="296.5" font-size="12.5" fill="#3a6ea5" font-weight="700" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke">camion</text>
<circle cx="486.9" cy="278.5" r="6" fill="#3a6ea5"/>
<text x="497.9" y="282.5" font-size="12.5" fill="#3a6ea5" font-weight="700" text-anchor="start" stroke="#fbf7ee" stroke-width="4" paint-order="stroke">tracteur</text>
<text x="466.0" y="382" font-size="11" fill="#2f6f6a" text-anchor="middle">distance chat–chien : 2,2 → <tspan font-weight="700">0,6</tspan></text>
<text x="466.0" y="398" font-size="11" fill="#3a6ea5" text-anchor="middle">distance camion–tracteur : 2,8 → <tspan font-weight="700">0,4</tspan></text>
<text x="466.0" y="414" font-size="10" fill="#5b5249" text-anchor="middle">○ au départ, au hasard   ● à la fin</text>
<rect x="670" y="54" width="210" height="376" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="775.0" y="78" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">3. Le chien hérite du chat</text>
<line x1="622" y1="230" x2="664" y2="230" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#p)"/>
<text x="643.0" y="204" font-size="9.5" fill="#5b5249" text-anchor="middle">chien</text>
<text x="643.0" y="216" font-size="9.5" fill="#5b5249" text-anchor="middle">près de chat</text>
<text x="684" y="110" font-size="11.5" fill="#3a3531" font-weight="700">probabilité de « dort » après…</text>
<text x="684" y="141" font-size="12" fill="#3a3531" font-style="italic" font-weight="700">le chat</text>
<text x="684" y="156" font-size="10" fill="#5b5249">vu</text>
<rect x="762" y="130" width="77.8" height="16" rx="3" fill="#2f6f6a"/>
<text x="845.8" y="143" font-size="12" fill="#3a3531">8 %</text>
<text x="684" y="191" font-size="12" fill="#3a3531" font-style="italic" font-weight="700">le chien</text>
<text x="684" y="206" font-size="10" fill="#c4564a">jamais vu</text>
<rect x="762" y="180" width="73.9" height="16" rx="3" fill="#2f6f6a"/>
<text x="841.9" y="193" font-size="12" fill="#3a3531">7 %</text>
<text x="684" y="241" font-size="12" fill="#3a3531" font-style="italic" font-weight="700">le tracteur</text>
<text x="684" y="256" font-size="10" fill="#c4564a">jamais vu</text>
<rect x="762" y="230" width="2.0" height="16" rx="3" fill="#3a6ea5"/>
<text x="770.0" y="243" font-size="12" fill="#3a3531">0 %</text>
<text x="684" y="300" font-size="10.5" fill="#3a3531">Un modèle à n-grammes, qui</text>
<text x="684" y="315" font-size="10.5" fill="#3a3531">ne fait que compter, donnerait</text>
<text x="684" y="330" font-size="10.5" fill="#3a3531"><tspan font-weight="700">0 %</tspan> à « le chien dort ».</text>
</svg>
