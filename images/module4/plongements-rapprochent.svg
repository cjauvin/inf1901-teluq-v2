<circle cx="70" cy="384" r="5" fill="#fbf7ee" stroke="#7a6f63" stroke-width="1.6"/>
<text x="82" y="388" font-size="10.5" fill="#5b5249">au départ, au hasard</text>
<circle cx="240" cy="384" r="6" fill="#7a6f63"/>
<text x="252" y="388" font-size="10.5" fill="#5b5249">à la fin de l'entraînement</text>
<rect x="470" y="54" width="340" height="356" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="640.0" y="76" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">Ce qu'il apprend sur l'un profite à l'autre</text>
<text x="490" y="124" font-size="12.5" fill="#3a3531" font-weight="700">Probabilité de « dort » après…</text>
<text x="490" y="163" font-size="12" fill="#3a3531" font-style="italic" font-weight="700">le chat</text>
<text x="490" y="178" font-size="10.5" fill="#5b5249">vu dans le corpus</text>
<rect x="580" y="152" width="107.3" height="16" rx="3" fill="#2f6f6a"/>
<text x="693.3" y="165" font-size="12" fill="#3a3531">8 %</text>
<text x="490" y="209" font-size="12" fill="#3a3531" font-style="italic" font-weight="700">le chien</text>
<text x="490" y="224" font-size="10.5" fill="#c4564a">jamais vu</text>
<rect x="580" y="198" width="106.7" height="16" rx="3" fill="#2f6f6a"/>
<text x="692.7" y="211" font-size="12" fill="#3a3531">8 %</text>
<text x="490" y="255" font-size="12" fill="#3a3531" font-style="italic" font-weight="700">le tracteur</text>
<text x="490" y="270" font-size="10.5" fill="#c4564a">jamais vu</text>
<rect x="580" y="244" width="2.0" height="16" rx="3" fill="#3a6ea5"/>
<text x="588.0" y="257" font-size="12" fill="#3a3531">0 %</text>
<text x="490" y="304" font-size="11" fill="#3a3531">Un modèle à n-grammes, qui ne fait que compter,</text>
<text x="490" y="320" font-size="11" fill="#3a3531">donnerait <tspan font-weight="700">0 %</tspan> à « le chien dort ».</text>
<text x="640.0" y="390" font-size="10.5" fill="#5b5249" text-anchor="middle">« chien », voisin de « chat », hérite de</text>
<text x="640.0" y="404" font-size="10.5" fill="#5b5249" text-anchor="middle">ce que le modèle a appris sur « chat »</text>
