<line x1="664.0" y1="133" x2="612.0" y2="260" stroke="#b8a888" stroke-width="1.6"/>
<line x1="664.0" y1="133" x2="716.0" y2="260" stroke="#b8a888" stroke-width="1.6"/>
<line x1="456.0" y1="181" x2="404.0" y2="260" stroke="#b8a888" stroke-width="1.6"/>
<line x1="456.0" y1="181" x2="508.0" y2="206" stroke="#b8a888" stroke-width="1.6"/>
<line x1="508.0" y1="229" x2="508.0" y2="260" stroke="#b8a888" stroke-width="1.6"/>
<line x1="300.0" y1="283" x2="300.0" y2="314" stroke="#b8a888" stroke-width="1.6"/>
<line x1="404.0" y1="283" x2="404.0" y2="314" stroke="#b8a888" stroke-width="1.6"/>
<line x1="508.0" y1="283" x2="508.0" y2="314" stroke="#b8a888" stroke-width="1.6"/>
<line x1="612.0" y1="283" x2="612.0" y2="314" stroke="#b8a888" stroke-width="1.6"/>
<line x1="716.0" y1="283" x2="716.0" y2="314" stroke="#b8a888" stroke-width="1.6"/>
<rect x="485.0" y="56" width="72" height="24" rx="12" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.6"/>
<text x="521.0" y="73" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">Phrase</text>
<rect x="360.0" y="110" width="36" height="24" rx="12" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.6"/>
<text x="378.0" y="127" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">GN</text>
<rect x="646.0" y="110" width="36" height="24" rx="12" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.6"/>
<text x="664.0" y="127" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">GV</text>
<rect x="438.0" y="158" width="36" height="24" rx="12" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.6"/>
<text x="456.0" y="175" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">GN</text>
<rect x="490.0" y="206" width="36" height="24" rx="12" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.6"/>
<text x="508.0" y="223" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">GN</text>
<rect x="277.5" y="260" width="45" height="24" rx="12" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="300.0" y="277" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">Adj</text>
<rect x="381.5" y="260" width="45" height="24" rx="12" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="404.0" y="277" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">Adj</text>
<rect x="485.5" y="260" width="45" height="24" rx="12" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="508.0" y="277" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">Nom</text>
<rect x="580.5" y="260" width="63" height="24" rx="12" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="612.0" y="277" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">Verbe</text>
<rect x="693.5" y="260" width="45" height="24" rx="12" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="716.0" y="277" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">Adv</text>
<text x="300" y="330" font-size="15" fill="#3a3531" text-anchor="middle" font-style="italic" font-weight="600">colorless</text>
<text x="300" y="347" font-size="10.5" fill="#5b5249" text-anchor="middle">incolores</text>
<text x="404" y="330" font-size="15" fill="#3a3531" text-anchor="middle" font-style="italic" font-weight="600">green</text>
<text x="404" y="347" font-size="10.5" fill="#5b5249" text-anchor="middle">vertes</text>
<text x="508" y="330" font-size="15" fill="#3a3531" text-anchor="middle" font-style="italic" font-weight="600">ideas</text>
<text x="508" y="347" font-size="10.5" fill="#5b5249" text-anchor="middle">idées</text>
<text x="612" y="330" font-size="15" fill="#3a3531" text-anchor="middle" font-style="italic" font-weight="600">sleep</text>
<text x="612" y="347" font-size="10.5" fill="#5b5249" text-anchor="middle">dorment</text>
<text x="716" y="330" font-size="15" fill="#3a3531" text-anchor="middle" font-style="italic" font-weight="600">furiously</text>
<text x="716" y="347" font-size="10.5" fill="#5b5249" text-anchor="middle">furieusement</text>
<rect x="20" y="380" width="740" height="56" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<circle cx="52" cy="408" r="13" fill="#c4564a"/>
<path d="M46 402 L58 414 M58 402 L46 414" stroke="#fbf7ee" stroke-width="2.6" stroke-linecap="round"/>
<text x="78" y="413" font-size="15" fill="#3a3531" font-style="italic" font-weight="600">Furiously sleep ideas green colorless</text>
<text x="744" y="413" font-size="11.5" fill="#c4564a" text-anchor="end">aucune combinaison des règles ne produit cette phrase</text>
