<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Un arbre syntaxique</title>
<desc>À gauche, quatre règles de grammaire : une phrase est un groupe nominal suivi d'un groupe verbal ; un groupe nominal est un adjectif suivi d'un groupe nominal, ou un nom seul ; un groupe verbal est un verbe suivi d'un adverbe. Au centre, l'arbre que ces règles construisent pour « Colorless green ideas sleep furiously » : la phrase se divise en un groupe nominal, « colorless green ideas », fait de deux adjectifs et d'un nom emboîtés, et un groupe verbal, « sleep furiously », fait d'un verbe et d'un adverbe. En bas, la même phrase à l'envers, « Furiously sleep ideas green colorless », marquée d'une croix : aucune combinaison des règles ne permet de la construire.</desc>
<rect x="0" y="0" width="780" height="470" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="390.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Une grammaire générative : des règles qui construisent les phrases</text>
<rect x="20" y="56" width="214" height="196" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="36" y="80" font-size="12.5" fill="#9a5b33" font-weight="700">Quatre règles</text>
<text x="36" y="112" font-size="13" fill="#3a3531"><tspan font-weight="700" fill="#2f6f6a">Phrase</tspan> → GN GV</text>
<text x="36" y="142" font-size="13" fill="#3a3531"><tspan font-weight="700" fill="#2f6f6a">GN</tspan> → Adj GN</text>
<text x="36" y="172" font-size="13" fill="#3a3531"><tspan font-weight="700" fill="#2f6f6a">GN</tspan> → Nom</text>
<text x="36" y="202" font-size="13" fill="#3a3531"><tspan font-weight="700" fill="#2f6f6a">GV</tspan> → Verbe Adv</text>
<text x="36" y="230" font-size="10.5" fill="#5b5249">GN : groupe nominal</text>
<text x="36" y="245" font-size="10.5" fill="#5b5249">GV : groupe verbal</text>
<line x1="521.0" y1="79" x2="378.0" y2="110" stroke="#b8a888" stroke-width="1.6"/>
<line x1="521.0" y1="79" x2="664.0" y2="110" stroke="#b8a888" stroke-width="1.6"/>
<line x1="378.0" y1="133" x2="300.0" y2="260" stroke="#b8a888" stroke-width="1.6"/>
