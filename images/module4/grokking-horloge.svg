<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Additionner sur des horloges</title>
<desc>À gauche, une horloge de 12 heures. Une aiguille bleue pointe sur 9 ; un arc vert avance de 5 heures et arrive sur 2, marqué en rouge : 9 + 5 = 14, soit 2 sur l'horloge. Additionner, c'est faire tourner l'aiguille. À droite, ce que fait le réseau pour l'addition modulo 113 : trois petits cercles, qui tournent à des vitesses différentes (fréquences 14, 35 et 41). Sur chacun, le nombre 9 est un point bleu, et l'ajout de 5 le fait tourner jusqu'au point rouge, la position de 14. Le réseau combine les angles des deux nombres par une identité trigonométrique, puis lit la réponse là où tous les cercles s'accordent.</desc>
<defs><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3a6ea5"/></marker><marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f6a"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c4564a"/></marker></defs>
<rect x="0" y="0" width="840" height="440" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="420.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Additionner en tournant : l'arithmétique de l'horloge</text>
<rect x="20" y="50" width="380" height="370" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<rect x="420" y="50" width="400" height="370" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="210" y="76" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">Sur une horloge de 12 heures</text>
<circle cx="210" cy="236" r="102" fill="#efe7d3" stroke="#b8a888" stroke-width="2"/>
<text x="210.0" y="156.5" font-size="13" fill="#5b5249" text-anchor="middle" font-weight="400">12</text>
<line x1="210.0" y1="134.0" x2="210.0" y2="140.0" stroke="#b8a888" stroke-width="1.5"/>
<text x="252.0" y="167.8" font-size="13" fill="#5b5249" text-anchor="middle" font-weight="400">1</text>
<line x1="261.0" y1="147.7" x2="258.0" y2="152.9" stroke="#b8a888" stroke-width="1.5"/>
<text x="282.7" y="198.5" font-size="13" fill="#c4564a" text-anchor="middle" font-weight="700">2</text>
<line x1="298.3" y1="185.0" x2="293.1" y2="188.0" stroke="#b8a888" stroke-width="1.5"/>
<text x="294.0" y="240.5" font-size="13" fill="#5b5249" text-anchor="middle" font-weight="400">3</text>
<line x1="312.0" y1="236.0" x2="306.0" y2="236.0" stroke="#b8a888" stroke-width="1.5"/>
<text x="282.7" y="282.5" font-size="13" fill="#5b5249" text-anchor="middle" font-weight="400">4</text>
<line x1="298.3" y1="287.0" x2="293.1" y2="284.0" stroke="#b8a888" stroke-width="1.5"/>
<text x="252.0" y="313.2" font-size="13" fill="#5b5249" text-anchor="middle" font-weight="400">5</text>
<line x1="261.0" y1="324.3" x2="258.0" y2="319.1" stroke="#b8a888" stroke-width="1.5"/>
<text x="210.0" y="324.5" font-size="13" fill="#5b5249" text-anchor="middle" font-weight="400">6</text>
<line x1="210.0" y1="338.0" x2="210.0" y2="332.0" stroke="#b8a888" stroke-width="1.5"/>
<text x="168.0" y="313.2" font-size="13" fill="#5b5249" text-anchor="middle" font-weight="400">7</text>
<line x1="159.0" y1="324.3" x2="162.0" y2="319.1" stroke="#b8a888" stroke-width="1.5"/>
<text x="137.3" y="282.5" font-size="13" fill="#5b5249" text-anchor="middle" font-weight="400">8</text>
<line x1="121.7" y1="287.0" x2="126.9" y2="284.0" stroke="#b8a888" stroke-width="1.5"/>
<text x="126.0" y="240.5" font-size="13" fill="#3a6ea5" text-anchor="middle" font-weight="700">9</text>
<line x1="108.0" y1="236.0" x2="114.0" y2="236.0" stroke="#b8a888" stroke-width="1.5"/>
<text x="137.3" y="198.5" font-size="13" fill="#5b5249" text-anchor="middle" font-weight="400">10</text>
<line x1="121.7" y1="185.0" x2="126.9" y2="188.0" stroke="#b8a888" stroke-width="1.5"/>
<text x="168.0" y="167.8" font-size="13" fill="#5b5249" text-anchor="middle" font-weight="400">11</text>
<line x1="159.0" y1="147.7" x2="162.0" y2="152.9" stroke="#b8a888" stroke-width="1.5"/>
<line x1="210" y1="236" x2="144.0" y2="236.0" stroke="#3a6ea5" stroke-width="3" marker-end="url(#mb)"/>
<path d="M94.0 236.0 A116 116 0 0 1 310.5 178.0" fill="none" stroke="#2f6f6a" stroke-width="3" marker-end="url(#mt)"/>
<text x="103.2" y="158.4" font-size="12" fill="#2f6f6a" text-anchor="middle" font-weight="700">+5</text>
<circle cx="210" cy="236" r="4" fill="#3a3531"/>
<text x="210" y="388" font-size="12" fill="#3a3531" text-anchor="middle">9 + 5 = 14, soit <tspan fill="#c4564a" font-weight="700">2</tspan> sur l'horloge.</text>
<text x="210" y="406" font-size="11.5" fill="#5b5249" text-anchor="middle">Additionner, c'est faire tourner l'aiguille.</text>
<text x="620" y="76" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">Dans le réseau, modulo 113</text>
<text x="620" y="96" font-size="11" fill="#5b5249" text-anchor="middle">9 + 5, sur trois des cercles qu'il utilise</text>
<circle cx="492" cy="196" r="48" fill="#efe7d3" stroke="#b8a888" stroke-width="1.6"/>
<path d="M523.8 160.0 A48 48 0 1 1 444.2 200.7" fill="none" stroke="#2f6f6a" stroke-width="2.4" marker-end="url(#mt)"/>
<circle cx="523.8" cy="160.0" r="5.5" fill="#3a6ea5" stroke="#fbf7ee" stroke-width="1.5"/>
<circle cx="444.2" cy="200.7" r="5.5" fill="#c4564a" stroke="#fbf7ee" stroke-width="1.5"/>
<text x="492" y="266" font-size="11" fill="#3a3531" text-anchor="middle">fréquence 14</text>
<text x="492" y="281" font-size="10" fill="#5b5249" text-anchor="middle">14 tours pour 113</text>
<circle cx="620" cy="196" r="48" fill="#efe7d3" stroke="#b8a888" stroke-width="1.6"/>
<path d="M573.3 184.8 A48 48 0 1 1 661.1 220.8" fill="none" stroke="#2f6f6a" stroke-width="2.4" marker-end="url(#mt)"/>
<circle cx="573.3" cy="184.8" r="5.5" fill="#3a6ea5" stroke="#fbf7ee" stroke-width="1.5"/>
<circle cx="661.1" cy="220.8" r="5.5" fill="#c4564a" stroke="#fbf7ee" stroke-width="1.5"/>
<text x="620" y="266" font-size="11" fill="#3a3531" text-anchor="middle">fréquence 35</text>
<text x="620" y="281" font-size="10" fill="#5b5249" text-anchor="middle">35 tours pour 113</text>
<circle cx="748" cy="196" r="48" fill="#efe7d3" stroke="#b8a888" stroke-width="1.6"/>
<path d="M795.8 200.7 A48 48 0 1 1 771.0 153.9" fill="none" stroke="#2f6f6a" stroke-width="2.4" marker-end="url(#mt)"/>
<circle cx="795.8" cy="200.7" r="5.5" fill="#3a6ea5" stroke="#fbf7ee" stroke-width="1.5"/>
<circle cx="771.0" cy="153.9" r="5.5" fill="#c4564a" stroke="#fbf7ee" stroke-width="1.5"/>
<text x="748" y="266" font-size="11" fill="#3a3531" text-anchor="middle">fréquence 41</text>
<text x="748" y="281" font-size="10" fill="#5b5249" text-anchor="middle">41 tours pour 113</text>
<circle cx="470" cy="308" r="5.5" fill="#3a6ea5"/>
<text x="482" y="312" font-size="11" fill="#3a3531">le nombre 9</text>
<circle cx="590" cy="308" r="5.5" fill="#c4564a"/>
<text x="602" y="312" font-size="11" fill="#3a3531">9 + 5 = 14</text>
<line x1="700" y1="308" x2="730" y2="308" stroke="#2f6f6a" stroke-width="2.4" marker-end="url(#mt)"/>
<text x="738" y="312" font-size="11" fill="#3a3531">ajouter 5</text>
<text x="620" y="340" font-size="11.5" fill="#3a3531" text-anchor="middle">Chaque nombre devient un angle sur quelques cercles,</text>
<text x="620" y="356" font-size="11.5" fill="#3a3531" text-anchor="middle">chacun tournant à sa vitesse. Le réseau combine les angles</text>
<text x="620" y="372" font-size="11.5" fill="#3a3531" text-anchor="middle">par une identité trigonométrique, puis lit la réponse</text>
<text x="620" y="388" font-size="11.5" fill="#3a3531" text-anchor="middle">là où tous les cercles s'accordent.</text>
</svg>
