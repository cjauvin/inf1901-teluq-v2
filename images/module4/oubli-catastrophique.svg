<text x="620" y="87.43494927883148" font-size="11.5" fill="#3a6ea5" font-weight="700">tâche B : 97 %</text>
<text x="620" y="101.43494927883148" font-size="10.5" fill="#3a6ea5">apprise</text>
<text x="620" y="142.2878211736679" font-size="11.5" fill="#2f6f6a" font-weight="700">tâche A : 87 %</text>
<text x="620" y="156.2878211736679" font-size="10.5" fill="#2f6f6a">en rejouant d'anciens exemples</text>
<text x="620" y="340.0" font-size="11.5" fill="#2f6f6a" font-weight="700">tâche A : 0 %</text>
<text x="620" y="354.0" font-size="10.5" fill="#c4564a" font-weight="700">oubliée</text>
<text x="350.0" y="396" font-size="11" fill="#5b5249" text-anchor="middle">trait plein : on ne montre que les nouveaux exemples ; pointillés : on y mêle 8 anciens exemples sur 32</text>
</svg>
