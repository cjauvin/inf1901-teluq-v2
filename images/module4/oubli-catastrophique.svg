<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>L'oubli catastrophique</title>
<desc>Un graphique de la justesse d'un petit réseau au fil de l'entraînement. Pendant la première moitié, il apprend à reconnaître les chiffres manuscrits 0 à 4 (tâche A), et sa justesse sur cette tâche monte à 99 %. Pendant la seconde moitié, on ne lui montre plus que les chiffres 5 à 9 (tâche B). Sa justesse sur la tâche B monte à 97 %, mais celle sur la tâche A s'effondre, jusqu'à 0 % : il a oublié. Une courbe en pointillés montre la même expérience quand on rejoue quelques anciens exemples de la tâche A parmi les nouveaux : la justesse sur la tâche A reste à 87 %.</desc>
<rect x="0" y="0" width="840" height="430" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="420.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">L'oubli catastrophique : apprendre B fait oublier A</text>
<rect x="20" y="52" width="800" height="358" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<rect x="350.0" y="96" width="260.0" height="250" fill="#f3ecdc"/>
<text x="220.0" y="82" font-size="12" fill="#2f6f6a" text-anchor="middle" font-weight="700">on entraîne sur A : chiffres 0 à 4</text>
<text x="480.0" y="82" font-size="12" fill="#3a6ea5" text-anchor="middle" font-weight="700">puis seulement sur B : chiffres 5 à 9</text>
<line x1="350.0" y1="96" x2="350.0" y2="346" stroke="#b8a888" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="90" y1="346" x2="610" y2="346" stroke="#d9cbac" stroke-width="0.8"/>
<text x="82" y="350" font-size="10.5" fill="#5b5249" text-anchor="end">0 %</text>
<line x1="90" y1="283.5" x2="610" y2="283.5" stroke="#d9cbac" stroke-width="0.8"/>
<text x="82" y="287.5" font-size="10.5" fill="#5b5249" text-anchor="end">25 %</text>
<line x1="90" y1="221.0" x2="610" y2="221.0" stroke="#d9cbac" stroke-width="0.8"/>
<text x="82" y="225.0" font-size="10.5" fill="#5b5249" text-anchor="end">50 %</text>
<line x1="90" y1="158.5" x2="610" y2="158.5" stroke="#d9cbac" stroke-width="0.8"/>
<text x="82" y="162.5" font-size="10.5" fill="#5b5249" text-anchor="end">75 %</text>
<line x1="90" y1="96" x2="610" y2="96" stroke="#d9cbac" stroke-width="0.8"/>
<text x="82" y="100" font-size="10.5" fill="#5b5249" text-anchor="end">100 %</text>
<line x1="90" y1="346" x2="610" y2="346" stroke="#b8a888" stroke-width="1.2"/>
<text x="40" y="221.0" font-size="11" fill="#5b5249" text-anchor="middle" transform="rotate(-90 40 221.0)">justesse</text>
<text x="350.0" y="368" font-size="11" fill="#5b5249" text-anchor="middle">pas d'entraînement →</text>
