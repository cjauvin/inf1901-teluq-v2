<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Du modèle de base à l'assistant</title>
<desc>Trois colonnes reliées par des flèches. 1, le préentraînement : des milliers de milliards de jetons de textes, la tâche de prédire le jeton suivant, et pour résultat un modèle de base qui continue des textes. 2, l'ajustement par instructions : des dizaines de milliers d'exemples de requêtes et de bonnes réponses rédigées par des humains, et pour résultat un modèle qui répond aux requêtes. 3, l'apprentissage par renforcement : des humains comparent des réponses, un modèle de récompense apprend leurs préférences, et le modèle est ajusté pour obtenir la meilleure récompense ; pour les mathématiques et le code, la récompense peut venir d'une vérification automatique. Le résultat est un assistant. 4, en grisé, au moment de la réponse : aucun entraînement, les poids ne changent plus, mais le modèle peut réfléchir plus ou moins longtemps avant de répondre ; plus de calcul donne de meilleures réponses. Des accolades regroupent les étapes : la première est le préentraînement, la deuxième et la troisième forment le post-entraînement, la quatrième se passe au moment de la réponse.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
<rect x="0" y="0" width="900" height="470" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="450.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Du modèle de base à l'assistant</text>
<rect x="22" y="52" width="196" height="252" rx="10" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="2"/>
<circle cx="44" cy="76" r="12" fill="#3a6ea5"/>
<text x="44" y="80.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="64" y="81" font-size="14" fill="#3a6ea5" font-weight="700">Préentraînement</text>
<text x="36" y="110" font-size="11" fill="#7a6f63">DONNÉES</text>
<text x="36" y="127" font-size="12" fill="#3a3531">des milliers de milliards</text>
<text x="36" y="142" font-size="12" fill="#3a3531">de jetons de textes</text>
<text x="36" y="171" font-size="11" fill="#7a6f63">TÂCHE</text>
<text x="36" y="188" font-size="12" fill="#3a3531" font-weight="600">prédire le jeton suivant</text>
<text x="36" y="213" font-size="11.5" fill="#5b5249" font-style="italic">des semaines de calcul,</text>
<text x="36" y="228" font-size="11.5" fill="#5b5249" font-style="italic">l'essentiel du coût</text>
<rect x="34" y="318" width="172" height="48" rx="8" fill="#efe7d3" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="120.0" y="338" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">un modèle de base,</text>
<text x="120.0" y="355" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">qui continue des textes</text>
<line x1="120.0" y1="304" x2="120.0" y2="316" stroke="#3a6ea5" stroke-width="1.6"/>
<line x1="206" y1="342" x2="248" y2="342" stroke="#7a6f63" stroke-width="2" marker-end="url(#p)"/>
<rect x="238" y="52" width="196" height="252" rx="10" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="2"/>
<circle cx="260" cy="76" r="12" fill="#2f6f6a"/>
<text x="260" y="80.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="280" y="81" font-size="14" fill="#2f6f6a" font-weight="700">Ajustement</text>
<text x="252" y="110" font-size="11" fill="#7a6f63">DONNÉES</text>
<text x="252" y="127" font-size="12" fill="#3a3531">des dizaines de milliers</text>
<text x="252" y="142" font-size="12" fill="#3a3531">de requêtes et de réponses</text>
<text x="252" y="157" font-size="12" fill="#3a3531">rédigées par des humains</text>
<text x="252" y="186" font-size="11" fill="#7a6f63">TÂCHE</text>
<text x="252" y="203" font-size="12" fill="#3a3531" font-weight="600">imiter ces réponses</text>
<text x="252" y="228" font-size="11.5" fill="#5b5249" font-style="italic">quelques jours</text>
<rect x="250" y="318" width="172" height="48" rx="8" fill="#efe7d3" stroke="#2f6f6a" stroke-width="1.6"/>
<text x="336.0" y="338" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">un modèle qui répond</text>
<text x="336.0" y="355" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">aux requêtes</text>
<line x1="336.0" y1="304" x2="336.0" y2="316" stroke="#2f6f6a" stroke-width="1.6"/>
<line x1="422" y1="342" x2="464" y2="342" stroke="#7a6f63" stroke-width="2" marker-end="url(#p)"/>
<rect x="454" y="52" width="196" height="252" rx="10" fill="#fbf7ee" stroke="#9a5b33" stroke-width="2"/>
<circle cx="476" cy="76" r="12" fill="#9a5b33"/>
<text x="476" y="80.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="496" y="81" font-size="14" fill="#9a5b33" font-weight="700">Renforcement</text>
<text x="468" y="110" font-size="11" fill="#7a6f63">DONNÉES</text>
<text x="468" y="127" font-size="12" fill="#3a3531">des humains comparent</text>
<text x="468" y="142" font-size="12" fill="#3a3531">deux réponses ; un modèle</text>
<text x="468" y="157" font-size="12" fill="#3a3531">de récompense apprend</text>
<text x="468" y="172" font-size="12" fill="#3a3531">leurs préférences</text>
<text x="468" y="201" font-size="11" fill="#7a6f63">TÂCHE</text>
<text x="468" y="218" font-size="12" fill="#3a3531" font-weight="600">obtenir la meilleure</text>
<text x="468" y="233" font-size="12" fill="#3a3531" font-weight="600">récompense</text>
<text x="468" y="258" font-size="11.5" fill="#5b5249" font-style="italic">ou une vérification</text>
<text x="468" y="273" font-size="11.5" fill="#5b5249" font-style="italic">automatique (calcul, code)</text>
<rect x="466" y="318" width="172" height="48" rx="8" fill="#efe7d3" stroke="#9a5b33" stroke-width="1.6"/>
<text x="552.0" y="347" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">un assistant</text>
<line x1="552.0" y1="304" x2="552.0" y2="316" stroke="#9a5b33" stroke-width="1.6"/>
<line x1="638" y1="342" x2="680" y2="342" stroke="#7a6f63" stroke-width="2" marker-end="url(#p)"/>
<rect x="670" y="52" width="196" height="252" rx="10" fill="#fbf7ee" stroke="#7a6f63" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="692" cy="76" r="12" fill="#7a6f63"/>
<text x="692" y="80.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="712" y="81" font-size="14" fill="#7a6f63" font-weight="700">La réponse</text>
<text x="684" y="110" font-size="11" fill="#7a6f63">ENTRÉE</text>
<text x="684" y="127" font-size="12" fill="#3a3531">la requête de</text>
<text x="684" y="142" font-size="12" fill="#3a3531">l'utilisateur ; aucun</text>
<text x="684" y="157" font-size="12" fill="#3a3531">entraînement, les poids</text>
<text x="684" y="172" font-size="12" fill="#3a3531">ne changent plus</text>
<text x="684" y="201" font-size="11" fill="#7a6f63">TÂCHE</text>
<text x="684" y="218" font-size="12" fill="#3a3531" font-weight="600">réfléchir plus ou moins</text>
<text x="684" y="233" font-size="12" fill="#3a3531" font-weight="600">longtemps, puis répondre</text>
<text x="684" y="258" font-size="11.5" fill="#5b5249" font-style="italic">plus de calcul, de meilleures</text>
<text x="684" y="273" font-size="11.5" fill="#5b5249" font-style="italic">réponses (modèles de</text>
<text x="684" y="288" font-size="11.5" fill="#5b5249" font-style="italic">raisonnement)</text>
<rect x="682" y="318" width="172" height="48" rx="8" fill="#efe7d3" stroke="#7a6f63" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="768.0" y="347" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">une réponse</text>
<line x1="768.0" y1="304" x2="768.0" y2="316" stroke="#7a6f63" stroke-width="1.6"/>
<path d="M28 378 Q28 388 38 388 H112.0 Q120.0 388 120.0 396 Q120.0 388 128.0 388 H202 Q212 388 212 378" fill="none" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="120.0" y="414" font-size="13" fill="#3a6ea5" text-anchor="middle" font-weight="700">préentraînement</text>
<text x="120.0" y="430" font-size="11" fill="#3a6ea5" text-anchor="middle" font-style="italic">pre-training</text>
<path d="M244 378 Q244 388 254 388 H436.0 Q444.0 388 444.0 396 Q444.0 388 452.0 388 H634 Q644 388 644 378" fill="none" stroke="#9a5b33" stroke-width="1.6"/>
<text x="444.0" y="414" font-size="13" fill="#9a5b33" text-anchor="middle" font-weight="700">post-entraînement</text>
<text x="444.0" y="430" font-size="11" fill="#9a5b33" text-anchor="middle" font-style="italic">post-training</text>
<path d="M676 378 Q676 388 686 388 H760.0 Q768.0 388 768.0 396 Q768.0 388 776.0 388 H850 Q860 388 860 378" fill="none" stroke="#7a6f63" stroke-width="1.6"/>
<text x="768.0" y="414" font-size="13" fill="#7a6f63" text-anchor="middle" font-weight="700">au moment de la réponse</text>
<text x="768.0" y="430" font-size="11" fill="#7a6f63" text-anchor="middle" font-style="italic">test-time</text>
<text x="450.0" y="458" font-size="11.5" fill="#7a6f63" text-anchor="middle">Chaque étape part du modèle produit par la précédente.</text>
</svg>
