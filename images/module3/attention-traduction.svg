<text x="286" y="104" font-size="12" fill="#5b5249" text-anchor="end">traduction (français)</text>
<text x="350.0" y="394" font-size="12.5" fill="#7a6f63" text-anchor="middle">Chaque ligne donne les poids de l'attention pour un mot écrit ; ils totalisent 1.</text>
