<text x="286" y="276.0" font-size="13" fill="#c4564a" text-anchor="end" font-weight="700">économique</text>
<rect x="300" y="240" width="62" height="62" fill="#3a3531" fill-opacity="0.07" stroke="#fbf7ee" stroke-width="2"/>
