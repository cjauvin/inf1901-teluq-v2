<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>L'architecture encodeur-décodeur pour la traduction</title>
<desc>À gauche, l'encodeur, un réseau récurrent, lit les mots « le », « chat » et « dort » un à un. Son état final, au centre, résume la phrase. À droite, le décodeur, un second réseau récurrent, part de ce résumé et écrit « the », « cat » et « sleeps » un à un.</desc>
