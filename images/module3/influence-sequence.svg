<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>L'influence de chaque élément d'une séquence sur l'apprentissage</title>
<desc>Un diagramme à barres pour une séquence de douze éléments. La barre du dernier élément, à droite, est la plus haute. Les barres diminuent vers la gauche, et celles des premiers éléments de la séquence sont presque nulles.</desc>
