<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La propagation avant et la rétropropagation</title>
<desc>Deux panneaux qui montrent le réseau du XOR : deux entrées, deux neurones cachés, un neurone de sortie. À gauche, la propagation avant : les flèches vont de l'entrée vers la sortie ; le réseau répond 0,62 alors que la bonne réponse est 1, soit une erreur de 0,38. À droite, la rétropropagation : les flèches vont de la sortie vers l'entrée ; le neurone 1, relié à la sortie par un poids élevé, reçoit une grande part de l'erreur, et le neurone 2, relié par un poids faible, une petite part.</desc>
<rect x="0" y="0" width="700" height="430" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="350.0" y="36" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Pour chaque exemple : un aller, puis un retour</text>
<rect x="22" y="58" width="320" height="330" rx="10" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.2"/>
<text x="182.0" y="84" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="700">1. La propagation avant</text>
<text x="182.0" y="103" font-size="12" fill="#5b5249" text-anchor="middle">le réseau calcule sa réponse</text>
<line x1="100.0" y1="170.0" x2="140.1" y2="170.0" stroke="#2f6f6a" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="152.0,170.0 140.1,164.7 140.1,175.3" fill="#2f6f6a"/>
<line x1="100.0" y1="182.0" x2="145.3" y2="248.2" stroke="#2f6f6a" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="152.0,258.0 149.7,245.2 140.9,251.2" fill="#2f6f6a"/>
<line x1="100.0" y1="258.0" x2="145.3" y2="191.8" stroke="#2f6f6a" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="152.0,182.0 140.9,188.8 149.7,194.8" fill="#2f6f6a"/>
<line x1="100.0" y1="270.0" x2="140.1" y2="270.0" stroke="#2f6f6a" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="152.0,270.0 140.1,264.7 140.1,275.3" fill="#2f6f6a"/>
<line x1="212.0" y1="180.0" x2="249.9" y2="203.7" stroke="#2f6f6a" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="260.0,210.0 252.7,199.2 247.1,208.2" fill="#2f6f6a"/>
<line x1="212.0" y1="260.0" x2="249.9" y2="236.3" stroke="#2f6f6a" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="260.0,230.0 247.1,231.8 252.7,240.8" fill="#2f6f6a"/>
<circle cx="74" cy="170" r="22" fill="#efe7d3" stroke="#3a6ea5" stroke-width="2"/>
<text x="74" y="175" font-size="13" fill="#3a6ea5" text-anchor="middle" font-weight="700">A = 0</text>
<circle cx="74" cy="270" r="22" fill="#efe7d3" stroke="#3a6ea5" stroke-width="2"/>
<text x="74" y="275" font-size="13" fill="#3a6ea5" text-anchor="middle" font-weight="700">B = 1</text>
<circle cx="182" cy="170" r="26" fill="#efe7d3" stroke="#2f6f6a" stroke-width="2.2"/>
<text x="182" y="168" font-size="10.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">neurone</text>
<text x="182" y="182" font-size="12" fill="#2f6f6a" text-anchor="middle" font-weight="700">1</text>
<circle cx="182" cy="270" r="26" fill="#efe7d3" stroke="#2f6f6a" stroke-width="2.2"/>
<text x="182" y="268" font-size="10.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">neurone</text>
<text x="182" y="282" font-size="12" fill="#2f6f6a" text-anchor="middle" font-weight="700">2</text>
<circle cx="290" cy="220" r="26" fill="#efe7d3" stroke="#9a5b33" stroke-width="2.2"/>
<text x="290" y="224" font-size="11.5" fill="#9a5b33" text-anchor="middle" font-weight="700">sortie</text>
<text x="290" y="180" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">0,62</text>
<text x="80" y="338" font-size="11.5" fill="#5b5249" text-anchor="middle">réponse du réseau</text>
<text x="80" y="360" font-size="17" fill="#9a5b33" text-anchor="middle" font-weight="700">0,62</text>
<text x="182" y="338" font-size="11.5" fill="#5b5249" text-anchor="middle">bonne réponse</text>
<text x="182" y="360" font-size="17" fill="#3a3531" text-anchor="middle" font-weight="700">1</text>
<text x="284" y="338" font-size="11.5" fill="#5b5249" text-anchor="middle">erreur</text>
<text x="284" y="360" font-size="17" fill="#c4564a" text-anchor="middle" font-weight="700">0,38</text>
<rect x="358" y="58" width="320" height="330" rx="10" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.2"/>
<text x="518.0" y="84" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="700">2. La rétropropagation</text>
<text x="518.0" y="103" font-size="12" fill="#5b5249" text-anchor="middle">l'erreur remonte vers l'entrée</text>
<line x1="488.0" y1="170.0" x2="449.2" y2="170.0" stroke="#c4564a" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="436.0,170.0 449.2,176.1 449.2,163.9" fill="#c4564a"/>
<line x1="488.0" y1="258.0" x2="442.2" y2="191.0" stroke="#c4564a" stroke-width="1.2" stroke-linecap="round"/>
<polygon points="436.0,182.0 438.3,193.7 446.0,188.4" fill="#c4564a"/>
<line x1="488.0" y1="182.0" x2="443.4" y2="247.1" stroke="#c4564a" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="436.0,258.0 448.5,250.6 438.4,243.7" fill="#c4564a"/>
<line x1="488.0" y1="270.0" x2="446.9" y2="270.0" stroke="#c4564a" stroke-width="1.2" stroke-linecap="round"/>
<polygon points="436.0,270.0 446.9,274.7 446.9,265.3" fill="#c4564a"/>
<line x1="596.0" y1="210.0" x2="561.3" y2="188.3" stroke="#c4564a" stroke-width="4.2" stroke-linecap="round"/>
<polygon points="548.0,180.0 557.2,194.9 565.4,181.8" fill="#c4564a"/>
<line x1="596.0" y1="230.0" x2="557.5" y2="254.0" stroke="#c4564a" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="548.0,260.0 560.1,258.2 554.9,249.9" fill="#c4564a"/>
<circle cx="410" cy="170" r="22" fill="#efe7d3" stroke="#3a6ea5" stroke-width="2"/>
<text x="410" y="175" font-size="13" fill="#3a6ea5" text-anchor="middle" font-weight="700">A = 0</text>
<circle cx="410" cy="270" r="22" fill="#efe7d3" stroke="#3a6ea5" stroke-width="2"/>
<text x="410" y="275" font-size="13" fill="#3a6ea5" text-anchor="middle" font-weight="700">B = 1</text>
<circle cx="518" cy="170" r="26" fill="#efe7d3" stroke="#2f6f6a" stroke-width="2.2"/>
<text x="518" y="168" font-size="10.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">neurone</text>
<text x="518" y="182" font-size="12" fill="#2f6f6a" text-anchor="middle" font-weight="700">1</text>
<circle cx="518" cy="270" r="26" fill="#efe7d3" stroke="#2f6f6a" stroke-width="2.2"/>
<text x="518" y="268" font-size="10.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">neurone</text>
<text x="518" y="282" font-size="12" fill="#2f6f6a" text-anchor="middle" font-weight="700">2</text>
<circle cx="626" cy="220" r="26" fill="#efe7d3" stroke="#9a5b33" stroke-width="2.2"/>
<text x="626" y="224" font-size="11.5" fill="#9a5b33" text-anchor="middle" font-weight="700">sortie</text>
<text x="626" y="180" font-size="12.5" fill="#c4564a" text-anchor="middle" font-weight="700">erreur</text>
<text x="518" y="134" font-size="12" fill="#c4564a" text-anchor="middle" font-weight="700">grande part</text>
<text x="518" y="316" font-size="12" fill="#c4564a" text-anchor="middle" font-weight="700">petite part</text>
<text x="518" y="352" font-size="11.5" fill="#5b5249" text-anchor="middle">Une flèche épaisse correspond à un poids élevé.</text>
<text x="518" y="370" font-size="11.5" fill="#5b5249" text-anchor="middle">Chaque poids reçoit sa part de l'erreur.</text>
<text x="350.0" y="414" font-size="12.5" fill="#7a6f63" text-anchor="middle">Après le retour, tous les poids sont modifiés un peu, puis on passe à l'exemple suivant.</text>
</svg>
