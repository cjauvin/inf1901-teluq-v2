<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La double descente</title>
<desc>Un graphique. À l'horizontale, la taille du modèle ; à la verticale, l'erreur sur des exemples nouveaux. La courbe descend, remonte jusqu'à un pic, puis redescend plus bas qu'avant. La partie à gauche du pic est la courbe en U du Module 2. Le pic se trouve à la taille où le modèle peut mémoriser tous ses exemples. La partie à droite est celle des grands réseaux.</desc>
<rect x="0" y="0" width="700" height="400" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="350.0" y="36" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">La double descente</text>
<rect x="80" y="88" width="273.6" height="230" fill="#9a5b33" fill-opacity="0.06"/>
<rect x="353.6" y="88" width="296.4" height="230" fill="#2f6f6a" fill-opacity="0.07"/>
<line x1="80" y1="318" x2="650" y2="318" stroke="#b8a888" stroke-width="1.5"/>
<line x1="80" y1="318" x2="80" y2="88" stroke="#b8a888" stroke-width="1.5"/>
<line x1="353.6" y1="318" x2="353.6" y2="88" stroke="#7a6f63" stroke-width="1.3" stroke-dasharray="5 5"/>
