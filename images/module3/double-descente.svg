<text x="216.8" y="108" font-size="12.5" fill="#9a5b33" text-anchor="middle" font-weight="700">la courbe en U du Module 2</text>
<text x="501.8" y="108" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">les grands réseaux</text>
<text x="363.6" y="292" font-size="11.5" fill="#5b5249">le modèle peut mémoriser</text>
<text x="363.6" y="307" font-size="11.5" fill="#5b5249">tous ses exemples</text>
<text x="365.0" y="346" font-size="12.5" fill="#5b5249" text-anchor="middle">taille du modèle (nombre de paramètres) →</text>
<text x="58" y="203.0" font-size="12.5" fill="#5b5249" text-anchor="middle" transform="rotate(-90 58 203.0)">erreur sur des exemples nouveaux</text>
</svg>
