<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le XOR avant et après la couche cachée</title>
<desc>Deux panneaux. À gauche, le plan des entrées A et B : les deux cas « faux », en bleu, sont aux coins (0, 0) et (1, 1) ; les deux cas « vrai », en rouge, aux coins (0, 1) et (1, 0). Deux droites parallèles, une par neurone caché, délimitent une bande qui contient les deux points rouges. À droite, l'espace de la couche cachée, avec la réponse du neurone 1 à l'horizontale et celle du neurone 2 à la verticale : les deux cas rouges sont au même point (1, 0), les cas bleus en (0, 0) et (1, 1), et une seule droite sépare le rouge du bleu.</desc>
<defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
<rect x="0" y="0" width="700" height="430" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="350.0" y="36" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">La couche cachée change le point de vue</text>
<rect x="30" y="58" width="300" height="312" rx="10" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.2"/>
<text x="180.0" y="82" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="700">Dans le plan des entrées</text>
<text x="180.0" y="100" font-size="12" fill="#5b5249" text-anchor="middle">deux droites délimitent une bande</text>
<line x1="108" y1="322.0" x2="108" y2="112.0" stroke="#e8dfc9" stroke-width="1"/>
<line x1="78.0" y1="292" x2="288.0" y2="292" stroke="#e8dfc9" stroke-width="1"/>
<text x="108" y="338.0" font-size="11.5" fill="#7a6f63" text-anchor="middle">0</text>
<text x="70.0" y="296" font-size="11.5" fill="#7a6f63" text-anchor="end">0</text>
<line x1="258" y1="322.0" x2="258" y2="112.0" stroke="#e8dfc9" stroke-width="1"/>
<line x1="78.0" y1="142" x2="288.0" y2="142" stroke="#e8dfc9" stroke-width="1"/>
<text x="258" y="338.0" font-size="11.5" fill="#7a6f63" text-anchor="middle">1</text>
<text x="70.0" y="146" font-size="11.5" fill="#7a6f63" text-anchor="end">1</text>
<text x="183.0" y="354.0" font-size="12" fill="#5b5249" text-anchor="middle">entrée A</text>
<text x="52" y="217.0" font-size="12" fill="#5b5249" text-anchor="middle" transform="rotate(-90 52 217.0)">entrée B</text>
<polygon points="78.0,187.0 213.0,322.0 288.0,322.0 288.0,247.0 153.0,112.0 78.0,112.0" fill="#c4564a" fill-opacity="0.10"/>
<line x1="213.0" y1="322.0" x2="78.0" y2="187.0" stroke="#2f6f6a" stroke-width="2.6"/>
<line x1="288.0" y1="247.0" x2="153.0" y2="112.0" stroke="#2f6f6a" stroke-width="2.6"/>
<text x="111.0" y="262.0" font-size="11.5" fill="#2f6f6a" font-weight="700" text-anchor="start" transform="rotate(45 111.0 262.0)">neurone 1</text>
<text x="213.0" y="139.0" font-size="11.5" fill="#2f6f6a" font-weight="700" text-anchor="start" transform="rotate(45 213.0 139.0)">neurone 2</text>
<circle cx="108.0" cy="292.0" r="9" fill="#3a6ea5" stroke="#fbf7ee" stroke-width="2"/>
<circle cx="258.0" cy="142.0" r="9" fill="#3a6ea5" stroke="#fbf7ee" stroke-width="2"/>
<circle cx="108.0" cy="142.0" r="9" fill="#c4564a" stroke="#fbf7ee" stroke-width="2"/>
<circle cx="258.0" cy="292.0" r="9" fill="#c4564a" stroke="#fbf7ee" stroke-width="2"/>
<rect x="370" y="58" width="300" height="312" rx="10" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.2"/>
<text x="520.0" y="82" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="700">Dans l'espace de la couche cachée</text>
<text x="520.0" y="100" font-size="12" fill="#5b5249" text-anchor="middle">une seule droite suffit</text>
<line x1="448" y1="322.0" x2="448" y2="112.0" stroke="#e8dfc9" stroke-width="1"/>
<line x1="418.0" y1="292" x2="628.0" y2="292" stroke="#e8dfc9" stroke-width="1"/>
<text x="448" y="338.0" font-size="11.5" fill="#7a6f63" text-anchor="middle">0</text>
<text x="410.0" y="296" font-size="11.5" fill="#7a6f63" text-anchor="end">0</text>
<line x1="598" y1="322.0" x2="598" y2="112.0" stroke="#e8dfc9" stroke-width="1"/>
<line x1="418.0" y1="142" x2="628.0" y2="142" stroke="#e8dfc9" stroke-width="1"/>
<text x="598" y="338.0" font-size="11.5" fill="#7a6f63" text-anchor="middle">1</text>
<text x="410.0" y="146" font-size="11.5" fill="#7a6f63" text-anchor="end">1</text>
<text x="523.0" y="354.0" font-size="12" fill="#5b5249" text-anchor="middle">neurone 1 : au moins une ?</text>
<text x="392" y="217.0" font-size="12" fill="#5b5249" text-anchor="middle" transform="rotate(-90 392 217.0)">neurone 2 : les deux ?</text>
<polygon points="523.0,292 628.0,187.0 628.0,322.0 493.0,322.0" fill="#c4564a" fill-opacity="0.10"/>
<line x1="493.0" y1="322.0" x2="628.0" y2="187.0" stroke="#9a5b33" stroke-width="2.6"/>
<text x="526.0" y="268.0" font-size="11.5" fill="#9a5b33" font-weight="700" text-anchor="start" transform="rotate(-45 526.0 268.0)">neurone de sortie</text>
<circle cx="448.0" cy="292.0" r="9" fill="#3a6ea5" stroke="#fbf7ee" stroke-width="2"/>
<circle cx="598.0" cy="142.0" r="9" fill="#3a6ea5" stroke="#fbf7ee" stroke-width="2"/>
<circle cx="591.0" cy="287.0" r="9" fill="#c4564a" stroke="#fbf7ee" stroke-width="2"/>
<circle cx="605.0" cy="297.0" r="9" fill="#c4564a" stroke="#fbf7ee" stroke-width="2"/>
<text x="593.5" y="319" font-size="11.5" fill="#c4564a" font-weight="700" text-anchor="middle">les deux cas « vrai »</text>
<circle cx="230" cy="398" r="7" fill="#c4564a"/><text x="244" y="402" font-size="12.5" fill="#5b5249">XOR vrai (1)</text>
<circle cx="380" cy="398" r="7" fill="#3a6ea5"/><text x="394" y="402" font-size="12.5" fill="#5b5249">XOR faux (0)</text>
</svg>
