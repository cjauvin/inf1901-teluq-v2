<text x="350" y="62" font-size="12.5" fill="#5b5249" text-anchor="middle" font-weight="700">deuxième couche</text>
<text x="350" y="78" font-size="12" fill="#7a6f63" text-anchor="middle">des formes</text>
<text x="580" y="62" font-size="12.5" fill="#5b5249" text-anchor="middle" font-weight="700">troisième couche</text>
<text x="580" y="78" font-size="12" fill="#7a6f63" text-anchor="middle">des chiffres</text>
<text x="350.0" y="414" font-size="12.5" fill="#7a6f63" text-anchor="middle">Schéma simplifié : le réseau trouve lui-même ses caractéristiques pendant l'entraînement.</text>
</svg>
