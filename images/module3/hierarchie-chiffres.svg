<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Une hiérarchie de caractéristiques</title>
<desc>Trois colonnes reliées par des traits. À gauche, la première couche détecte des traits simples : horizontal, vertical, oblique, arcs de cercle. Au centre, la deuxième couche les combine en formes : une boucle, une barre verticale, un angle. À droite, la troisième couche combine les formes en chiffres : le 8 est fait de deux boucles, le 9 d'une boucle au-dessus d'une barre.</desc>
<rect x="0" y="0" width="700" height="430" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="350.0" y="36" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">De couche en couche, des caractéristiques plus complexes</text>
