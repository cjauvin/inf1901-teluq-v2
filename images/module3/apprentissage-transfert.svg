<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>L'apprentissage par transfert</title>
<desc>Deux rangées. En haut, un réseau pré-entraîné sur ImageNet : quatre couches en bleu, puis une dernière couche en gris qui répond « chien, voiture, chat… ». En bas, le même réseau ajusté pour une nouvelle tâche : les quatre couches bleues sont conservées, et la dernière couche est remplacée par une nouvelle, en rouge, qui répond « lésion bénigne ou mélanome ».</desc>
<defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
<rect x="0" y="0" width="700" height="420" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="350.0" y="34" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Réutiliser un réseau déjà entraîné</text>
<text x="40" y="78" font-size="13" fill="#3a3531" font-weight="700">1. Pré-entraîné sur ImageNet (des millions d'images)</text>
<rect x="40" y="98" width="70" height="64" rx="6" fill="#fbf7ee" stroke="#b8a888"/>
<text x="75" y="134" font-size="11.5" fill="#5b5249" text-anchor="middle">photo</text>
<line x1="112" y1="130" x2="128" y2="130" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<rect x="130" y="90" width="44" height="80" rx="6" fill="#3a6ea5" fill-opacity="0.18" stroke="#3a6ea5" stroke-width="2"/>
<line x1="176" y1="130" x2="192" y2="130" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<rect x="194" y="90" width="44" height="80" rx="6" fill="#3a6ea5" fill-opacity="0.18" stroke="#3a6ea5" stroke-width="2"/>
<line x1="240" y1="130" x2="256" y2="130" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<rect x="258" y="90" width="44" height="80" rx="6" fill="#3a6ea5" fill-opacity="0.18" stroke="#3a6ea5" stroke-width="2"/>
<line x1="304" y1="130" x2="320" y2="130" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<rect x="322" y="90" width="44" height="80" rx="6" fill="#3a6ea5" fill-opacity="0.18" stroke="#3a6ea5" stroke-width="2"/>
<line x1="368" y1="130" x2="384" y2="130" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<rect x="386" y="90" width="44" height="80" rx="6" fill="#7a6f63" fill-opacity="0.2" stroke="#7a6f63" stroke-width="2.4"/>
<line x1="432" y1="130" x2="458" y2="130" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<text x="466" y="124" font-size="12" fill="#3a3531">chien, voiture,</text>
<text x="466" y="140" font-size="12" fill="#3a3531">chat… (1 000 classes)</text>
<text x="40" y="283" font-size="13" fill="#3a3531" font-weight="700">2. Ajusté pour une nouvelle tâche (quelques milliers d'images)</text>
<rect x="40" y="303" width="70" height="64" rx="6" fill="#fbf7ee" stroke="#b8a888"/>
<text x="75" y="339" font-size="11.5" fill="#5b5249" text-anchor="middle">lésion</text>
<line x1="112" y1="335" x2="128" y2="335" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<rect x="130" y="295" width="44" height="80" rx="6" fill="#3a6ea5" fill-opacity="0.18" stroke="#3a6ea5" stroke-width="2"/>
<line x1="176" y1="335" x2="192" y2="335" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<rect x="194" y="295" width="44" height="80" rx="6" fill="#3a6ea5" fill-opacity="0.18" stroke="#3a6ea5" stroke-width="2"/>
<line x1="240" y1="335" x2="256" y2="335" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<rect x="258" y="295" width="44" height="80" rx="6" fill="#3a6ea5" fill-opacity="0.18" stroke="#3a6ea5" stroke-width="2"/>
<line x1="304" y1="335" x2="320" y2="335" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<rect x="322" y="295" width="44" height="80" rx="6" fill="#3a6ea5" fill-opacity="0.18" stroke="#3a6ea5" stroke-width="2"/>
<line x1="368" y1="335" x2="384" y2="335" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<rect x="386" y="295" width="44" height="80" rx="6" fill="#c4564a" fill-opacity="0.2" stroke="#c4564a" stroke-width="2.4"/>
<text x="408" y="393" font-size="11" fill="#c4564a" text-anchor="middle" font-weight="700">nouvelle couche</text>
<line x1="432" y1="335" x2="458" y2="335" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<text x="466" y="329" font-size="12" fill="#3a3531">lésion bénigne</text>
<text x="466" y="345" font-size="12" fill="#3a3531">ou mélanome</text>
<path d="M130 178 v10 h236 v-10" fill="none" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="248" y="208" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">couches conservées : traits, textures, formes</text>
<text x="350.0" y="404" font-size="12.5" fill="#7a6f63" text-anchor="middle">Seule la fin du réseau est remplacée ; le début, qui sait déjà « voir », est réutilisé.</text>
</svg>
