<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Un réseau récurrent, avec sa boucle puis déroulé</title>
<desc>Deux panneaux. À gauche, une cellule reçoit un élément de la séquence par en dessous, et son état sort par la droite pour revenir dans la cellule par une boucle. À droite, la même cellule déroulée sur cinq étapes : chaque copie reçoit un élément de la séquence, de x1 à x5, et passe son état à la copie suivante. Les cinq copies ont les mêmes poids.</desc>
