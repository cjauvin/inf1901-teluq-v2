<text x="112" y="182" font-size="11" fill="#2f6f6a" text-anchor="middle" font-weight="700">cellule</text>
<rect x="79.0" y="248" width="66" height="28" rx="6" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="1.8"/>
<text x="112" y="267" font-size="12" fill="#3a6ea5" text-anchor="middle" font-weight="700">élément</text>
<line x1="112" y1="246" x2="112" y2="205" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<path d="M139 178 C187 178 182 108 112 108 C42 108 37 178 83 178" fill="none" stroke="#c4564a" stroke-width="2.4" marker-end="url(#pointe-rouge)"/>
