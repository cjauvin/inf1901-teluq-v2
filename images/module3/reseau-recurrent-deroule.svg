<line x1="620" y1="246" x2="620" y2="205" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="647" y1="178" x2="668" y2="178" stroke="#c4564a" stroke-width="2.4" marker-end="url(#pointe-rouge)"/>
<text x="456.0" y="126" font-size="12" fill="#2f6f6a" text-anchor="middle">la même cellule, avec les mêmes poids, à chaque étape</text>
<text x="350.0" y="318" font-size="12.5" fill="#7a6f63" text-anchor="middle">L'état transmet à chaque étape un résumé de ce qui a été lu.</text>
</svg>
