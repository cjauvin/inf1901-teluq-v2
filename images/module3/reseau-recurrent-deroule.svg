<rect x="0" y="0" width="700" height="330" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="350.0" y="36" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Un réseau récurrent, replié puis déroulé</text>
<rect x="22" y="58" width="180" height="240" rx="10" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.2"/>
<text x="112.0" y="84" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="700">avec sa boucle</text>
