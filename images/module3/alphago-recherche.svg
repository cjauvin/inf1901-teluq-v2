<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le fonctionnement d'AlphaGo</title>
<desc>Un arbre de coups qui part de la position actuelle, en haut. Le réseau de politique désigne trois coups prometteurs, dont les branches sont explorées ; les autres coups possibles, en pointillé, sont laissés de côté. Au bout des branches explorées, le réseau de valeur estime la probabilité de gagner de chaque position. AlphaGo joue le coup dont les positions sont les mieux évaluées.</desc>
