<text x="210" y="530" font-size="10.5" fill="#5b5249" text-anchor="middle" font-style="italic">embeddings</text>
<circle cx="210" cy="474" r="10" fill="#fbf7ee" stroke="#7a6f63" stroke-width="1.4"/>
