<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le Transformer de 2017</title>
<desc>Le schéma du Transformer de l'article de 2017, en deux colonnes. À gauche, l'encodeur : la phrase d'origine est transformée en plongements, auxquels on ajoute un encodage de la position ; puis un bloc, répété N fois, formé d'une attention multi-têtes et d'un réseau à propagation avant, chacun suivi d'une étape « ajouter et normaliser » qui reçoit aussi, par un raccourci, l'entrée de l'étape. À droite, le décodeur : la traduction déjà écrite passe par les mêmes plongements et le même encodage de position ; son bloc, répété N fois, contient une attention multi-têtes masquée, une attention croisée qui reçoit la sortie de l'encodeur, et un réseau à propagation avant, chacun suivi d'« ajouter et normaliser ». En haut du décodeur, une couche linéaire et un softmax donnent la probabilité de chaque mot suivant.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
