<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Un neurone biologique et un neurone artificiel</title>
<desc>En haut, un neurone biologique : des dendrites ramifiées à gauche, un corps cellulaire au centre, un long axone vers la droite, terminé par des ramifications. En bas, un neurone artificiel : des entrées et leurs poids à gauche, la somme et la fonction d'activation au centre, la sortie à droite. Les mêmes couleurs relient les éléments qui se correspondent : dendrites et entrées, synapses et poids, corps cellulaire et calcul, axone et sortie.</desc>
<defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
