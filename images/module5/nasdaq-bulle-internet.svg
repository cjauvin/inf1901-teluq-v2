<polyline points="90.0,285.9 124.8,272.3 159.5,261.4 194.3,248.6 220.4,251.8 229.0,220.5 246.4,197.3 257.9,185.0 263.8,135.0 270.4,90.5 275.3,151.8 281.2,140.0 287.1,153.2 298.6,207.7 308.0,236.4 316.0,221.8 323.6,255.5 333.3,231.4 350.7,253.6 360.1,269.4 368.1,259.1 402.9,229.1 437.6,221.1 472.4,219.8 507.1,210.2 536.0,190.0 559.3,215.9 582.6,262.3 611.4,216.8 646.2,199.5 681.0,201.6 715.7,182.7 750.5,130.0 785.2,104.5 796.0,90.2 820.0,92.3" fill="none" stroke="#3a6ea5" stroke-width="2.4" stroke-linejoin="round"/>
