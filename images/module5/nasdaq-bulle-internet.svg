<text x="82" y="233.1" font-size="10.5" fill="#5b5249" text-anchor="end">2 000</text>
<line x1="90" y1="183.6" x2="820" y2="183.6" stroke="#b8a888" stroke-width="0.6"/>
<text x="82" y="187.6" font-size="10.5" fill="#5b5249" text-anchor="end">3 000</text>
<line x1="90" y1="138.2" x2="820" y2="138.2" stroke="#b8a888" stroke-width="0.6"/>
<text x="82" y="142.2" font-size="10.5" fill="#5b5249" text-anchor="end">4 000</text>
<line x1="90" y1="92.7" x2="820" y2="92.7" stroke="#b8a888" stroke-width="0.6"/>
<text x="82" y="96.7" font-size="10.5" fill="#5b5249" text-anchor="end">5 000</text>
<text x="90.0" y="338" font-size="10.5" fill="#5b5249" text-anchor="middle">1995</text>
<line x1="90.0" y1="320" x2="90.0" y2="325" stroke="#b8a888"/>
