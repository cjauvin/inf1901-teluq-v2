<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La bulle Internet : l'indice Nasdaq de 1995 à 2016</title>
<desc>Courbe de l'indice boursier Nasdaq de 1995 à 2016. L'indice passe d'environ 750 points en 1995 à un sommet de 5 048 points le 10 mars 2000, puis s'effondre jusqu'à 1 114 points le 9 octobre 2002, une baisse de 78 %. Il remonte lentement, rechute pendant la crise financière de 2008, et ne retrouve son sommet de 2000 qu'en avril 2015, quinze ans plus tard.</desc>
<rect x="0" y="0" width="860" height="380" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="430.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">La bulle Internet : l'indice Nasdaq de 1995 à 2016</text>
<rect x="20" y="48" width="820" height="312" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
