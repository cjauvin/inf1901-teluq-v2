<line x1="194.3" y1="320" x2="194.3" y2="325" stroke="#b8a888"/>
<text x="298.6" y="338" font-size="10.5" fill="#5b5249" text-anchor="middle">2001</text>
<line x1="298.6" y1="320" x2="298.6" y2="325" stroke="#b8a888"/>
<text x="402.9" y="338" font-size="10.5" fill="#5b5249" text-anchor="middle">2004</text>
<line x1="402.9" y1="320" x2="402.9" y2="325" stroke="#b8a888"/>
<text x="507.1" y="338" font-size="10.5" fill="#5b5249" text-anchor="middle">2007</text>
<line x1="507.1" y1="320" x2="507.1" y2="325" stroke="#b8a888"/>
