<text x="260.4" y="102.5" font-size="10.5" fill="#c4564a" text-anchor="end">5 048 points</text>
<text x="370.1" y="273.4" font-size="11" fill="#c4564a" font-weight="700">9 octobre 2002 : 1 114 points (−78 %)</text>
<text x="788.0" y="78.2" font-size="11" fill="#2f6f6a" text-anchor="end" font-weight="700">avril 2015 : le sommet est retrouvé</text>
<text x="315.3" y="310" font-size="10.5" fill="#c4564a" text-anchor="middle" font-style="italic">l'éclatement</text>
<text x="562.8" y="288.3" font-size="10.5" fill="#5b5249" text-anchor="middle" font-style="italic">la crise de 2008</text>
<text x="820" y="352" font-size="9.5" fill="#7a6f63" text-anchor="end" font-style="italic">valeurs approximatives</text>
