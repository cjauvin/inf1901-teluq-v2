<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La chambre chinoise, et un modèle de langage</title>
<desc>Deux panneaux. À gauche, la chambre chinoise imaginée par John Searle en 1980 : une personne enfermée dans une pièce, qui ne connaît pas le chinois, reçoit par une fente des questions écrites en caractères chinois. Elle consulte un gros livre de règles, écrit dans sa langue, qui lui dit quels caractères renvoyer selon ceux qu'elle reçoit, et glisse sa réponse par une autre fente. De l'extérieur, les réponses sont parfaites ; à l'intérieur, personne ne comprend le chinois. À droite, le même schéma pour un modèle de langage : des jetons entrent, d'autres sortent, et entre les deux il n'y a que des milliards de nombres, les poids du modèle. Personne n'a écrit ces règles : elles ont été apprises.</desc>
