<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Quel effet cela fait-il d'être une chauve-souris ?</title>
<desc>Deux panneaux. À gauche, ce que l'on peut décrire : une chauve-souris émet des cris très aigus, représentés par des arcs, qui rebondissent sur un papillon de nuit ; elle écoute leurs échos, représentés par des arcs en pointillé qui reviennent vers elle, et en déduit la position de sa proie. À droite, ce qui échappe à la description : une personne imagine, dans une bulle de pensée, ce que vit la chauve-souris, mais la bulle ne contient qu'un point d'interrogation.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
<rect x="0" y="0" width="840" height="330" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="420.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Quel effet cela fait-il d'être une chauve-souris ?</text>
<rect x="20" y="50" width="520" height="260" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="280" y="76" font-size="12.5" fill="#3a6ea5" text-anchor="middle" font-weight="700">Ce que l'on peut décrire : l'écholocation</text>
