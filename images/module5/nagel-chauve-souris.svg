<circle cx="697.3" cy="120.5" r="0.5" fill="#fbf7ee"/>
<text x="752" y="136" font-size="30" fill="#c4564a" text-anchor="middle" font-weight="700">?</text>
<text x="688" y="270" font-size="11.5" fill="#3a3531" text-anchor="middle">Ce que cela fait de la vivre,</text>
<text x="688" y="288" font-size="11.5" fill="#3a3531" text-anchor="middle">de l'intérieur, reste hors de portée.</text>
