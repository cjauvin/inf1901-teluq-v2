<text x="262" y="106" font-size="11" fill="#3a6ea5" text-anchor="middle" font-weight="700">des cris très aigus</text>
<text x="395" y="228" font-size="11" fill="#2f6f6a" text-anchor="middle" font-weight="700">leurs échos</text>
<text x="450" y="128" font-size="10.5" fill="#9a5b33" text-anchor="middle">une proie</text>
<text x="280" y="270" font-size="11.5" fill="#3a3531" text-anchor="middle">On peut décrire ce mécanisme en détail,</text>
<text x="280" y="288" font-size="11.5" fill="#3a3531" text-anchor="middle">mesurer chaque cri et chaque écho.</text>
