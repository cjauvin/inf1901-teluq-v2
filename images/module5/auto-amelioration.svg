<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 404" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>L'auto-amélioration récursive</title>
<desc>Deux panneaux. À gauche, une boucle à trois étapes : un modèle d'IA fait de la recherche en IA ; il en sort un modèle plus capable ; ce nouveau modèle recommence, et ainsi de suite. À droite, un graphique qualitatif des capacités en fonction du temps, avec une ligne pointillée pour le niveau humain et trois courbes possibles : l'explosion, qui monte presque à la verticale (Good, Yudkowsky) ; une croissance progressive, qui accélère sans rupture (Christiano) ; un plafond, où la courbe s'aplatit (Chollet). Personne ne sait laquelle décrira l'avenir.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f6a"/></marker></defs>
<rect x="0" y="0" width="860" height="404" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="430.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">L'auto-amélioration récursive</text>
<rect x="20" y="50" width="360" height="336" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="200" y="76" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">La boucle</text>
<rect x="148.0" y="105.0" width="104" height="30" rx="6" fill="#ffffff" stroke="#2f6f6a" stroke-width="1.6"/>
<text x="200.0" y="124.0" font-size="11.5" fill="#3a3531" text-anchor="middle" font-weight="700">un modèle</text>
<rect x="217.7" y="236.0" width="124" height="44" rx="6" fill="#ffffff" stroke="#2f6f6a" stroke-width="1.6"/>
<text x="279.7" y="254.5" font-size="11.5" fill="#3a3531" text-anchor="middle">il fait de la</text>
<text x="279.7" y="269.5" font-size="11.5" fill="#3a3531" text-anchor="middle">recherche en IA</text>
<rect x="68.3" y="236.0" width="104" height="44" rx="6" fill="#ffffff" stroke="#2f6f6a" stroke-width="1.6"/>
<text x="120.3" y="254.5" font-size="11.5" fill="#3a3531" text-anchor="middle">un modèle</text>
<text x="120.3" y="269.5" font-size="11.5" fill="#3a3531" text-anchor="middle">plus capable</text>
<path d="M248.8 134.0 A92 92 0 0 1 291.9 208.8" fill="none" stroke="#2f6f6a" stroke-width="2" marker-end="url(#t)"/>
<path d="M243.2 293.2 A92 92 0 0 1 156.8 293.2" fill="none" stroke="#2f6f6a" stroke-width="2" marker-end="url(#t)"/>
<path d="M108.1 208.8 A92 92 0 0 1 151.2 134.0" fill="none" stroke="#2f6f6a" stroke-width="2" marker-end="url(#t)"/>
<text x="200" y="210" font-size="11" fill="#5b5249" text-anchor="middle" font-style="italic">et ainsi</text>
<text x="200" y="225" font-size="11" fill="#5b5249" text-anchor="middle" font-style="italic">de suite</text>
<text x="200" y="350" font-size="11.5" fill="#3a3531" text-anchor="middle">À chaque tour, le chercheur</text>
<text x="200" y="368" font-size="11.5" fill="#3a3531" text-anchor="middle">est un peu plus capable.</text>
<rect x="396" y="50" width="444" height="336" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="618" y="76" font-size="12.5" fill="#3a6ea5" text-anchor="middle" font-weight="700">À quelle vitesse tourne-t-elle ?</text>
<line x1="444" y1="322" x2="444" y2="92" stroke="#b8a888" stroke-width="1.4" marker-end="url(#p)"/>
<line x1="444" y1="322" x2="788" y2="322" stroke="#b8a888" stroke-width="1.4" marker-end="url(#p)"/>
<text x="780" y="340" font-size="10.5" fill="#5b5249" text-anchor="end">temps</text>
<text x="430" y="211.0" font-size="10.5" fill="#5b5249" text-anchor="middle" transform="rotate(-90 430 211.0)">capacités</text>
