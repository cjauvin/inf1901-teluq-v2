<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>L'hypothèse de la représentation platonicienne</title>
<desc>Trois colonnes. À gauche, le monde, représenté par un chat. Au centre, ses ombres, les seules données que voient les modèles : une photo du chat et une phrase, « Un chat dort au soleil ». À droite, ce qu'en tire chaque modèle, entraîné séparément : un modèle de vision, qui n'a vu que des images, et un modèle de langage, qui n'a lu que des textes. Chacun place six concepts dans son espace de représentation : chat, chien et lion d'un côté, voiture et vélo d'un autre, pomme à part. Les deux nuages sont disposés différemment, mais les voisinages sont les mêmes. Une double flèche entre eux demande si ces voisinages sont semblables.</desc>
