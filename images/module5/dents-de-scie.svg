<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Une intelligence en dents de scie</title>
<desc>Deux panneaux. À gauche, la frontière en dents de scie : six tâches de difficulté comparable pour un humain sont placées sur un même cercle pointillé. La frontière des capacités d'un modèle de langage, une forme hérissée, passe au-delà de certaines tâches, que le modèle réussit (résumer un article, écrire un programme, traduire un texte), et en deçà d'autres, qu'il rate (compter les r de « strawberry », comparer 9,11 et 9,9, la tâche piège de l'étude BCG). À droite, un profil de capacités schématique sur huit tâches : le profil d'un humain est régulier, celui d'un modèle est hérissé, très haut en culture générale, en mathématiques d'olympiade ou en programmation, très bas pour compter les lettres d'un mot ou apprendre d'une seule expérience.</desc>
