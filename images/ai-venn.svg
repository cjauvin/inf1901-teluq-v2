  <title>Diagramme de Venn du cours</title>
  <desc>L'intelligence artificielle englobe l'IA « classique » (module 1) et l'apprentissage automatique (module 2), lui-même contenant les réseaux de neurones et l'apprentissage profond (module 3), puis l'IA générative et ChatGPT (module 4).</desc>
