<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 276" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Un programme qui prend un autre programme en entrée</title>
<desc>Un programme P, montré comme une petite fenêtre de code Python correctement indenté, est donné en entrée à un autre programme H, le détecteur d'arrêt, lui aussi étiqueté « programme H ». À l'intérieur de H, une loupe examine une copie du code de P. En sortie, H tenterait de dire si P s'arrête ou tourne à l'infini. La légende conclut : le programme H ne peut pas exister, il serait impossible d'écrire un tel programme.</desc>

<rect x="0" y="0" width="720" height="276" rx="14" fill="#efe7d3" stroke="#d9cbac"/>

<text x="28" y="34" font-size="15" fill="#5b5249" text-anchor="start">Un programme qui prend un autre programme en entrée</text>

<!-- Programme P : fenêtre de code -->
<rect x="44" y="86" width="150" height="104" rx="8" fill="#fffdf8" stroke="#d4c4a0"/>
<circle cx="56" cy="99" r="2.6" fill="#cbb98f"/>
<circle cx="66" cy="99" r="2.6" fill="#cbb98f"/>
<circle cx="76" cy="99" r="2.6" fill="#cbb98f"/>
<line x1="44" y1="108" x2="194" y2="108" stroke="#eaddc0"/>
<g font-family="ui-monospace, monospace" font-size="11.5">
<text x="56" y="132"><tspan fill="#93462d">def</tspan><tspan fill="#5b5249"> P(x):</tspan></text>
<text x="84" y="150"><tspan fill="#93462d">while</tspan><tspan fill="#5b5249"> x &gt; 0:</tspan></text>
<text x="112" y="168" fill="#5b5249">x = x - 1</text>
</g>
<text x="119" y="210" font-size="11" fill="#4a4030" text-anchor="middle">un programme  P</text>

<!-- Flèche : en entrée -->
<text x="238" y="126" font-size="10" fill="#8a7a5c" text-anchor="middle" font-style="italic">en entrée</text>
<line x1="200" y1="140" x2="268" y2="140" stroke="#c2a878" stroke-width="2"/>
<polygon points="276,140 266,135 266,145" fill="#c2a878"/>

<!-- H : un programme qui lit un programme -->
<rect x="278" y="90" width="192" height="100" rx="12" fill="#fffdf8" stroke="#d4c4a0"/>
<text x="374" y="112" font-size="12.5" fill="#4a4030" text-anchor="middle">H — détecteur d'arrêt</text>
<rect x="296" y="124" width="56" height="50" rx="5" fill="#f7eede" stroke="#c9b78f"/>
<circle cx="303" cy="132" r="1.6" fill="#cbb98f"/>
<circle cx="309" cy="132" r="1.6" fill="#cbb98f"/>
<circle cx="315" cy="132" r="1.6" fill="#cbb98f"/>
<rect x="302" y="142" width="42" height="4" rx="1" fill="#cbb98f"/>
<rect x="308" y="151" width="30" height="4" rx="1" fill="#cbb98f"/>
<rect x="314" y="160" width="26" height="4" rx="1" fill="#cbb98f"/>
<circle cx="350" cy="158" r="13" fill="none" stroke="#7a6a52" stroke-width="2.5"/>
<line x1="359" y1="167" x2="369" y2="177" stroke="#7a6a52" stroke-width="3" stroke-linecap="round"/>
<text x="430" y="150" font-size="11" fill="#8a7a5c" text-anchor="middle">s'arrête ?</text>
<text x="374" y="210" font-size="11" fill="#4a4030" text-anchor="middle">programme  H</text>

<!-- Sorties -->
<text x="505" y="104" font-size="10" fill="#8a7a5c" text-anchor="middle" font-style="italic">sortie</text>
<line x1="470" y1="120" x2="540" y2="120" stroke="#c2a878" stroke-width="2"/>
<polygon points="548,120 540,116 540,124" fill="#c2a878"/>
<text x="556" y="124" font-size="11" fill="#4a4030" text-anchor="start">s'arrête  ■</text>
<line x1="470" y1="164" x2="540" y2="164" stroke="#c2a878" stroke-width="2"/>
<polygon points="548,164 540,160 540,168" fill="#c2a878"/>
<text x="556" y="168" font-size="11" fill="#4a4030" text-anchor="start">ne s'arrête jamais  ∞</text>

<!-- Conclusion -->
<text x="360" y="250" font-size="11.5" fill="#93462d" text-anchor="middle">Le programme H ne peut pas exister : il serait impossible d'écrire un tel programme.</text>
</svg>
