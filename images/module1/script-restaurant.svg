<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le script du restaurant</title>
<desc>La séquence attendue d'un repas au restaurant en sept étapes ; seules « entrer » et « commander » sont dites explicitement, les autres sont déduites — comblées par le script.</desc>
<defs>
<marker id="end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b09c74" stroke-width="1.4"/></marker>
</defs>

<rect x="0" y="0" width="720" height="220" rx="14" fill="#efe7d3" stroke="#d9cbac"/>

<line x1="50" y1="90" x2="690" y2="90" stroke="#b09c74" stroke-width="2" marker-end="url(#end)"/>

<g text-anchor="middle">
<g font-size="13" fill="#fff" font-weight="500">
<rect x="56" y="76" width="28" height="28" rx="6" fill="#c2603f" stroke="#93462d" stroke-width="1.5"/><text x="70" y="95">1</text>
<rect x="356" y="76" width="28" height="28" rx="6" fill="#c2603f" stroke="#93462d" stroke-width="1.5"/><text x="370" y="95">4</text>
</g>
<g font-size="13" fill="#6b5436">
<rect x="156" y="76" width="28" height="28" rx="6" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.4" stroke-dasharray="3 2.5"/><text x="170" y="95">2</text>
<rect x="256" y="76" width="28" height="28" rx="6" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.4" stroke-dasharray="3 2.5"/><text x="270" y="95">3</text>
<rect x="456" y="76" width="28" height="28" rx="6" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.4" stroke-dasharray="3 2.5"/><text x="470" y="95">5</text>
<rect x="556" y="76" width="28" height="28" rx="6" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.4" stroke-dasharray="3 2.5"/><text x="570" y="95">6</text>
<rect x="656" y="76" width="28" height="28" rx="6" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.4" stroke-dasharray="3 2.5"/><text x="670" y="95">7</text>
</g>

<g font-size="13" fill="#4a4030">
<text x="70" y="130">entrer</text>
<text x="170" y="130">s'asseoir</text>
<text x="270" y="126">consulter</text><text x="270" y="142">le menu</text>
<text x="370" y="130">commander</text>
<text x="470" y="130">manger</text>
<text x="570" y="130">payer</text>
<text x="670" y="130">partir</text>
</g>
</g>

<rect x="170" y="178" width="22" height="15" rx="4" fill="#c2603f" stroke="#93462d"/>
<text x="200" y="190" font-size="13" fill="#5b3a2c" text-anchor="start">dit explicitement</text>
<rect x="378" y="178" width="22" height="15" rx="4" fill="#fbf7ee" stroke="#9a5b33" stroke-dasharray="3 2.5"/>
<text x="408" y="190" font-size="13" fill="#6b5436" text-anchor="start">déduit — comblé par le script</text>
</svg>
