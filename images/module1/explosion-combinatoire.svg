<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 336" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>L'explosion combinatoire</title>
<desc>Un arbre de jeu qui s'évase : une position de départ donne environ 30 coups, chacun environ 900, puis environ 27 000, et ainsi de suite. Le nombre total de parties d'échecs possibles est d'environ 10 puissance 120 (le nombre de Shannon), ce qui dépasse de très loin le nombre d'atomes dans l'univers observable, environ 10 puissance 80.</desc>

<rect x="0" y="0" width="680" height="336" rx="14" fill="#efe7d3" stroke="#d9cbac"/>

<text x="28" y="32" font-size="15" fill="#5b5249" text-anchor="start">L'explosion combinatoire</text>
<text x="28" y="52" font-size="11" fill="#8a7a5c" text-anchor="start">Aux échecs : ~30 coups possibles à chaque tour — l'arbre explose.</text>

<!-- arbre qui s'évase -->
<g stroke="#c9b78f" stroke-width="1.5">
<line x1="300" y1="76" x2="200" y2="122"/>
<line x1="300" y1="76" x2="300" y2="122"/>
<line x1="300" y1="76" x2="400" y2="122"/>
<line x1="200" y1="122" x2="170" y2="172"/>
<line x1="200" y1="122" x2="200" y2="172"/>
<line x1="200" y1="122" x2="230" y2="172"/>
<line x1="300" y1="122" x2="270" y2="172"/>
<line x1="300" y1="122" x2="300" y2="172"/>
<line x1="300" y1="122" x2="330" y2="172"/>
<line x1="400" y1="122" x2="370" y2="172"/>
<line x1="400" y1="122" x2="400" y2="172"/>
<line x1="400" y1="122" x2="430" y2="172"/>
</g>

<!-- niveau 4 : wedge d'explosion -->
<polygon points="166,178 434,178 476,226 124,226" fill="#e7d9bd" opacity="0.7"/>
<g stroke="#d0bf98" stroke-width="1">
<line x1="170" y1="178" x2="132" y2="224"/>
<line x1="230" y1="178" x2="200" y2="224"/>
<line x1="300" y1="178" x2="300" y2="224"/>
<line x1="370" y1="178" x2="400" y2="224"/>
<line x1="430" y1="178" x2="468" y2="224"/>
</g>

<circle cx="300" cy="76" r="8" fill="#fffdf8" stroke="#d4c4a0"/>
<circle cx="200" cy="122" r="6" fill="#fffdf8" stroke="#d4c4a0"/>
<circle cx="300" cy="122" r="6" fill="#fffdf8" stroke="#d4c4a0"/>
<circle cx="400" cy="122" r="6" fill="#fffdf8" stroke="#d4c4a0"/>
<g fill="#fffdf8" stroke="#d4c4a0">
<circle cx="170" cy="172" r="4"/>
<circle cx="200" cy="172" r="4"/>
<circle cx="230" cy="172" r="4"/>
<circle cx="270" cy="172" r="4"/>
<circle cx="300" cy="172" r="4"/>
<circle cx="330" cy="172" r="4"/>
<circle cx="370" cy="172" r="4"/>
<circle cx="400" cy="172" r="4"/>
<circle cx="430" cy="172" r="4"/>
</g>

<!-- étiquettes de niveau -->
<g font-size="11" fill="#8a7a5c" text-anchor="start">
<text x="500" y="80">1 position</text>
<text x="500" y="126">≈ 30</text>
<text x="500" y="176">≈ 900</text>
<text x="500" y="220">≈ 27 000…</text>
</g>

<!-- comparaison -->
<rect x="40" y="256" width="600" height="66" rx="10" fill="#f7eede" stroke="#c9b78f"/>
<text x="340" y="282" font-size="12.5" fill="#4a4030" text-anchor="middle">Toutes les parties d'échecs possibles ≈ 10¹²⁰ <tspan fill="#8a7a5c">(nombre de Shannon)</tspan></text>
<text x="340" y="306" font-size="12.5" fill="#93462d" text-anchor="middle">≫  atomes dans l'univers observable ≈ 10⁸⁰</text>
</svg>
