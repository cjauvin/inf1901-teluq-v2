<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Réseau sémantique</title>
<desc>Trois concepts reliés par des liens « est-un » — animal, oiseau, canari — chacun portant ses propriétés, qui s'héritent en remontant la hiérarchie.</desc>
<defs>
<marker id="arrUp" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 9 L5 1 L9 9" fill="none" stroke="#2f6f6a" stroke-width="1.6"/></marker>
<marker id="arrProp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9a5b33" stroke-width="1.4"/></marker>
</defs>

<rect x="0" y="0" width="660" height="440" rx="14" fill="#efe7d3" stroke="#d9cbac"/>

<line x1="200" y1="330" x2="200" y2="236" stroke="#2f6f6a" stroke-width="2" marker-end="url(#arrUp)"/>
<line x1="200" y1="190" x2="200" y2="96" stroke="#2f6f6a" stroke-width="2" marker-end="url(#arrUp)"/>
<text x="212" y="288" fill="#2f6f6a" font-size="14">est-un</text>
<text x="212" y="148" fill="#2f6f6a" font-size="14">est-un</text>

<line x1="260" y1="72" x2="383" y2="72" stroke="#9a5b33" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrProp)"/>
<line x1="260" y1="212" x2="383" y2="184" stroke="#9a5b33" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrProp)"/>
<line x1="260" y1="212" x2="383" y2="240" stroke="#9a5b33" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrProp)"/>
<line x1="260" y1="352" x2="383" y2="330" stroke="#9a5b33" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrProp)"/>
<line x1="260" y1="352" x2="383" y2="386" stroke="#9a5b33" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrProp)"/>

<g font-size="17" fill="#3a3531" font-weight="500" text-anchor="middle">
<rect x="140" y="50" width="120" height="44" rx="8" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.5"/><text x="200" y="78">animal</text>
<rect x="140" y="190" width="120" height="44" rx="8" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.5"/><text x="200" y="218">oiseau</text>
<rect x="140" y="330" width="120" height="44" rx="8" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.5"/><text x="200" y="358">canari</text>
</g>

<g font-size="14" fill="#5b5249" text-anchor="middle">
<rect x="385" y="55" width="130" height="34" rx="6" fill="#fffdf8" stroke="#d4c4a0"/><text x="450" y="76">respire</text>
<rect x="385" y="167" width="130" height="34" rx="6" fill="#fffdf8" stroke="#d4c4a0"/><text x="450" y="188">a des ailes</text>
<rect x="385" y="223" width="130" height="34" rx="6" fill="#fffdf8" stroke="#d4c4a0"/><text x="450" y="244">peut voler</text>
<rect x="385" y="313" width="130" height="34" rx="6" fill="#fffdf8" stroke="#d4c4a0"/><text x="450" y="334">est jaune</text>
<rect x="385" y="369" width="130" height="34" rx="6" fill="#fffdf8" stroke="#d4c4a0"/><text x="450" y="390">chante</text>
</g>

<line x1="150" y1="423" x2="184" y2="423" stroke="#2f6f6a" stroke-width="2"/>
<text x="192" y="427" font-size="13" fill="#5b5249">est-un (catégorie)</text>
<line x1="360" y1="423" x2="394" y2="423" stroke="#9a5b33" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="402" y="427" font-size="13" fill="#5b5249">propriété</text>
</svg>
