<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Diagramme de Venn du cours — Module 1</title>
  <desc>L'intelligence artificielle englobe l'IA « classique » (le sujet du module 1) et l'apprentissage automatique, lui-même contenant les méthodes d'AA diverses, les réseaux de neurones et l'apprentissage profond, puis l'IA générative et ChatGPT. Seul le repère du module 1 est indiqué.</desc>
  <defs>
    <marker id="lead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2f6f6a" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="720" rx="16" fill="#efe7d3" stroke="#d9cbac"/>
  <ellipse cx="500" cy="384" rx="480" ry="324" fill="#fbf7ee" stroke="#3a3531" stroke-width="2.4"/>
  <ellipse cx="648" cy="410" rx="318" ry="250" fill="#ffffff" fill-opacity="0.5" stroke="#3a3531" stroke-width="2"/>
  <ellipse cx="208" cy="410" rx="112" ry="178" fill="#4f7fa8" fill-opacity="0.16" stroke="#3a5c78" stroke-width="2"/>
  <ellipse cx="460.394" cy="429.692" rx="81.412" ry="165.452" fill="#5f9a73" fill-opacity="0.20" stroke="#4a7d5c" stroke-width="2"/>
  <ellipse cx="740" cy="440" rx="192" ry="188" fill="#c07a5b" fill-opacity="0.11" stroke="#9a5b43" stroke-width="2"/>
  <ellipse cx="748" cy="470" rx="150" ry="150" fill="#c07a5b" fill-opacity="0.14" stroke="#9a5b43" stroke-width="2"/>
  <ellipse cx="756" cy="502" rx="100" ry="100" fill="#c79a52" fill-opacity="0.26" stroke="#a07a2e" stroke-width="2"/>
  <ellipse cx="762" cy="540" rx="58" ry="50" fill="#c79a52" fill-opacity="0.42" stroke="#a07a2e" stroke-width="2"/>
  <text x="500.125" y="120.125" font-size="26" font-weight="600" letter-spacing="0.3" text-anchor="middle" fill="#3a3531">Intelligence artificielle (IA)</text>
  <text x="208.125" y="416.125" font-size="20" font-weight="600" fill="#34516a" text-anchor="middle">IA « classique »</text>
  <text x="648.123" y="221.485" font-size="19" font-weight="600" fill="#2f6f6a" text-anchor="middle">Apprentissage automatique (AA)</text>
  <text x="649.229" y="244.243" font-size="15" fill="#5b5249" text-anchor="middle">(machine learning)</text>
  <text x="459.878" y="421.224" font-size="15" font-weight="600" fill="#3f6f52" text-anchor="middle">Méthodes d'AA</text>
  <text x="463.427" y="443.694" font-size="15" font-weight="600" fill="#3f6f52" text-anchor="middle">diverses</text>
  <text x="740.125" y="300.125" font-size="16" font-weight="600" fill="#8a4f38" text-anchor="middle">Réseaux de neurones</text>
  <text x="750.127" y="371.487" font-size="15" font-weight="600" fill="#8a4f38" text-anchor="middle">Apprentissage profond</text>
  <text x="748.125" y="388.125" font-size="12" fill="#7a5238" text-anchor="middle">(deep learning)</text>
  <text x="757.501" y="452.881" font-size="16" font-weight="600" fill="#8a6420" text-anchor="middle">IA générative</text>
  <text x="762.125" y="544.125" font-size="16" font-weight="700" fill="#6f4f14" text-anchor="middle">ChatGPT</text>
  <text x="86.054" y="143.641" text-anchor="start" fill="#2f6f6a" font-size="17" font-weight="700">Module 1</text>
