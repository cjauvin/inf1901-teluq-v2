<text x="408" y="326" font-size="12" fill="#c4564a" text-anchor="middle" font-style="italic">« ce n'est</text>
<text x="408" y="342" font-size="12" fill="#c4564a" text-anchor="middle" font-style="italic">qu'un jeu »</text>
<line x1="564" y1="226" x2="564" y2="200" stroke-width="6" fill="none" stroke="#2f6f6a" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
<path d="M537 150 L537 200 L591 200 L591 150" stroke-width="4.5" fill="none" stroke="#2f6f6a" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
<ellipse cx="564" cy="227" rx="12" ry="3" fill="#2f6f6a" opacity="0.35"/>
<text x="564" y="250" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="700">2022</text>
<text x="564" y="272" font-size="12.5" fill="#3a3531" text-anchor="middle">converser en</text>
<text x="564" y="288" font-size="12.5" fill="#3a3531" text-anchor="middle">langage courant</text>
<circle cx="564" cy="174" r="10" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="2"/>
