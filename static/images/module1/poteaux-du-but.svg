<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 780 402" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Déplacer les poteaux du but</title>
<desc>Une ligne du temps avec quatre paires de poteaux de but, en forme de fourche. 1997 : battre le champion du monde d'échecs, suivi de la réaction « ce n'est que du calcul ». 2012 : reconnaître des images, « ce n'est que de la statistique ». 2016 : battre le champion du monde de go, « ce n'est qu'un jeu ». 2022 : converser en langage courant, « ce n'est que de la prédiction de mots ». Après chaque succès, une flèche en pointillé déplace le but vers la droite ; un cinquième but, en pointillé, porte un point d'interrogation.</desc>
<defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a5b33"/></marker></defs>
<rect x="0" y="0" width="780" height="402" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="390.0" y="38" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Déplacer les poteaux du but (<tspan font-style="italic">moving the goalposts</tspan>)</text>
<text x="390.0" y="60" font-size="12.5" fill="#5b5249" text-anchor="middle">À chaque succès, la tâche réussie cesse de compter comme de l'intelligence, et le but recule.</text>
<line x1="30" y1="226" x2="750" y2="226" stroke="#b8a888" stroke-width="2"/>
<path d="M104 138 Q174.0 94 242 136" fill="none" stroke="#9a5b33" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pointe)"/>
<path d="M260 138 Q330.0 94 398 136" fill="none" stroke="#9a5b33" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pointe)"/>
<path d="M416 138 Q486.0 94 554 136" fill="none" stroke="#9a5b33" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pointe)"/>
<path d="M572 138 Q635.0 94 696 136" fill="none" stroke="#9a5b33" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pointe)"/>
<line x1="96" y1="226" x2="96" y2="200" stroke-width="6" fill="none" stroke="#2f6f6a" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
<path d="M69 150 L69 200 L123 200 L123 150" stroke-width="4.5" fill="none" stroke="#2f6f6a" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
<ellipse cx="96" cy="227" rx="12" ry="3" fill="#2f6f6a" opacity="0.35"/>
<text x="96" y="250" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="700">1997</text>
<text x="96" y="272" font-size="12.5" fill="#3a3531" text-anchor="middle">battre le champion</text>
<text x="96" y="288" font-size="12.5" fill="#3a3531" text-anchor="middle">du monde d'échecs</text>
<circle cx="96" cy="174" r="10" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="2"/>
<path d="M91.5 174 l3.3 3.8 l6.5 -7.5" fill="none" stroke="#2f6f6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="96" y="326" font-size="12" fill="#c4564a" text-anchor="middle" font-style="italic">« ce n'est que</text>
<text x="96" y="342" font-size="12" fill="#c4564a" text-anchor="middle" font-style="italic">du calcul »</text>
<line x1="252" y1="226" x2="252" y2="200" stroke-width="6" fill="none" stroke="#2f6f6a" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
