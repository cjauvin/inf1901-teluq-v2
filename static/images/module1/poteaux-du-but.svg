<text x="564" y="326" font-size="12" fill="#c4564a" text-anchor="middle" font-style="italic">« ce n'est que de la</text>
<text x="564" y="342" font-size="12" fill="#c4564a" text-anchor="middle" font-style="italic">prédiction de mots »</text>
<line x1="706" y1="226" x2="706" y2="200" stroke-width="6" fill="none" stroke="#7a6f63" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" stroke-dasharray="5 4"/>
<path d="M679 150 L679 200 L733 200 L733 150" stroke-width="4.5" fill="none" stroke="#7a6f63" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" stroke-dasharray="5 4"/>
<ellipse cx="706" cy="227" rx="12" ry="3" fill="#7a6f63" opacity="0.27999999999999997"/>
<text x="706" y="182" font-size="22" fill="#7a6f63" text-anchor="middle" font-weight="700">?</text>
<text x="706" y="250" font-size="12.5" fill="#7a6f63" text-anchor="middle">le prochain but</text>
<text x="390.0" y="382" font-size="12.5" fill="#5b5249" text-anchor="middle">En rouge : la réaction typique après chaque succès (des formules courantes, pas des citations).</text>
</svg>
