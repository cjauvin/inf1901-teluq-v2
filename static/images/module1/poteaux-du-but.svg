<ellipse cx="252" cy="227" rx="12" ry="3" fill="#2f6f6a" opacity="0.35"/>
<text x="252" y="250" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="700">2012</text>
<text x="252" y="272" font-size="12.5" fill="#3a3531" text-anchor="middle">reconnaître</text>
<text x="252" y="288" font-size="12.5" fill="#3a3531" text-anchor="middle">des images</text>
<circle cx="252" cy="174" r="10" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="2"/>
<path d="M247.5 174 l3.3 3.8 l6.5 -7.5" fill="none" stroke="#2f6f6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="252" y="326" font-size="12" fill="#c4564a" text-anchor="middle" font-style="italic">« ce n'est que</text>
<text x="252" y="342" font-size="12" fill="#c4564a" text-anchor="middle" font-style="italic">de la statistique »</text>
<line x1="408" y1="226" x2="408" y2="200" stroke-width="6" fill="none" stroke="#2f6f6a" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
