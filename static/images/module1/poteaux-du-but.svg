<text x="408" y="250" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="700">2016</text>
<text x="408" y="272" font-size="12.5" fill="#3a3531" text-anchor="middle">battre le champion</text>
<text x="408" y="288" font-size="12.5" fill="#3a3531" text-anchor="middle">du monde de go</text>
