<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Quatre architectures, les mêmes pièces</title>
<desc>Quatre petits réseaux, dessinés avec les mêmes neurones, les données montant du bas vers le haut. Perceptron multicouche : trois couches, chaque neurone relié à tous ceux de la couche précédente. Réseau convolutif : chaque neurone n'est relié qu'à trois voisins de la couche précédente, avec les trois mêmes poids, marqués de trois couleurs qui se répètent partout : un même filtre, réutilisé partout. Réseau récurrent : la même couche, déroulée sur les mots « le », « chat », « dort », chaque étape transmettant sa mémoire à la suivante par les mêmes poids. Transformer : pour les mêmes trois mots, chaque mot consulte tous les autres, avec des poids d'attention plus ou moins forts, puis un petit réseau est appliqué à chaque mot.</desc>
