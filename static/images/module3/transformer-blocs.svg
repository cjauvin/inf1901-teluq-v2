<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Un bloc de Transformer, et une pile de blocs</title>
<desc>Deux panneaux. À gauche, un bloc : les mots entrent par le bas, passent par une couche d'auto-attention, où chaque mot regarde les autres, puis par un petit réseau appliqué à chaque mot, et ressortent enrichis par le haut. À droite, une pile de six blocs identiques : les mots entrent en bas et ressortent en haut, enrichis de leur contexte.</desc>
