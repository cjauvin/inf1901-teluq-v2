<text x="66" y="270" font-size="11.5" fill="#7a6f63" text-anchor="middle">−6</text>
<text x="306" y="270" font-size="11.5" fill="#7a6f63" text-anchor="middle">6</text>
<text x="186.0" y="286" font-size="12" fill="#5b5249" text-anchor="middle">entrée du neurone</text>
