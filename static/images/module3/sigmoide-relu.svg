<text x="350.0" y="36" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Deux fonctions d'activation</text>
<rect x="22" y="58" width="320" height="240" rx="10" fill="#fbf7ee" stroke="#b8a888" stroke-width="1.2"/>
