<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Deux fonctions d'activation : la sigmoïde et la ReLU</title>
<desc>Deux graphiques. À gauche, la sigmoïde : une courbe en S, qui plafonne à 0 pour les entrées très négatives et à 1 pour les entrées très positives. À droite, la ReLU : elle vaut 0 pour toute entrée négative, puis monte en ligne droite pour les entrées positives, sans plafond.</desc>
