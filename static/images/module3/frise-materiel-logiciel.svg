<text x="483.2" y="64" font-size="13" fill="#c4564a" text-anchor="middle" font-weight="700">2012</text>
<text x="483.2" y="79" font-size="12" fill="#3a3531" text-anchor="middle">AlexNet</text>
<text x="40" y="98" font-size="13" fill="#9a5b33" font-weight="700">Le matériel</text>
