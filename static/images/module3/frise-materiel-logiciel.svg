<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le matériel et le logiciel de l'apprentissage profond, de 1970 à 2016</title>
<desc>Une frise chronologique à deux rangées. En haut, le matériel : fondation de Nvidia en 1993, GeForce 256 en 1999, CUDA en 2007, un réseau entraîné 70 fois plus vite sur GPU en 2009, premières machines conçues pour l'apprentissage profond en 2016. En bas, le logiciel : la méthode de Linnainmaa en 1970, Torch en 2002, Theano en 2007, Caffe en 2013, TensorFlow et Keras en 2015, PyTorch en 2016. Au centre, en 2012, AlexNet, où les deux histoires se rejoignent.</desc>
