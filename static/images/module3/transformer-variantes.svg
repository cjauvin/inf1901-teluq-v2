<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 780 352" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Trois façons d'assembler le Transformer</title>
<desc>Trois silhouettes simplifiées du Transformer de 2017. Première : encodeur et décodeur, les deux colonnes, reliées par l'attention croisée ; c'est le Transformer de 2017 et T5, pour traduire et résumer. Deuxième : encodeur seul, le décodeur est grisé ; l'encodeur donne un vecteur par mot ; c'est BERT, pour comprendre et classer. Troisième : décodeur seul, l'encodeur et l'attention croisée sont grisés ; le décodeur donne le mot suivant ; c'est GPT et les grands modèles de langue, pour générer du texte.</desc>
