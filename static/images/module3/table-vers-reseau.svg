<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La table du Module 2 remplacée par un réseau</title>
<desc>Deux panneaux. À gauche, une grille de quatre cases sur cinq, avec une valeur écrite dans chaque case, comme la table du Module 2. À droite, un écran de jeu, avec un mur de briques, une balle et une raquette, est donné à un réseau de neurones ; le réseau produit une valeur pour chacune des trois actions possibles : aller à gauche, rester, aller à droite.</desc>
