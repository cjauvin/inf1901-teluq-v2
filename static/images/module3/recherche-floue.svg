<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 542" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Recherche exacte et recherche floue</title>
<desc>Deux panneaux, avec les mêmes colonnes : requête, clés, poids, valeurs, résultat. Les clés sont quatre entrées d'un dictionnaire, chameau, chat, château et chien, et les valeurs leurs définitions. En haut, une recherche exacte : la requête « chat » correspond exactement à la clé « chat », qui reçoit tout le poids ; le résultat est sa définition, « petit félin ». En bas, une recherche floue, comme l'attention : la requête « chaton » n'est pas dans le dictionnaire ; elle est comparée à toutes les clés, qui reçoivent des poids de 12 % pour chameau, 60 % pour chat, 8 % pour château et 20 % pour chien ; le résultat est un mélange des quatre définitions dans ces proportions, surtout celle de chat.</desc>
