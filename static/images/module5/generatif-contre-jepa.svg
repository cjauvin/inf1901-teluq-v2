<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Modèle génératif contre JEPA</title>
<desc>Deux panneaux. À gauche, un modèle génératif reçoit une image, une balle près d'un arbre, et doit prédire l'image suivante pixel par pixel. Comme il ne peut pas savoir où iront la balle et chaque feuille, il produit une image floue, comparée pixel par pixel à la vraie image suivante. À droite, un JEPA : un encodeur transforme chaque image en une représentation abstraite, une courte rangée de nombres ; un prédicteur prédit la représentation de l'image suivante à partir de celle de l'image actuelle, et la comparaison se fait entre représentations. Le modèle n'a pas à prédire les détails imprévisibles.</desc>
