<rect x="112" y="194" width="14" height="14" fill="#8c8c8a"/><rect x="96" y="208" width="46" height="5" rx="2" fill="#8c8c8a"/>
<rect x="209.0" y="186" width="98" height="18" rx="2" fill="#bdbdbb" stroke="#4a4a48" stroke-width="1.2"/>
<text x="258" y="199" font-size="10" fill="#4a4a48" text-anchor="middle">physique</text>
<rect x="204.0" y="166" width="108" height="18" rx="2" fill="#d2d2d0" stroke="#4a4a48" stroke-width="1.2"/>
<text x="258" y="179" font-size="10" fill="#4a4a48" text-anchor="middle">neurologie</text>
<rect x="212.0" y="146" width="92" height="18" rx="2" fill="#bdbdbb" stroke="#4a4a48" stroke-width="1.2"/>
<text x="258" y="159" font-size="10" fill="#4a4a48" text-anchor="middle">optique</text>
