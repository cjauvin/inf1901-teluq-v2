<path d="M332 214 Q332 186 352 186 Q372 186 372 214" fill="#f2f2f0" stroke="#4a4a48" stroke-width="2"/>
<text x="202" y="270" font-size="11.5" fill="#4a4a48" text-anchor="middle">Mary sait tout ce que la science</text>
<text x="202" y="288" font-size="11.5" fill="#4a4a48" text-anchor="middle">dit de la vision des couleurs.</text>
