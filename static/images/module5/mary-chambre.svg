<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La chambre de Mary (Jackson, 1982)</title>
<desc>Deux panneaux. À gauche, tout en gris : Mary, une scientifique, dans une pièce en noir et blanc, devant un écran qui affiche le spectre de la lumière, avec la longueur d'onde du rouge, 700 nanomètres, et une pile de livres d'optique, de neurologie et de physique : elle sait tout ce que la science dit de la vision des couleurs. Une flèche indique qu'elle sort. À droite, en couleurs : Mary voit pour la première fois une tomate mûre, d'un rouge vif. La question posée : apprend-elle quelque chose de nouveau ?</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
