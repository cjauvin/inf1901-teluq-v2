<path d="M708 214 Q708 186 728 186 Q748 186 748 214" fill="#fbf7ee" stroke="#3a3531" stroke-width="2"/>
<text x="754" y="152" font-size="26" fill="#c4564a" text-anchor="middle" font-weight="700">!</text>
<text x="637" y="270" font-size="11.5" fill="#c4564a" text-anchor="middle" font-weight="700">Apprend-elle quelque chose de nouveau ?</text>
<text x="637" y="288" font-size="11.5" fill="#3a3531" text-anchor="middle">Si oui, le savoir physique ne dit pas tout.</text>
</svg>
