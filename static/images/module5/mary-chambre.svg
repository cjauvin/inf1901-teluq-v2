<text x="202" y="76" font-size="12.5" fill="#4a4a48" text-anchor="middle" font-weight="700">Dans sa pièce en noir et blanc</text>
<rect x="44" y="98" width="150" height="96" rx="5" fill="#ffffff" stroke="#4a4a48" stroke-width="1.6"/>
