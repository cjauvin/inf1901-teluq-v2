<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Les qualia : ce que cela fait de voir du rouge</title>
<desc>Deux panneaux séparés par un point d'interrogation. À gauche, ce que la science décrit quand on voit du rouge : une onde lumineuse de 700 nanomètres entre dans l'œil, active certains cônes de la rétine, qui envoient des influx nerveux jusqu'au cortex visuel. Tout cela se mesure de l'extérieur. À droite, ce que l'on vit : une tache rouge, le rouge tel qu'on le voit, accessible seulement de l'intérieur. Entre les deux, le fossé explicatif : rien, dans la chaîne physique, ne dit pourquoi elle s'accompagne de cette expérience.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker><radialGradient id="rouge" cx="0.42" cy="0.4" r="0.65"><stop offset="0" stop-color="#ea7a6c"/><stop offset="0.6" stop-color="#c4564a"/><stop offset="1" stop-color="#a5392f"/></radialGradient></defs>
<rect x="0" y="0" width="840" height="330" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="420.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Les qualia : ce que cela fait de voir du rouge</text>
<rect x="20" y="50" width="470" height="260" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="255" y="76" font-size="12.5" fill="#3a6ea5" text-anchor="middle" font-weight="700">Ce que la science décrit</text>
