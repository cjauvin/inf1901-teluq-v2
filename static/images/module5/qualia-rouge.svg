<text x="85" y="205" font-size="11" fill="#3a3531" text-anchor="middle" font-weight="700">la lumière</text>
<text x="85" y="220" font-size="10.5" fill="#5b5249" text-anchor="middle">700 nm</text>
<line x1="138" y1="160" x2="160" y2="160" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<path d="M166 160 Q192 136 218 160 Q192 184 166 160 Z" fill="#ffffff" stroke="#3a3531" stroke-width="1.8"/>
<circle cx="192" cy="160" r="9" fill="#3a6ea5"/><circle cx="192" cy="160" r="4" fill="#3a3531"/>
<text x="192" y="205" font-size="11" fill="#3a3531" text-anchor="middle" font-weight="700">l'œil</text>
<text x="192" y="220" font-size="10.5" fill="#5b5249" text-anchor="middle">des cônes s'activent</text>
<line x1="224" y1="160" x2="246" y2="160" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<polyline points="252,160 263,160 266,136 269,168 272,160 281,160 284,136 287,168 290,160 293,160 296,136 299,168 302,160 315,160 318,136 321,168 324,160 329,160 332,136 335,168 338,160 350,160" fill="none" stroke="#2f6f6a" stroke-width="1.8" stroke-linejoin="round"/>
<text x="301" y="205" font-size="11" fill="#3a3531" text-anchor="middle" font-weight="700">des influx</text>
<text x="301" y="220" font-size="10.5" fill="#5b5249" text-anchor="middle">nerveux</text>
<line x1="356" y1="160" x2="378" y2="160" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<path d="M389 168 Q385 134 417 132 Q431 122 451 136 Q467 146 461 166 Q459 182 437 180 Q421 188 407 180 Q391 182 389 168 Z" fill="#fbf7ee" stroke="#3a3531" stroke-width="1.8"/>
<path d="M403 154 Q415 142 425 154 Q435 166 447 152 M409 170 Q425 162 439 170" fill="none" stroke="#5b5249" stroke-width="1.3"/>
<text x="425" y="205" font-size="11" fill="#3a3531" text-anchor="middle" font-weight="700">le cerveau</text>
<text x="425" y="220" font-size="10.5" fill="#5b5249" text-anchor="middle">cortex visuel</text>
<text x="255" y="270" font-size="11.5" fill="#3a3531" text-anchor="middle">Tout cela se mesure,</text>
<text x="255" y="288" font-size="11.5" fill="#3a3531" text-anchor="middle">de l'extérieur.</text>
<line x1="496" y1="130" x2="560" y2="130" stroke="#7a6f63" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#p)"/>
<text x="528" y="168" font-size="34" fill="#c4564a" text-anchor="middle" font-weight="700">?</text>
<text x="528" y="196" font-size="10.5" fill="#c4564a" text-anchor="middle" font-weight="700">le fossé</text>
<text x="528" y="210" font-size="10.5" fill="#c4564a" text-anchor="middle" font-weight="700">explicatif</text>
<rect x="566" y="50" width="254" height="260" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="693" y="76" font-size="12.5" fill="#c4564a" text-anchor="middle" font-weight="700">Ce que l'on vit</text>
<circle cx="693" cy="156" r="54" fill="url(#rouge)"/>
<text x="693" y="236" font-size="11" fill="#3a3531" text-anchor="middle" font-weight="700" font-style="italic">le rouge, tel qu'on le voit</text>
<text x="693" y="270" font-size="11.5" fill="#3a3531" text-anchor="middle">Une expérience vécue,</text>
<text x="693" y="288" font-size="11.5" fill="#3a3531" text-anchor="middle">accessible de l'intérieur seulement.</text>
</svg>
