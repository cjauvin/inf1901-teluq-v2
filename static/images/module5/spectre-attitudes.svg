<text x="367.5" y="431.3" font-size="10" fill="#5b5249" text-anchor="start">Narayanan, Kapoor</text>
<circle cx="447.5" cy="298.4" r="6" fill="#3a6ea5" stroke="#ffffff" stroke-width="1.5"/>
<text x="457.5" y="297.4" font-size="11.5" fill="#3a6ea5" text-anchor="start" font-weight="700">l'usage pragmatique</text>
<text x="457.5" y="310.4" font-size="10" fill="#5b5249" text-anchor="start">la plupart des gens</text>
<circle cx="470.0" cy="134.6" r="6" fill="#3a6ea5" stroke="#ffffff" stroke-width="1.5"/>
<text x="480.0" y="133.6" font-size="11.5" fill="#3a6ea5" text-anchor="start" font-weight="700">la construction prudente</text>
<text x="480.0" y="146.6" font-size="10" fill="#5b5249" text-anchor="start">Anthropic</text>
<circle cx="500.0" cy="212.6" r="6" fill="#3a6ea5" stroke="#ffffff" stroke-width="1.5"/>
<text x="510.0" y="211.6" font-size="11.5" fill="#3a6ea5" text-anchor="start" font-weight="700">le souci des IA</text>
<text x="510.0" y="224.6" font-size="10" fill="#5b5249" text-anchor="start">bien-être des modèles</text>
<circle cx="507.5" cy="450.5" r="6" fill="#3a6ea5" stroke="#ffffff" stroke-width="1.5"/>
<text x="517.5" y="449.5" font-size="11.5" fill="#3a6ea5" text-anchor="start" font-weight="700">le scepticisme</text>
<text x="517.5" y="462.5" font-size="10" fill="#5b5249" text-anchor="start">Marcus</text>
<circle cx="590.0" cy="321.8" r="6" fill="#c4564a" stroke="#ffffff" stroke-width="1.5"/>
<text x="600.0" y="320.8" font-size="11.5" fill="#c4564a" text-anchor="start" font-weight="700">les voix spirituelles</text>
<text x="600.0" y="333.8" font-size="10" fill="#5b5249" text-anchor="start">Léon XIV</text>
<circle cx="605.0" cy="423.2" r="6" fill="#c4564a" stroke="#ffffff" stroke-width="1.5"/>
<text x="615.0" y="422.2" font-size="11.5" fill="#c4564a" text-anchor="start" font-weight="700">la critique des torts présents</text>
<text x="615.0" y="435.2" font-size="10" fill="#5b5249" text-anchor="start">Gebru, Bender</text>
<circle cx="695.0" cy="165.8" r="6" fill="#c4564a" stroke="#ffffff" stroke-width="1.5"/>
<text x="685.0" y="164.8" font-size="11.5" fill="#c4564a" text-anchor="end" font-weight="700">l'alarme réformiste</text>
<text x="685.0" y="177.8" font-size="10" fill="#5b5249" text-anchor="end">Hinton, Bengio</text>
<circle cx="785.0" cy="353.0" r="6" fill="#c4564a" stroke="#ffffff" stroke-width="1.5"/>
<text x="775.0" y="352.0" font-size="11.5" fill="#c4564a" text-anchor="end" font-weight="700">la protection et le refus</text>
<text x="775.0" y="365.0" font-size="10" fill="#5b5249" text-anchor="end">syndicats, néo-luddites</text>
<circle cx="837.5" cy="95.6" r="6" fill="#c4564a" stroke="#ffffff" stroke-width="1.5"/>
<text x="827.5" y="94.6" font-size="11.5" fill="#c4564a" text-anchor="end" font-weight="700">l'abolition</text>
<text x="827.5" y="107.6" font-size="10" fill="#5b5249" text-anchor="end">Yudkowsky, PauseAI</text>
<text x="860" y="532" font-size="9.5" fill="#7a6f63" text-anchor="end" font-style="italic">positions schématiques</text>
</svg>
