<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 750 474" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>L'apprentissage contrastif</title>
<desc>Un schéma. Quatre images, à gauche, passent par un encodeur d'images ; quatre légendes, en haut, passent par un encodeur de textes. Chaque image et chaque légende devient un vecteur. Une grille de quatre sur quatre compare chaque image à chaque légende. Les quatre cases de la diagonale, qui associent chaque image à sa propre légende, sont marquées « rapprocher » ; les douze autres cases sont marquées « éloigner ».</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
<rect x="0" y="0" width="750" height="474" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="375.0" y="30" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Rapprocher les bonnes paires, éloigner toutes les autres</text>
