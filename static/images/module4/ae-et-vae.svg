<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 614" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Autoencodeur et autoencodeur variationnel</title>
<desc>Deux rangées, chacune en forme de sablier. En haut, l'autoencodeur ordinaire : un 7 manuscrit de 784 nombres entre dans l'encodeur, qui le réduit à un code de deux nombres seulement ; le décodeur reconstruit à partir de ces deux nombres une image de 784 nombres. Sous le code, une petite carte montre ces deux nombres comme un point de l'espace latent. L'erreur de reconstruction compare l'entrée et la sortie. En bas, l'autoencodeur variationnel : l'encodeur donne deux paires de nombres, le centre et la taille d'une zone floue ; deux nombres sont tirés au hasard dans cette zone, et le décodeur reconstruit le 7 à partir d'eux. Sur la petite carte, la zone est une tache en forme de cloche, avec le point tiré, et une pénalité la ramène vers le centre de la carte. Les éléments propres à l'autoencodeur variationnel sont en rouge.</desc>
