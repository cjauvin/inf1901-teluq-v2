<rect x="325" y="373" width="14" height="14" rx="2" fill="#2f6f6a" opacity="0.85"/>
<text x="290" y="408" font-size="10" fill="#5b5249" text-anchor="middle">des morceaux d'image,</text>
<text x="290" y="421" font-size="10" fill="#5b5249" text-anchor="middle">comme des mots</text>
<line x1="346" y1="364" x2="384" y2="364" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="388" y="334" width="136" height="60" rx="10" fill="#efe7d3" stroke="#2f6f6a" stroke-width="2"/>
<text x="456" y="360" font-size="12" fill="#3a3531" text-anchor="middle" font-weight="700">modèle</text>
<text x="456" y="376" font-size="12" fill="#3a3531" text-anchor="middle" font-weight="700">de langage</text>
<line x1="528" y1="364" x2="566" y2="364" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="570" y="310" width="240" height="108" rx="8" fill="#efe7d3" stroke="#b8a888"/>
<text x="582" y="332" font-size="11.5" fill="#3a3531" font-family="Courier New, Courier, monospace">« Au serveur : Un verre</text>
<text x="582" y="348" font-size="11.5" fill="#3a3531" font-family="Courier New, Courier, monospace">d'eau, s'il vous plaît. »</text>
