<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Les trois temps du grokking</title>
<desc>Un graphique de l'entraînement, en époques, de 0 à 16 000. La précision sur les exemples d'entraînement monte à 100 % avant 1 400 époques : c'est la mémorisation. La précision sur les exemples nouveaux reste presque nulle jusqu'à environ 9 400 époques, puis monte d'un coup jusqu'à 100 % avant 14 000 époques. Entre les deux, une courbe pointillée montre la part du calcul confiée au circuit des horloges : elle grandit régulièrement pendant la formation du circuit, bien avant le saut. Trois bandes marquent les trois temps : mémorisation, formation du circuit, nettoyage.</desc>
<defs><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3a6ea5"/></marker><marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f6a"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c4564a"/></marker></defs>
