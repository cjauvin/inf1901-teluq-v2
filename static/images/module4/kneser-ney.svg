<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le lissage de Kneser-Ney</title>
<desc>En haut, deux panneaux. À gauche, le mot « Francisco », vu 1 000 fois dans le corpus, mais toujours après le même mot, « San » : une seule flèche épaisse y mène. À droite, le mot « lunettes », vu 300 fois seulement, mais après 120 mots différents, comme mes, des, ses, les, nouvelles ou vos : une gerbe de flèches fines y mène. En bas, un contexte jamais vu, « Je ne vois rien sans mes », et deux façons d'estimer le mot suivant. Selon la fréquence, « Francisco » l'emporte sur « lunettes », ce qui est absurde. Selon la variété des contextes, l'idée de Kneser-Ney, « lunettes » l'emporte nettement.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
<rect x="0" y="0" width="800" height="500" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="400.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Kneser-Ney : compter les contextes, pas seulement les occurrences</text>
<rect x="30" y="54" width="360" height="196" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="100" y="146.0" font-size="12" fill="#3a3531" text-anchor="end" font-style="italic">San</text>
<line x1="108" y1="142.0" x2="240" y2="142.0" stroke="#7a6f63" stroke-width="5" stroke-opacity="0.8" marker-end="url(#p)"/>
<rect x="242" y="125" width="100" height="34" rx="17" fill="#efe7d3" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="292" y="147" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="700" font-style="italic">Francisco</text>
<text x="292" y="180" font-size="11" fill="#3a3531" text-anchor="middle">vu <tspan font-weight="700">1 000</tspan> fois</text>
<text x="292" y="196" font-size="11" fill="#3a3531" text-anchor="middle">après <tspan font-weight="700" fill="#2f6f6a">1 seul mot</tspan></text>
<rect x="410" y="54" width="360" height="196" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="480" y="80.0" font-size="12" fill="#3a3531" text-anchor="end" font-style="italic">mes</text>
<line x1="488" y1="76.0" x2="620" y2="142.0" stroke="#7a6f63" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#p)"/>
<text x="480" y="102.0" font-size="12" fill="#3a3531" text-anchor="end" font-style="italic">des</text>
<line x1="488" y1="98.0" x2="620" y2="142.0" stroke="#7a6f63" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#p)"/>
<text x="480" y="124.0" font-size="12" fill="#3a3531" text-anchor="end" font-style="italic">ses</text>
<line x1="488" y1="120.0" x2="620" y2="142.0" stroke="#7a6f63" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#p)"/>
<text x="480" y="146.0" font-size="12" fill="#3a3531" text-anchor="end" font-style="italic">les</text>
<line x1="488" y1="142.0" x2="620" y2="142.0" stroke="#7a6f63" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#p)"/>
<text x="480" y="168.0" font-size="12" fill="#3a3531" text-anchor="end" font-style="italic">nouvelles</text>
<line x1="488" y1="164.0" x2="620" y2="142.0" stroke="#7a6f63" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#p)"/>
<text x="480" y="190.0" font-size="12" fill="#3a3531" text-anchor="end" font-style="italic">vos</text>
<line x1="488" y1="186.0" x2="620" y2="142.0" stroke="#7a6f63" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#p)"/>
<text x="480" y="212.0" font-size="12" fill="#5b5249" text-anchor="end" font-style="italic">…</text>
<rect x="622" y="125" width="100" height="34" rx="17" fill="#efe7d3" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="672" y="147" font-size="14" fill="#3a3531" text-anchor="middle" font-weight="700" font-style="italic">lunettes</text>
<text x="672" y="180" font-size="11" fill="#3a3531" text-anchor="middle">vu <tspan font-weight="700">300</tspan> fois</text>
<text x="672" y="196" font-size="11" fill="#3a3531" text-anchor="middle">après <tspan font-weight="700" fill="#2f6f6a">120 mots différents</tspan></text>
<rect x="30" y="272" width="740" height="206" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="400.0" y="300" font-size="12" fill="#5b5249" text-anchor="middle">un contexte jamais vu :<tspan dx="8" font-size="14" fill="#3a3531" font-style="italic" font-weight="600">Je ne vois rien sans mes…</tspan></text>
<text x="60" y="338" font-size="12.5" fill="#9a5b33" font-weight="700">Selon la fréquence</text>
<text x="60" y="354" font-size="10.5" fill="#5b5249">combien de fois le mot a été vu</text>
<text x="60" y="387" font-size="12.5" fill="#3a3531" font-style="italic">Francisco</text>
<rect x="142" y="375" width="200.0" height="16" rx="3" fill="#c4564a" fill-opacity="1"/>
<text x="60" y="421" font-size="12.5" fill="#3a3531" font-style="italic">lunettes</text>
<rect x="142" y="409" width="60.0" height="16" rx="3" fill="#2f6f6a" fill-opacity="0.55"/>
<text x="142" y="452" font-size="11.5" fill="#c4564a" font-weight="700">« Francisco » l'emporte, absurde</text>
<text x="430" y="338" font-size="12.5" fill="#9a5b33" font-weight="700">Selon la variété des contextes</text>
<text x="430" y="354" font-size="10.5" fill="#5b5249">après combien de mots différents (Kneser-Ney)</text>
<text x="430" y="387" font-size="12.5" fill="#3a3531" font-style="italic">Francisco</text>
<rect x="512" y="375" width="2.0" height="16" rx="3" fill="#c4564a" fill-opacity="0.55"/>
<text x="430" y="421" font-size="12.5" fill="#3a3531" font-style="italic">lunettes</text>
<rect x="512" y="409" width="200.0" height="16" rx="3" fill="#2f6f6a" fill-opacity="1"/>
<text x="512" y="452" font-size="11.5" fill="#2f6f6a" font-weight="700">« lunettes » l'emporte</text>
</svg>
