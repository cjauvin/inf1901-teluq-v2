<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Démêler une activation</title>
<desc>À gauche, l'activation du modèle sur le mot « Gate », dans la phrase « Nous avons traversé le Golden Gate à vélo » : une colonne de nombres où presque toutes les cases sont actives, chaque neurone mêlant plusieurs concepts. Au milieu, l'autoencodeur clairsemé la récrit comme un choix dans un immense dictionnaire de caractéristiques : une longue rangée de cases presque toutes éteintes, dont trois seulement s'allument, « le pont du Golden Gate », « San Francisco » et « le vélo ». À droite, ces trois caractéristiques, additionnées, reconstruisent presque l'activation de départ. En bas : en amplifiant la caractéristique « le pont du Golden Gate », on obtient le Golden Gate Claude, qui ramène toute conversation au pont.</desc>
