<text x="234.0" y="158.0" font-size="12" fill="#9a5b33" text-anchor="end" font-weight="700">Agrandir le pré-entraînement</text>
<text x="234.0" y="174.0" font-size="10.5" fill="#5b5249" text-anchor="end">le modèle et ses données</text>
