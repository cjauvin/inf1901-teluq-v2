<text x="234.0" y="350.0" font-size="12" fill="#3a6ea5" text-anchor="end" font-weight="700">Réfléchir plus longtemps</text>
<text x="234.0" y="366.0" font-size="10.5" fill="#5b5249" text-anchor="end">le calcul au moment de la réponse</text>
