<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Les trois leviers de l'échelle</title>
<desc>Une frise de 2018 à 2026 avec trois bandes horizontales, dont l'épaisseur indique, de façon schématique, la place de chaque levier dans l'effort des laboratoires. Première bande, agrandir le pré-entraînement, le modèle et ses données : épaisse dès le départ, avec GPT-2 en 2019, les lois d'échelle de Kaplan et GPT-3 en 2020, Chinchilla en 2022 et GPT-4 en 2023 ; à partir de la fin de 2024, la bande est hachurée, les rendements sont discutés, avec GPT-4.5 en février 2025 et GPT-6 Astra en septembre 2026. Deuxième bande, l'apprentissage par renforcement : un mince filet à partir de 2022, celui des préférences humaines, qui s'élargit à partir de o1, en septembre 2024, avec DeepSeek R1, o3 et Grok 4 en 2025. Troisième bande, le calcul au moment de la réponse : absente jusqu'à o1, puis de plus en plus large. Au-dessus, la périodisation d'Ilya Sutskever : l'âge de la recherche jusqu'en 2020, l'âge de l'échelle de 2020 à 2025, puis un retour à la recherche, avec de gros ordinateurs.</desc>
<rect x="0" y="0" width="920" height="470" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="460.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Trois façons de dépenser plus de calcul</text>
<defs><pattern id="hachures" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#9a5b33" fill-opacity="0.35"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9a5b33" stroke-width="3"/></pattern></defs>
<rect x="252.0" y="62" width="138.2" height="24" rx="5" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="321.1" y="78.0" font-size="10.5" fill="#5b5249" text-anchor="middle" font-style="italic">l'âge de la recherche</text>
<rect x="394.2" y="62" width="351.6" height="24" rx="5" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="570.0" y="78.0" font-size="10.5" fill="#5b5249" text-anchor="middle" font-style="italic">l'âge de l'échelle</text>
<rect x="749.8" y="62" width="138.2" height="24" rx="5" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="818.9" y="78.0" font-size="10.5" fill="#5b5249" text-anchor="middle" font-style="italic">retour à la recherche</text>
<text x="234.0" y="78.0" font-size="10.5" fill="#7a6f63" text-anchor="end" font-style="italic">selon Ilya Sutskever (2025)</text>
