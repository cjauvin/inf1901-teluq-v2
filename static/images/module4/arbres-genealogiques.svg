<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Les arbres généalogiques de 1986</title>
<desc>Deux panneaux. À gauche, deux arbres généalogiques de même structure, sur trois générations : une famille anglaise (Christopher et Penelope, Andrew et Christine ; Margaret et Arthur, Victoria et James, Jennifer et Charles ; Colin et Charlotte) et une famille italienne (Roberto et Maria, Pierro et Francesca ; Gina et Emilio, Lucia et Marco, Angela et Tomaso ; Alfonso et Sophia). Le réseau apprend des faits comme « le père de Victoria est Christopher ». À droite, le vecteur de six nombres appris pour quelques personnes : un des nombres distingue les Anglais des Italiens, un autre la génération, un autre la branche de la famille. Personne n'a donné ces caractéristiques au réseau.</desc>
