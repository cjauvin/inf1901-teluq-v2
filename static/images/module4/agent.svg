<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Le principe d'un agent</title>
<desc>À gauche, une tâche donnée par l'utilisateur : trouver trois articles récents sur un sujet et les résumer. Elle entre dans l'agent, dessiné comme un grand cadre. Au centre de l'agent, un grand modèle de langage. Autour de lui, une boucle en trois temps : raisonner, agir, observer. Pour agir, le modèle appelle un outil, à droite : recherche Web, exécution de code, documents et fichiers, courriel et agenda, mémoire. Le résultat de l'outil revient, et le modèle l'observe avant de raisonner de nouveau. En bas de l'agent, le contexte s'allonge à chaque tour : la tâche, un raisonnement, une action, un résultat, un autre raisonnement, et ainsi de suite. Quand le modèle juge la tâche terminée, il sort de la boucle et donne sa réponse finale, à gauche.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f6a"/></marker></defs>
<rect x="0" y="0" width="840" height="470" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="420.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Un agent : un modèle de langage qui agit en boucle, avec des outils</text>
<text x="95" y="132" font-size="11" fill="#7a6f63" text-anchor="middle" font-weight="700">LA TÂCHE</text>
<rect x="20" y="140" width="150" height="78" rx="8" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="95.0" y="183.0" font-size="12" fill="#3a3531" text-anchor="middle" font-weight="700"></text>
<text x="95" y="160" font-size="11.5" fill="#3a3531" text-anchor="middle" font-style="italic">« Trouve trois</text>
<text x="95" y="175" font-size="11.5" fill="#3a3531" text-anchor="middle" font-style="italic">articles récents</text>
<text x="95" y="190" font-size="11.5" fill="#3a3531" text-anchor="middle" font-style="italic">sur ARC et</text>
<text x="95" y="205" font-size="11.5" fill="#3a3531" text-anchor="middle" font-style="italic">résume-les »</text>
<text x="95" y="292" font-size="11" fill="#7a6f63" text-anchor="middle" font-weight="700">LA RÉPONSE</text>
<rect x="20" y="300" width="150" height="50" rx="8" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="95.0" y="322.0" font-size="12" fill="#3a3531" text-anchor="middle" font-weight="700">les trois résumés</text>
<text x="95.0" y="338.0" font-size="11" fill="#5b5249" text-anchor="middle">quand la tâche est finie</text>
<rect x="196" y="58" width="404" height="384" rx="14" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="2.2" stroke-dasharray="7 4"/>
<rect x="212" y="47" width="72" height="22" rx="6" fill="#efe7d3"/>
<text x="248" y="63" font-size="13" fill="#2f6f6a" text-anchor="middle" font-weight="700">l'agent</text>
<path d="M170 179 C 205 179 222 180 232 193" fill="none" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="306" y="180" width="144" height="60" rx="8" fill="#efe7d3" stroke="#2f6f6a" stroke-width="1.6"/>
<text x="378.0" y="207.0" font-size="13" fill="#3a3531" text-anchor="middle" font-weight="700">grand modèle</text>
<text x="378.0" y="223.0" font-size="12" fill="#5b5249" text-anchor="middle">de langage</text>
<rect x="216.0" y="195" width="92" height="30" rx="15" fill="#2f6f6a"/>
<text x="262" y="214.5" font-size="12.5" fill="#fbf7ee" text-anchor="middle" font-weight="700">raisonner</text>
<rect x="445.0" y="113" width="70" height="30" rx="15" fill="#2f6f6a"/>
<text x="480" y="132.5" font-size="12.5" fill="#fbf7ee" text-anchor="middle" font-weight="700">agir</text>
<rect x="437.0" y="277" width="86" height="30" rx="15" fill="#2f6f6a"/>
<text x="480" y="296.5" font-size="12.5" fill="#fbf7ee" text-anchor="middle" font-weight="700">observer</text>
<path d="M262 193 C 262 118 400 128 441 128" fill="none" stroke="#2f6f6a" stroke-width="1.8" marker-end="url(#pt)"/>
<path d="M435 292 C 380 292 262 302 262 229" fill="none" stroke="#2f6f6a" stroke-width="1.8" marker-end="url(#pt)"/>
<text x="378" y="260" font-size="10.5" fill="#5b5249" text-anchor="middle">c'est lui qui raisonne</text>
<text x="378" y="274" font-size="10.5" fill="#5b5249" text-anchor="middle">et choisit l'action</text>
<path d="M216 216 C 182 250 200 325 174 325" fill="none" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<text x="214" y="364" font-size="11" fill="#7a6f63" font-weight="700">LE CONTEXTE, QUI S'ALLONGE À CHAQUE TOUR</text>
<rect x="214" y="372" width="42.5" height="22" rx="5" fill="#3a6ea5"/>
<text x="235.25" y="387" font-size="10.5" fill="#fbf7ee" text-anchor="middle" font-weight="700">tâche</text>
<rect x="261.5" y="372" width="85.19999999999999" height="22" rx="5" fill="#2f6f6a"/>
<text x="304.1" y="387" font-size="10.5" fill="#fbf7ee" text-anchor="middle" font-weight="700">raisonnement</text>
<rect x="351.7" y="372" width="48.599999999999994" height="22" rx="5" fill="#2f6f6a"/>
<text x="376.0" y="387" font-size="10.5" fill="#fbf7ee" text-anchor="middle" font-weight="700">action</text>
<rect x="405.29999999999995" y="372" width="60.8" height="22" rx="5" fill="#9a5b33"/>
<text x="435.69999999999993" y="387" font-size="10.5" fill="#fbf7ee" text-anchor="middle" font-weight="700">résultat</text>
<rect x="471.09999999999997" y="372" width="85.19999999999999" height="22" rx="5" fill="#2f6f6a"/>
<text x="513.6999999999999" y="387" font-size="10.5" fill="#fbf7ee" text-anchor="middle" font-weight="700">raisonnement</text>
<rect x="561.3" y="372" width="18.1" height="22" rx="5" fill="#7a6f63"/>
<text x="570.3499999999999" y="387" font-size="10.5" fill="#fbf7ee" text-anchor="middle" font-weight="700">…</text>
<text x="214" y="416" font-size="10.5" fill="#5b5249">le modèle relit tout ce contexte avant chaque nouvelle étape</text>
<text x="724.0" y="76" font-size="11" fill="#7a6f63" text-anchor="middle" font-weight="700">LES OUTILS</text>
<rect x="628" y="88" width="192" height="40" rx="8" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="724.0" y="112.0" font-size="12" fill="#3a3531" text-anchor="middle">recherche Web</text>
<rect x="628" y="138" width="192" height="40" rx="8" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="724.0" y="162.0" font-size="12" fill="#3a3531" text-anchor="middle">exécution de code</text>
<rect x="628" y="188" width="192" height="40" rx="8" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="724.0" y="212.0" font-size="12" fill="#3a3531" text-anchor="middle">documents et fichiers</text>
<rect x="628" y="238" width="192" height="40" rx="8" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="724.0" y="262.0" font-size="12" fill="#3a3531" text-anchor="middle">courriel, agenda…</text>
<rect x="628" y="288" width="192" height="40" rx="8" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.6"/>
<text x="724.0" y="305.0" font-size="12" fill="#3a3531" text-anchor="middle">mémoire</text>
<text x="724.0" y="321.0" font-size="11" fill="#5b5249" text-anchor="middle">des notes d'une session à l'autre</text>
<line x1="516" y1="128" x2="622" y2="128" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<text x="558.0" y="120" font-size="10.5" fill="#5b5249" text-anchor="middle">appel</text>
<line x1="622" y1="292" x2="524" y2="292" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<text x="562.0" y="284" font-size="10.5" fill="#5b5249" text-anchor="middle">résultat</text>
<line x1="724.0" y1="240" x2="724.0" y2="240" stroke="none"/>
</svg>
