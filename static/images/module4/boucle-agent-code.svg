<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 478" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La boucle d'un agent de programmation</title>
<desc>Une boucle en quatre étapes autour d'une tâche : explorer le projet, avec ls, find, grep et cat ; modifier le code, en remplaçant des lignes précises dans un fichier ; vérifier, en lançant les tests ou la compilation, avec python -m pytest ou make ; lire le résultat, c'est-à-dire les messages d'erreur et le code de sortie, puis revenir à l'exploration. Quand les tests passent, l'agent sort de la boucle : il consulte git diff, résume ce qu'il a fait et, si on le lui permet, enregistre une version avec git commit. Une note rappelle que tout passe par du texte : commandes, résultats et erreurs.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f6a"/></marker><marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
<rect x="0" y="0" width="840" height="478" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="420.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">La boucle d'un agent de programmation : tout passe par du texte</text>
<path d="M356.2 130.9 A150 150 0 0 1 439.1 213.8" fill="none" stroke="#2f6f6a" stroke-width="2.4" marker-end="url(#p)"/>
<path d="M439.1 326.2 A150 150 0 0 1 356.2 409.1" fill="none" stroke="#2f6f6a" stroke-width="2.4" marker-end="url(#p)"/>
<path d="M243.8 409.1 A150 150 0 0 1 160.9 326.2" fill="none" stroke="#2f6f6a" stroke-width="2.4" marker-end="url(#p)"/>
<path d="M160.9 213.8 A150 150 0 0 1 243.8 130.9" fill="none" stroke="#2f6f6a" stroke-width="2.4" marker-end="url(#p)"/>
<circle cx="300" cy="270" r="54" fill="#fbf7ee" stroke="#d9cbac" stroke-width="1.4"/>
<text x="300" y="264" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="700">la tâche</text>
<text x="300" y="281" font-size="10.5" fill="#5b5249" text-anchor="middle" font-style="italic">« les tests</text>
<text x="300" y="295" font-size="10.5" fill="#5b5249" text-anchor="middle" font-style="italic">échouent »</text>
<rect x="216.0" y="65.0" width="168" height="110" rx="9" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="300.0" y="83.0" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">1. explorer</text>
<text x="300.0" y="98.0" font-size="10" fill="#5b5249" text-anchor="middle">où est le problème ?</text>
<rect x="224.0" y="104.0" width="152" height="66" rx="4" fill="#1f2421"/>
<text x="230.0" y="117.0" font-size="10" fill="#e5e7e0" font-family="ui-monospace, Menlo, monospace">$ ls</text>
<text x="230.0" y="133.0" font-size="10" fill="#e5e7e0" font-family="ui-monospace, Menlo, monospace">$ find . -name '*.py'</text>
<text x="230.0" y="149.0" font-size="10" fill="#e5e7e0" font-family="ui-monospace, Menlo, monospace">$ grep -rn "moyenne" .</text>
<text x="230.0" y="165.0" font-size="10" fill="#e5e7e0" font-family="ui-monospace, Menlo, monospace">$ cat notes.py</text>
<rect x="366.0" y="223.0" width="168" height="94" rx="9" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="450.0" y="241.0" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">2. modifier</text>
<text x="450.0" y="256.0" font-size="10" fill="#5b5249" text-anchor="middle">changer quelques lignes</text>
<rect x="374.0" y="262.0" width="152" height="50" rx="4" fill="#1f2421"/>
<text x="380.0" y="275.0" font-size="10" fill="#c9cdc4" font-family="ui-monospace, Menlo, monospace">notes.py, ligne 3 :</text>
<text x="380.0" y="291.0" font-size="10" fill="#c9cdc4" font-family="ui-monospace, Menlo, monospace">+ if not notes:</text>
<text x="380.0" y="307.0" font-size="10" fill="#c9cdc4" font-family="ui-monospace, Menlo, monospace">+     return None</text>
<rect x="216.0" y="381.0" width="168" height="78" rx="9" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="300.0" y="399.0" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">3. vérifier</text>
<text x="300.0" y="414.0" font-size="10" fill="#5b5249" text-anchor="middle">le verdict des tests</text>
<rect x="224.0" y="420.0" width="152" height="34" rx="4" fill="#1f2421"/>
<text x="230.0" y="433.0" font-size="10" fill="#e5e7e0" font-family="ui-monospace, Menlo, monospace">$ python -m pytest</text>
<text x="230.0" y="449.0" font-size="10" fill="#e5e7e0" font-family="ui-monospace, Menlo, monospace">$ make</text>
<rect x="66.0" y="231.0" width="168" height="78" rx="9" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="1.8"/>
<text x="150.0" y="249.0" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">4. lire le résultat</text>
<text x="150.0" y="264.0" font-size="10" fill="#5b5249" text-anchor="middle">erreurs, code de sortie</text>
<rect x="74.0" y="270.0" width="152" height="34" rx="4" fill="#1f2421"/>
<text x="80.0" y="283.0" font-size="10" fill="#c9cdc4" font-family="ui-monospace, Menlo, monospace">FAILED test_notes.py…</text>
<text x="80.0" y="299.0" font-size="10" fill="#c9cdc4" font-family="ui-monospace, Menlo, monospace">code de sortie : 1</text>
<path d="M390 398 C 480 420 500 400 554 400" fill="none" stroke="#7a6f63" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#pg)"/>
<text x="475.0" y="432" font-size="11" fill="#7a6f63" text-anchor="middle" font-weight="700">quand les tests passent</text>
<rect x="560" y="360" width="250" height="96" rx="9" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="1.8"/>
<text x="685" y="380" font-size="12.5" fill="#3a6ea5" text-anchor="middle" font-weight="700">sortir de la boucle</text>
<rect x="570" y="388" width="230" height="38" rx="4" fill="#1f2421"/>
<text x="576" y="402" font-size="10" fill="#e5e7e0" font-family="ui-monospace, Menlo, monospace">$ git diff</text>
<text x="576" y="418" font-size="10" fill="#e5e7e0" font-family="ui-monospace, Menlo, monospace">$ git commit   (si on le lui permet)</text>
<text x="685" y="444" font-size="11" fill="#3a3531" text-anchor="middle">puis résumer ce qui a été fait</text>
<rect x="560" y="96" width="250" height="150" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="574" y="120" font-size="12.5" fill="#9a5b33" font-weight="700">Tout est du texte</text>
<text x="574" y="138" font-size="11.5" fill="#3a3531">les commandes, écrites par le modèle,</text>
<text x="574" y="156" font-size="11.5" fill="#3a3531">et leurs résultats, lus par le modèle.</text>
<text x="574" y="174" font-size="11.5" fill="#3a3531">Chaque outil Unix fait une chose,</text>
<text x="574" y="192" font-size="11.5" fill="#3a3531">lit du texte et en produit.</text>
<text x="574" y="210" font-size="11.5" fill="#3a3531">Un seul outil, « exécuter une</text>
<text x="574" y="228" font-size="11.5" fill="#3a3531">commande », en donne des milliers.</text>
</svg>
