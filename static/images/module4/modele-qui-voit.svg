<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Un modèle de langage qui lit une image</title>
<desc>Un schéma. Une image est découpée en carreaux, qui passent par un encodeur d'images. Une projection transforme chaque vecteur obtenu en un jeton visuel, de même forme que les jetons de mots. Les jetons visuels et les jetons de la question « Combien de personnes traversent ? » forment une seule séquence, que lit le modèle de langage. Le modèle répond par du texte, jeton après jeton.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker></defs>
<rect x="0" y="0" width="700" height="330" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="350.0" y="30" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Des carreaux d'image lus comme des mots</text>
<rect x="24" y="56" width="96" height="96" fill="#b9c7d6" stroke="#b8a888"/>
<line x1="48" y1="56" x2="48" y2="152" stroke="#fff" stroke-width="1.5"/>
<line x1="24" y1="80" x2="120" y2="80" stroke="#fff" stroke-width="1.5"/>
<line x1="72" y1="56" x2="72" y2="152" stroke="#fff" stroke-width="1.5"/>
<line x1="24" y1="104" x2="120" y2="104" stroke="#fff" stroke-width="1.5"/>
<line x1="96" y1="56" x2="96" y2="152" stroke="#fff" stroke-width="1.5"/>
<line x1="24" y1="128" x2="120" y2="128" stroke="#fff" stroke-width="1.5"/>
<text x="72" y="172" font-size="12" fill="#5b5249" text-anchor="middle">une image en carreaux</text>
<line x1="124" y1="104" x2="156" y2="104" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#p)"/>
<rect x="160" y="70" width="110" height="68" rx="10" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="2"/>
<text x="215" y="98" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">encodeur</text>
<text x="215" y="115" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">d'images</text>
<line x1="272" y1="104" x2="300" y2="104" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#p)"/>
<rect x="304" y="78" width="92" height="52" rx="10" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="2"/>
<text x="350" y="109" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">projection</text>
<line x1="350" y1="132" x2="350" y2="190" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#p)"/>
<text x="650" y="184" font-size="12" fill="#5b5249" text-anchor="end">la séquence lue par le modèle de langage</text>
<rect x="60" y="196" width="30" height="30" rx="4" fill="#b9c7d6" stroke="#3a6ea5" stroke-width="1.4"/>
<rect x="94" y="196" width="30" height="30" rx="4" fill="#b9c7d6" stroke="#3a6ea5" stroke-width="1.4"/>
<rect x="128" y="196" width="30" height="30" rx="4" fill="#b9c7d6" stroke="#3a6ea5" stroke-width="1.4"/>
<rect x="162" y="196" width="30" height="30" rx="4" fill="#b9c7d6" stroke="#3a6ea5" stroke-width="1.4"/>
<rect x="196" y="196" width="30" height="30" rx="4" fill="#b9c7d6" stroke="#3a6ea5" stroke-width="1.4"/>
<rect x="230" y="196" width="30" height="30" rx="4" fill="#b9c7d6" stroke="#3a6ea5" stroke-width="1.4"/>
<text x="266" y="216" font-size="13" fill="#7a6f63">…</text>
<rect x="286.0" y="196" width="68.4" height="30" rx="4" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.4"/>
<text x="320.2" y="215" font-size="11.5" fill="#3a3531" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">Combien</text>
<rect x="358.4" y="196" width="39.6" height="30" rx="4" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.4"/>
<text x="378.2" y="215" font-size="11.5" fill="#3a3531" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">·de</text>
<rect x="402.0" y="196" width="90.0" height="30" rx="4" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.4"/>
<text x="447.0" y="215" font-size="11.5" fill="#3a3531" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">·personnes</text>
<rect x="496.0" y="196" width="97.2" height="30" rx="4" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.4"/>
<text x="544.6" y="215" font-size="11.5" fill="#3a3531" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">·traversent</text>
<rect x="597.2" y="196" width="32.4" height="30" rx="4" fill="#fbf7ee" stroke="#9a5b33" stroke-width="1.4"/>
<text x="613.4" y="215" font-size="11.5" fill="#3a3531" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">·?</text>
<text x="160" y="244" font-size="11.5" fill="#3a6ea5" text-anchor="middle">jetons visuels</text>
<text x="480" y="244" font-size="11.5" fill="#9a5b33" text-anchor="middle">jetons de texte</text>
<line x1="350" y1="252" x2="350" y2="268" stroke="#7a6f63" stroke-width="1.8" marker-end="url(#p)"/>
<rect x="200" y="270" width="300" height="40" rx="10" fill="#fbf7ee" stroke="#2f6f6a" stroke-width="2"/>
<text x="350" y="295" font-size="13" fill="#2f6f6a" text-anchor="middle" font-weight="700">modèle de langage → « Sept personnes… »</text>
</svg>
