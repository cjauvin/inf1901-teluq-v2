<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La traduction comme canal bruité</title>
<desc>En haut, le canal bruité : une phrase anglaise, « the house is small », traverse un canal qui la brouille et en sort en français, « la maison est petite ». Seule la phrase française est observée. Au milieu, les mots des deux phrases sont reliés par l'alignement que le modèle apprend sur le Hansard : la et the, maison et house, est et is, petite et small. En bas, la traduction consiste à retrouver la phrase anglaise e qui rend le produit P(e) × P(f | e) le plus grand : P(e), un modèle de langage de l'anglais, juge si la phrase est de l'anglais naturel ; P(f | e), le modèle de traduction, juge si la phrase française en est une traduction plausible.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a6f63"/></marker><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f6a"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a5b33"/></marker></defs>
<rect x="0" y="0" width="760" height="400" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="380.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">La traduction statistique : retrouver la phrase d'origine « brouillée »</text>
<rect x="40" y="64" width="190" height="44" rx="8" fill="#fbf7ee" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="135" y="84" font-size="11" fill="#5b5249" text-anchor="middle">phrase anglaise (cachée)</text>
<text x="135" y="100" font-size="13" fill="#3a6ea5" text-anchor="middle" font-style="italic" font-weight="600">the house is small</text>
<line x1="234" y1="86" x2="282" y2="86" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="286" y="64" width="188" height="44" rx="22" fill="#efe7d3" stroke="#7a6f63" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="380" y="91" font-size="12.5" fill="#3a3531" text-anchor="middle" font-weight="600">canal bruité</text>
<line x1="478" y1="86" x2="526" y2="86" stroke="#7a6f63" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="530" y="64" width="190" height="44" rx="8" fill="#fbf7ee" stroke="#c4564a" stroke-width="1.6"/>
<text x="625" y="84" font-size="11" fill="#5b5249" text-anchor="middle">phrase française (observée)</text>
<text x="625" y="100" font-size="13" fill="#c4564a" text-anchor="middle" font-style="italic" font-weight="600">la maison est petite</text>
<text x="40" y="166" font-size="11.5" fill="#3a6ea5" font-weight="700">anglais</text>
<text x="40" y="234" font-size="11.5" fill="#c4564a" font-weight="700">français</text>
<text x="220" y="166" font-size="14" fill="#3a6ea5" text-anchor="middle" font-style="italic">the</text>
<text x="220" y="234" font-size="14" fill="#c4564a" text-anchor="middle" font-style="italic">la</text>
<line x1="220" y1="174" x2="220" y2="218" stroke="#b8a888" stroke-width="1.6"/>
<text x="330" y="166" font-size="14" fill="#3a6ea5" text-anchor="middle" font-style="italic">house</text>
<text x="330" y="234" font-size="14" fill="#c4564a" text-anchor="middle" font-style="italic">maison</text>
<line x1="330" y1="174" x2="330" y2="218" stroke="#b8a888" stroke-width="1.6"/>
<text x="440" y="166" font-size="14" fill="#3a6ea5" text-anchor="middle" font-style="italic">is</text>
<text x="440" y="234" font-size="14" fill="#c4564a" text-anchor="middle" font-style="italic">est</text>
<line x1="440" y1="174" x2="440" y2="218" stroke="#b8a888" stroke-width="1.6"/>
<text x="550" y="166" font-size="14" fill="#3a6ea5" text-anchor="middle" font-style="italic">small</text>
<text x="550" y="234" font-size="14" fill="#c4564a" text-anchor="middle" font-style="italic">petite</text>
<line x1="550" y1="174" x2="550" y2="218" stroke="#b8a888" stroke-width="1.6"/>
<text x="680" y="204" font-size="11" fill="#5b5249" text-anchor="middle">l'alignement,</text>
<text x="680" y="218" font-size="11" fill="#5b5249" text-anchor="middle">appris sur le Hansard</text>
<text x="380.0" y="282" font-size="13" fill="#3a3531" text-anchor="middle">traduire = trouver l'anglais <tspan font-style="italic">e</tspan> qui rend le plus grand</text>
<text x="380.0" y="312" font-size="17" fill="#3a3531" text-anchor="middle" font-weight="700"><tspan fill="#3a6ea5">P(<tspan font-style="italic">e</tspan>)</tspan> × <tspan fill="#2f6f6a">P(<tspan font-style="italic">f</tspan> | <tspan font-style="italic">e</tspan>)</tspan></text>
<text x="250" y="348" font-size="11.5" fill="#3a6ea5" text-anchor="middle" font-weight="700">modèle de langage</text>
<text x="250" y="364" font-size="11" fill="#5b5249" text-anchor="middle">est-ce de l'anglais naturel ?</text>
<text x="510" y="348" font-size="11.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">modèle de traduction</text>
<text x="510" y="364" font-size="11" fill="#5b5249" text-anchor="middle">le français en est-il une traduction plausible ?</text>
<line x1="355" y1="318" x2="270" y2="336" stroke="#3a6ea5" stroke-width="1.2"/>
<line x1="420" y1="318" x2="495" y2="336" stroke="#2f6f6a" stroke-width="1.2"/>
</svg>
