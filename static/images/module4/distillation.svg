<text x="630.0" y="313.4" font-size="10.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">0,12</text>
<rect x="654" y="334.5" width="24" height="1.5" rx="2" fill="#b8a888" fill-opacity="0.85"/>
<text x="666.0" y="352.0" font-size="11" fill="#5b5249" text-anchor="middle">4</text>
