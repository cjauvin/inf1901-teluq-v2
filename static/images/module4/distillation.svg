<text x="360.0" y="352.0" font-size="11" fill="#5b5249" text-anchor="middle">8</text>
<rect x="384" y="334.5" width="24" height="1.5" rx="2" fill="#b8a888" fill-opacity="0.85"/>
<text x="396.0" y="352.0" font-size="11" fill="#5b5249" text-anchor="middle">9</text>
<rect x="470" y="50" width="430" height="330" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="685.0" y="76.0" font-size="12.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">La réponse du professeur</text>
