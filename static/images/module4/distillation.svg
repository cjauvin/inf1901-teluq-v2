<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La distillation</title>
<desc>Deux panneaux, avec le même chiffre 2 manuscrit, À gauche, l'étiquette seule : un diagramme en barres sur les dix chiffres, avec une seule barre, toute la probabilité sur le 2. À droite, la réponse d'un grand réseau, le professeur : la barre du 2 domine, avec 0,80, mais le 3 reçoit 0,12 et le 7, 0,05, les autres chiffres presque rien. En bas : l'élève, un réseau plus petit, apprend à reproduire la distribution de droite, et y apprend aussi que ce 2 ressemble un peu à un 3.</desc>
<rect x="0" y="0" width="920" height="450" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="460.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Ce que le professeur sait de plus que l'étiquette</text>
<rect x="20" y="50" width="430" height="330" rx="10" fill="#fbf7ee" stroke="#d9cbac"/>
<text x="235.0" y="76.0" font-size="12.5" fill="#7a6f63" text-anchor="middle" font-weight="700">L'étiquette seule</text>
<rect x="60" y="88" width="84" height="84" rx="4" fill="#3a3531"/>
<path d="M84 120 C84 100 120 100 120 120 C120 134 100 144 82 156 L124 156" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="166.0" y="128.0" font-size="10.5" fill="#5b5249" text-anchor="start">une seule information :</text>
<text x="166.0" y="144.0" font-size="10.5" fill="#5b5249" text-anchor="start" font-style="italic">« c'est un 2 »</text>
