<text x="774.0" y="352.0" font-size="11" fill="#5b5249" text-anchor="middle">7</text>
<text x="774.0" y="322.5" font-size="10.5" fill="#2f6f6a" text-anchor="middle" font-weight="700">0,05</text>
<rect x="798" y="334.5" width="24" height="1.5" rx="2" fill="#b8a888" fill-opacity="0.85"/>
<text x="810.0" y="352.0" font-size="11" fill="#5b5249" text-anchor="middle">8</text>
<rect x="834" y="334.5" width="24" height="1.5" rx="2" fill="#b8a888" fill-opacity="0.85"/>
<text x="846.0" y="352.0" font-size="11" fill="#5b5249" text-anchor="middle">9</text>
<text x="460.0" y="408.0" font-size="11.5" fill="#3a3531" text-anchor="middle" font-style="italic">L'élève, un réseau plus petit, apprend à reproduire la distribution de droite :</text>
<text x="460.0" y="426.0" font-size="11.5" fill="#3a3531" text-anchor="middle" font-style="italic">il y apprend aussi que ce 2 ressemble un peu à un 3, et un peu à un 7.</text>
<text x="886.0" y="370.0" font-size="9.5" fill="#7a6f63" text-anchor="end" font-style="italic">valeurs schématiques</text>
</svg>
