<text x="252.0" y="352.0" font-size="11" fill="#5b5249" text-anchor="middle">5</text>
<rect x="276" y="334.5" width="24" height="1.5" rx="2" fill="#b8a888" fill-opacity="0.85"/>
<text x="288.0" y="352.0" font-size="11" fill="#5b5249" text-anchor="middle">6</text>
