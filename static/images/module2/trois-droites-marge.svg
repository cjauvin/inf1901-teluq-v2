<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Trois droites sans erreur, et la droite de plus grande marge</title>
<desc>Deux panneaux avec les mêmes points, rouges en haut à gauche et bleus en bas à droite. À gauche, trois droites les séparent toutes sans erreur : A frôle les points rouges, B frôle les points bleus, C passe au milieu. À droite, la droite C seule, entourée de la plus large bande vide possible, la marge ; les trois points qui touchent les bords de la bande, les vecteurs de support, sont entourés.</desc>
