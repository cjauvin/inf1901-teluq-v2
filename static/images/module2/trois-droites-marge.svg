<text x="350.0" y="416" font-size="12.5" fill="#7a6f63" text-anchor="middle">C passe le plus loin des deux groupes : sa marge, en vert, est la plus large possible.</text>
<text x="350.0" y="434" font-size="12.5" fill="#7a6f63" text-anchor="middle">Les points entourés, les vecteurs de support, suffisent à la déterminer.</text>
