<text x="350.0" y="32" font-size="15" fill="#3a3531" text-anchor="middle" font-weight="600">Parmi toutes les droites sans erreur, la plus grande marge</text>
<text x="180.0" y="58" font-size="13.5" fill="#3a3531" text-anchor="middle" font-weight="700">Trois droites sans erreur</text>
