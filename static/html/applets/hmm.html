<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démonstration interactive : étiqueter une phrase avec un modèle de Markov caché</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; user-select: none; }
        .choix { padding: 0.3rem 0.65rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; background: #fff; font-size: 0.82rem; color: #334155; }
        .choix.actif { background: #2f6f6a; border-color: #2f6f6a; color: #fff; }
        .case { cursor: pointer; }
        .facteur { display: inline-block; padding: 0.1rem 0.4rem; margin: 0.12rem; border-radius: 0.3rem; font-size: 0.75rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-slate-800">
<div class="max-w-4xl w-full">
<div class="bg-white p-3 rounded-xl shadow-xl border border-slate-200">

    <div class="flex flex-wrap items-center gap-2 mb-3 text-sm">
        <span class="font-bold text-slate-700">Phrase :</span>
        <div id="phrases" class="flex flex-wrap gap-1"></div>
    </div>

    <div class="rounded-lg p-2" style="background:#fbf7ee;border:1px solid #d9cbac">
        <svg id="treillis" viewBox="0 0 760 330" class="w-full"></svg>
    </div>

    <div class="mt-3 p-3 bg-slate-100 rounded-lg text-sm">
        <div class="flex flex-wrap items-center gap-3">
            <div><span class="font-bold text-slate-700">Lecture retenue :</span> <span id="lecture"></span></div>
            <button id="effacer" class="choix" style="margin-left:auto">Retirer les contraintes</button>
        </div>
        <div id="comparaison" class="mt-1 text-slate-600 h-5"></div>
        <div class="mt-2 text-xs text-slate-500">Probabilité de la lecture, comme un produit de facteurs (transitions en vert, émissions en brun) :</div>
        <div id="facteurs" class="mt-1 leading-6"></div>
    </div>
    <div class="text-xs text-slate-500 text-center mt-2">Cliquez sur une case pour imposer une étiquette à un mot ; recliquez pour la retirer.</div>
</div>
</div>

<script>
/**
 * Un petit modèle de Markov caché pour l'étiquetage grammatical du français. Les états cachés sont des catégories
 * grammaticales ; chacune « émet » des mots. Les probabilités ont été fixées à la main, pour l'exemple : un vrai
 * étiqueteur les estime en comptant dans un corpus annoté. L'algorithme de Viterbi trouve la suite d'étiquettes la
 * plus probable ; les cases imposées par l'utilisateur contraignent la recherche.
 */
const ETATS = ['DÉT', 'NOM', 'ADJ', 'VERBE', 'PRON', 'PRÉP', 'ADV'];
const NOMS = { 'DÉT': 'déterminant', 'NOM': 'nom', 'ADJ': 'adjectif', 'VERBE': 'verbe', 'PRON': 'pronom', 'PRÉP': 'préposition', 'ADV': 'adverbe' };
const TRANS = {   // P(étiquette suivante | étiquette), avec FIN pour la fin de la phrase
    'DÉBUT': { 'DÉT': .45, 'PRON': .25, 'NOM': .10, 'ADJ': .02, 'VERBE': .05, 'PRÉP': .10, 'ADV': .03 },
    'DÉT':   { 'NOM': .70, 'ADJ': .25, 'VERBE': .01, 'PRON': .01, 'DÉT': .01, 'PRÉP': .01, 'ADV': .01 },
    'NOM':   { 'VERBE': .30, 'PRÉP': .20, 'ADJ': .12, 'NOM': .04, 'DÉT': .005, 'PRON': .075, 'ADV': .06, 'FIN': .20 },
    'ADJ':   { 'NOM': .62, 'VERBE': .03, 'PRÉP': .10, 'ADJ': .03, 'DÉT': .02, 'PRON': .02, 'ADV': .03, 'FIN': .15 },
    'VERBE': { 'DÉT': .35, 'PRON': .05, 'ADV': .20, 'PRÉP': .15, 'ADJ': .05, 'NOM': .05, 'VERBE': .03, 'FIN': .12 },
    'PRON':  { 'VERBE': .75, 'PRON': .10, 'DÉT': .02, 'NOM': .03, 'ADJ': .02, 'PRÉP': .02, 'ADV': .04, 'FIN': .02 },
    'PRÉP':  { 'DÉT': .50, 'NOM': .35, 'PRON': .05, 'ADJ': .05, 'VERBE': .02, 'ADV': .02, 'PRÉP': .01 },
    'ADV':   { 'VERBE': .20, 'ADJ': .20, 'FIN': .40, 'PRÉP': .10, 'DÉT': .05, 'NOM': .03, 'ADV': .02 },
};
const EMIS = {    // P(mot | étiquette), pour les mots des phrases proposées
    'DÉT':   { la: .25, le: .25, les: .20, une: .15 },
    'PRON':  { la: .20, le: .10, il: .30, les: .05 },
    'NOM':   { petite: .005, brise: .01, glace: .02, pilote: .01, ferme: .01, porte: .02, robe: .01, poules: .005, couvent: .005, mal: .01 },
    'VERBE': { brise: .005, glace: .008, pilote: .002, ferme: .006, porte: .01, couvent: .002 },
    'ADJ':   { petite: .03, ferme: .005, belle: .03 },
    'ADV':   { mal: .10 },
    'PRÉP':  { du: .20 },
};
const PHRASES = ['la petite brise la glace', 'le pilote ferme la porte', 'la porte ferme mal', 'il porte une belle robe', 'les poules du couvent couvent'];
let mots = [], imposees = {};

const fr = (x, d = 3) => x.toLocaleString('fr-CA', { maximumSignificantDigits: d });
const e = (t, m) => (EMIS[t] || {})[m] || 0;
const tr = (a, b) => (TRANS[a] || {})[b] || 0;

function viterbi(contraintes) {
    // log-probabilités ; chaque mot ne peut prendre que les étiquettes qui l'émettent (et l'étiquette imposée)
    const n = mots.length, V = [], R = [];
    for (let i = 0; i < n; i++) {
        V.push({}); R.push({});
        for (const t of ETATS) {
            if (!e(t, mots[i]) || (contraintes[i] && contraintes[i] !== t)) continue;
            let best = -Infinity, arg = null;
            if (i === 0) best = Math.log(tr('DÉBUT', t));
            else for (const p in V[i - 1]) {
                const s = V[i - 1][p] + Math.log(tr(p, t) || 1e-12);
                if (s > best) { best = s; arg = p; }
            }
            V[i][t] = best + Math.log(e(t, mots[i])); R[i][t] = arg;
        }
    }
    let best = -Infinity, last = null;
    for (const t in V[n - 1]) { const s = V[n - 1][t] + Math.log(tr(t, 'FIN') || 1e-12); if (s > best) { best = s; last = t; } }
    const chemin = [last];
    for (let i = n - 1; i > 0; i--) chemin.unshift(R[i][chemin[0]]);
    return { V, chemin, logp: best };
}

function NS(nom, att, txt) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', nom);
    for (const k in att) el.setAttribute(k, att[k]);
    if (txt !== undefined) el.textContent = txt;
    return el;
}

function dessiner() {
    const libre = viterbi({}), res = viterbi(imposees), svg = document.getElementById('treillis');
    svg.innerHTML = '';
    const n = mots.length, x0 = 120, dx = (760 - x0 - 30) / n, y0 = 46, dy = 39;
    const cx = i => x0 + dx * (i + 0.5), cy = k => y0 + dy * k + 16;
    ETATS.forEach((t, k) => svg.appendChild(NS('text', { x: 10, y: cy(k) + 5, 'font-size': 13, fill: '#5b5249', 'font-weight': 600 }, NOMS[t])));
    mots.forEach((m, i) => svg.appendChild(NS('text', { x: cx(i), y: 26, 'font-size': 16, fill: '#3a3531', 'text-anchor': 'middle', 'font-weight': 700, 'font-style': 'italic' }, m)));
    // le chemin retenu
    for (let i = 1; i < n; i++)
        svg.appendChild(NS('line', { x1: cx(i - 1), y1: cy(ETATS.indexOf(res.chemin[i - 1])), x2: cx(i), y2: cy(ETATS.indexOf(res.chemin[i])), stroke: '#2f6f6a', 'stroke-width': 4, 'stroke-linecap': 'round' }));
    mots.forEach((m, i) => {
        const vals = Object.values(res.V[i]), mx = Math.max(...vals);
        ETATS.forEach((t, k) => {
            const possible = e(t, m) > 0, g = NS('g', { class: possible ? 'case' : '' });
            const surChemin = res.chemin[i] === t, impose = imposees[i] === t;
            let fond = '#efe7d3', bord = '#d9cbac';
            if (possible) {
                const v = res.V[i][t];
                const a = v === undefined ? 0.08 : Math.max(0.1, 1 + (v - mx) / 12);   // plus la case est sombre, plus le chemin qui y mène est probable
                fond = `rgba(47,111,106,${(a * 0.45).toFixed(2)})`; bord = '#2f6f6a';
            }
            g.appendChild(NS('rect', { x: cx(i) - 34, y: cy(k) - 14, width: 68, height: 28, rx: 6, fill: surChemin ? '#2f6f6a' : fond,
                stroke: impose ? '#c4564a' : bord, 'stroke-width': impose ? 3 : 1, 'stroke-dasharray': possible ? '' : '3 3' }));
            if (possible) g.appendChild(NS('text', { x: cx(i), y: cy(k) + 5, 'font-size': 12, 'text-anchor': 'middle', fill: surChemin ? '#fff' : '#3a3531', 'font-weight': surChemin ? 700 : 400 }, t));
            if (possible) g.addEventListener('click', () => { if (imposees[i] === t) delete imposees[i]; else imposees[i] = t; dessiner(); });
            svg.appendChild(g);
        });
    });
    document.getElementById('lecture').innerHTML = mots.map((m, i) => `<i>${m}</i>&nbsp;<b style="color:#2f6f6a">${NOMS[res.chemin[i]]}</b>`).join(' · ');
    const rapport = Math.exp(libre.logp - res.logp);
    document.getElementById('comparaison').textContent = Object.keys(imposees).length === 0
        ? 'C’est la lecture la plus probable selon le modèle.'
        : rapport < 1.0001 ? 'Avec ces contraintes, c’est encore la lecture la plus probable.'
        : `Cette lecture est ${fr(rapport, 2)} fois moins probable que la meilleure.`;
    // la probabilité comme produit de facteurs
    let html = '', prev = 'DÉBUT';
    res.chemin.forEach((t, i) => {
        html += `<span class="facteur" style="background:#d9ebe7">P(${t} | ${prev}) = ${fr(tr(prev, t))}</span>`;
        html += `<span class="facteur" style="background:#f0dfcc">P(<i>${mots[i]}</i> | ${t}) = ${fr(e(t, mots[i]))}</span>`;
        prev = t;
    });
    html += `<span class="facteur" style="background:#d9ebe7">P(FIN | ${prev}) = ${fr(tr(prev, 'FIN'))}</span>`;
    document.getElementById('facteurs').innerHTML = html;
}

function choisir(k) {
    mots = PHRASES[k].split(' '); imposees = {};
    document.querySelectorAll('#phrases button').forEach((b, j) => b.classList.toggle('actif', j === k));
    dessiner();
}
PHRASES.forEach((p, k) => {
    const b = document.createElement('button'); b.className = 'choix'; b.textContent = p; b.onclick = () => choisir(k);
    document.getElementById('phrases').appendChild(b);
});
document.getElementById('effacer').onclick = () => { imposees = {}; dessiner(); };
choisir(0);
</script>
<script src="https://cdn.jsdelivr.net/npm/iframe-resizer/js/iframeResizer.contentWindow.min.js"></script>
</body>
</html>
