<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démonstration interactive : se situer dans le débat sur l'IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; user-select: none; }
        .option { display: block; width: 100%; text-align: left; padding: 0.45rem 0.7rem; border: 1px solid #cbd5e1; border-radius: 0.5rem;
                  background: #fff; font-size: 0.85rem; color: #334155; line-height: 1.3; }
        .option:hover { border-color: #2f6f6a; }
        .option.choisie { background: #2f6f6a; border-color: #2f6f6a; color: #fff; }
        .point { width: 0.7rem; height: 0.7rem; border-radius: 9999px; border: 1.5px solid #94a3b8; background: #fff; }
        .point.repondu { background: #94a3b8; }
        .point.courant { border-color: #2f6f6a; box-shadow: 0 0 0 2px #2f6f6a55; }
        .nav { padding: 0.3rem 0.8rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; background: #fff; font-size: 0.8rem; color: #334155; }
        .nav:disabled { opacity: 0.35; }
        .titre { font-size: 0.72rem; font-weight: 700; color: #64748b; letter-spacing: 0.04em; text-transform: uppercase; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-slate-800">
<div class="max-w-4xl w-full">
<div class="bg-white p-3 rounded-xl shadow-xl border border-slate-200 text-sm">
    <div class="flex flex-col md:flex-row gap-3">
        <div class="md:w-1/2 flex flex-col gap-2">
            <div class="rounded-lg p-3 bg-slate-50 border border-slate-200 flex flex-col" style="min-height:372px">
                <div class="flex items-center justify-between mb-2">
                    <span id="numero" class="titre"></span>
                    <div id="points" class="flex gap-1"></div>
                </div>
                <div id="question" class="font-bold text-slate-700 mb-2 leading-snug" style="min-height:2.6em"></div>
                <div id="options" class="flex flex-col gap-1.5"></div>
                <div class="flex justify-between mt-auto pt-3">
                    <button id="prec" class="nav">← Précédente</button>
                    <button id="recommencer" class="nav">Recommencer</button>
                    <button id="suiv" class="nav">Suivante →</button>
                </div>
            </div>
            <div class="rounded-lg p-3 border" style="background:#fbf7ee;border-color:#d9cbac;min-height:206px">
                <div class="titre mb-1">Le camp le plus proche de vos réponses</div>
                <div id="resultat" class="text-slate-700 leading-snug"></div>
            </div>
        </div>
        <div class="md:w-1/2 rounded-lg p-2 flex items-center" style="background:#fbf7ee;border:1px solid #d9cbac">
            <svg id="carte" viewBox="0 0 400 440" class="w-full"></svg>
        </div>
    </div>
    <div class="text-xs text-slate-500 text-center mt-2">
        Deux questions séparent les camps : l'ampleur attendue de l'IA, et ce qu'il faut faire. Ce questionnaire simplifie à dessein ;
        la plupart des gens empruntent à plusieurs camps.
    </div>
</div>
</div>

<script>
/**
 * Les camps du débat sur l'IA, placés sur deux axes : x, l'ampleur attendue (-1 : technologie normale, voire surestimée ;
 * +1 : rupture, superintelligence prochaine) ; y, ce qu'il faut faire (-1 : accélérer ; 0 : encadrer les usages ;
 * +1 : freiner, voire arrêter). Chaque réponse donne une valeur sur l'un des axes, ou les deux ; la position est la
 * moyenne des valeurs reçues sur chaque axe.
 */
const CAMPS = [
    { nom: 'Les sceptiques', carte: ['Sceptiques'], x: -0.72, y: 0.1, coul: '#7a6f63',
      idee: "Les capacités de l'IA sont très exagérées, et les investissements forment une bulle. Les modèles actuels imitent sans comprendre.",
      qui: 'Gary Marcus ; Yann Le Cun, pour les modèles de langage' },
    { nom: "L'IA comme technologie normale", carte: ['Technologie', 'normale'], x: -0.4, y: -0.2, coul: '#2f6f6a',
      idee: "Une technologie puissante mais normale, comme l'électricité : ses effets s'étaleront sur des décennies. Il faut l'encadrer usage par usage.",
      qui: 'Arvind Narayanan et Sayash Kapoor' },
    { nom: "L'éthique de l'IA", carte: ['Éthique', "de l'IA"], x: -0.4, y: 0.52, coul: '#3a6ea5',
      idee: "Les torts sont déjà là : biais, surveillance, travail exploité, coût environnemental, pouvoir concentré. La superintelligence détourne l'attention.",
      qui: 'Timnit Gebru, Emily Bender' },
    { nom: 'Les populistes', carte: ['Populistes'], x: 0.2, y: 0.72, coul: '#7b5ea7',
      idee: "L'IA menace les emplois, les valeurs et la démocratie, au profit de quelques entreprises. Il faut la freiner. Ce camp réunit la droite et la gauche.",
      qui: 'Steve Bannon, Bernie Sanders' },
    { nom: 'La sécurité', carte: ['Sécurité'], x: 0.72, y: 0.6, coul: '#c4564a',
      idee: "Une IA plus intelligente que nous pourrait échapper à notre contrôle. Il faut freiner, réglementer fortement, voire interdire la superintelligence.",
      qui: 'Geoffrey Hinton, Yoshua Bengio, Eliezer Yudkowsky' },
    { nom: 'Les accélérationnistes', carte: ['Accélération-', 'nistes'], x: 0.62, y: -0.7, coul: '#9a5b33',
      idee: "L'IA guérira des maladies et enrichira tout le monde. La réglementation freinerait l'innovation, ou laisserait la Chine prendre l'avance.",
      qui: 'Marc Andreessen, David Sacks' },
];

const QUESTIONS = [
    { q: "Une IA plus capable que les humains dans presque tous les domaines…", o: [
        ["…n'arrivera pas avant très longtemps, si elle arrive un jour.", { x: -1 }],
        ["…est une notion trop floue pour guider nos décisions.", { x: -0.6 }],
        ["…arrivera probablement d'ici une vingtaine d'années.", { x: 0.5 }],
        ["…arrivera probablement d'ici cinq ans.", { x: 1 }]] },
    { q: "Les grands modèles de langage actuels…", o: [
        ["…imitent sans comprendre ; on surestime beaucoup leurs capacités.", { x: -1 }],
        ["…sont des outils utiles, avec des limites durables.", { x: -0.4 }],
        ["…progressent vite, et rien n'indique que cela s'arrêtera.", { x: 0.5 }],
        ["…sont les premiers pas vers des systèmes qui nous dépasseront.", { x: 1 }]] },
    { q: "Dans dix ans, l'effet de l'IA sur l'économie ressemblera…", o: [
        ["…à une bulle qui s'est dégonflée.", { x: -1 }],
        ["…à celui d'Internet ou de l'électricité : profond, mais étalé sur des décennies.", { x: -0.4 }],
        ["…à une révolution industrielle en accéléré.", { x: 0.5 }],
        ["…à rien de connu : la plupart du travail intellectuel sera automatisé.", { x: 1 }]] },
    { q: "Ce qui ralentira le plus l'adoption de l'IA…", o: [
        ["…ses erreurs : elle n'est pas assez fiable.", { x: -0.9 }],
        ["…les organisations, les lois et les habitudes, qui changent lentement.", { x: -0.5 }],
        ["…le coût du calcul et de l'énergie, pour un temps.", { x: 0.4 }],
        ["…presque rien : une IA capable aidera à construire la suivante.", { x: 1 }]] },
    { q: "Le risque le plus sérieux de l'IA, c'est…", o: [
        ["…de prendre du retard sur des pays rivaux.", { y: -1 }],
        ["…ses torts actuels : biais, surveillance, désinformation.", { x: -0.3, y: 0.4 }],
        ["…la perte d'emplois et la puissance de quelques entreprises.", { y: 0.6 }],
        ["…que nous perdions le contrôle de systèmes plus intelligents que nous.", { x: 0.6, y: 0.9 }]] },
    { q: "La réglementation de l'IA devrait…", o: [
        ["…rester minimale, pour ne pas étouffer l'innovation.", { y: -1 }],
        ["…viser des usages précis, comme pour les médicaments ou les voitures.", { y: 0 }],
        ["…encadrer fortement les entreprises qui développent les plus grands modèles.", { y: 0.6 }],
        ["…aller jusqu'à interdire le développement d'une superintelligence.", { y: 1 }]] },
    { q: "Dans la course entre pays, en particulier entre les États-Unis et la Chine…", o: [
        ["…il faut gagner, et vite.", { y: -1 }],
        ["…il faut rester dans la course, avec des règles.", { y: -0.2 }],
        ["…il faut chercher des accords internationaux.", { y: 0.5 }],
        ["…il faut un traité qui arrête la course.", { y: 1 }]] },
    { q: "Les investissements massifs dans l'IA…", o: [
        ["…sont notre meilleure chance de guérir des maladies et d'enrichir tout le monde.", { x: 0.4, y: -0.9 }],
        ["…finiront par profiter à tous, comme ceux des technologies précédentes.", { y: -0.3 }],
        ["…profitent surtout à quelques entreprises, qu'il faut contrôler.", { y: 0.6 }],
        ["…alimentent une course dangereuse, qu'il faudrait ralentir.", { x: 0.4, y: 0.9 }]] },
];

const $ = id => document.getElementById(id);
const ns = 'http://www.w3.org/2000/svg';
let rep = Array(QUESTIONS.length).fill(null), k = 0;
const CX = 205, CY = 205, R = 165;                      // centre et demi-côté de la carte
const px = x => CX + x * R, py = y => CY - y * R;
function el(svg, tag, attrs, texte) {
    const e = document.createElementNS(ns, tag);
    for (const [a, v] of Object.entries(attrs)) e.setAttribute(a, v);
    if (texte !== undefined) e.textContent = texte;
    svg.appendChild(e); return e;
}

function position() {
    let sx = 0, nx = 0, sy = 0, ny = 0;
    rep.forEach((r, i) => {
        if (r === null) return;
        const v = QUESTIONS[i].o[r][1];
        if (v.x !== undefined) { sx += v.x; nx++; }
        if (v.y !== undefined) { sy += v.y; ny++; }
    });
    return { x: nx ? sx / nx : 0, y: ny ? sy / ny : 0, n: rep.filter(r => r !== null).length };
}

function plusProches(p) {
    return CAMPS.map(c => ({ c, d: Math.hypot(c.x - p.x, c.y - p.y) })).sort((a, b) => a.d - b.d);
}

function dessinerCarte(p) {
    const svg = $('carte'); svg.replaceChildren();
    el(svg, 'rect', { x: CX - R, y: CY - R, width: 2 * R, height: 2 * R, rx: 8, fill: '#fffdf8', stroke: '#d9cbac' });
    el(svg, 'line', { x1: CX - R, y1: CY, x2: CX + R, y2: CY, stroke: '#d9cbac', 'stroke-dasharray': '4 4' });
    el(svg, 'line', { x1: CX, y1: CY - R, x2: CX, y2: CY + R, stroke: '#d9cbac', 'stroke-dasharray': '4 4' });
    // axes
    el(svg, 'text', { x: CX, y: CY + R + 18, 'font-size': 10.5, fill: '#5b5249', 'text-anchor': 'middle', 'font-weight': 700 }, "L'ampleur attendue de l'IA");
    el(svg, 'text', { x: CX - R, y: CY + R + 33, 'font-size': 9.5, fill: '#7a6f63' }, '← une technologie normale');
    el(svg, 'text', { x: CX + R, y: CY + R + 33, 'font-size': 9.5, fill: '#7a6f63', 'text-anchor': 'end' }, 'une rupture →');
    el(svg, 'text', { x: 0, y: 0, 'font-size': 10.5, fill: '#5b5249', 'text-anchor': 'middle', 'font-weight': 700,
        transform: `translate(${CX - R - 24} ${CY}) rotate(-90)` }, 'Que faire ?');
    el(svg, 'text', { x: CX, y: CY - R - 8, 'font-size': 9.5, fill: '#7a6f63', 'text-anchor': 'middle' }, '↑ freiner, voire arrêter');
    el(svg, 'text', { x: CX + R - 4, y: CY - 5, 'font-size': 9.5, fill: '#7a6f63', 'text-anchor': 'end' }, 'encadrer les usages');
    el(svg, 'text', { x: CX, y: CY + R - 6, 'font-size': 9.5, fill: '#7a6f63', 'text-anchor': 'middle' }, '↓ accélérer');
    const proche = p.n ? plusProches(p)[0].c : null;
    for (const c of CAMPS) {
        const actif = c === proche;
        el(svg, 'circle', { cx: px(c.x), cy: py(c.y), r: 38, fill: c.coul, 'fill-opacity': actif ? 0.24 : 0.1,
            stroke: c.coul, 'stroke-width': actif ? 2.2 : 1 });
        c.carte.forEach((l, i) => el(svg, 'text', { x: px(c.x), y: py(c.y) + 4 + (i - (c.carte.length - 1) / 2) * 13, 'font-size': 11,
            fill: c.coul, 'text-anchor': 'middle', 'font-weight': 700 }, l));
    }
    if (p.n) {
        el(svg, 'circle', { cx: px(p.x), cy: py(p.y), r: 9, fill: '#3a3531', stroke: '#fff', 'stroke-width': 2.5 });
        const enHaut = py(p.y) < CY - R + 24;
        el(svg, 'text', { x: px(p.x), y: py(p.y) + (enHaut ? 24 : -14), 'font-size': 10.5, fill: '#3a3531', 'text-anchor': 'middle', 'font-weight': 700,
            stroke: '#fffdf8', 'stroke-width': 3, 'paint-order': 'stroke' }, 'vous');
    }
}

function dessinerQuestion() {
    const Q = QUESTIONS[k];
    $('numero').textContent = `Question ${k + 1} sur ${QUESTIONS.length}`;
    $('question').textContent = Q.q;
    $('options').replaceChildren(...Q.o.map(([texte], i) => {
        const b = document.createElement('button');
        b.className = 'option' + (rep[k] === i ? ' choisie' : '');
        b.textContent = texte;
        b.onclick = () => { rep[k] = i; if (k < QUESTIONS.length - 1) k++; maj(); };
        return b;
    }));
    $('points').replaceChildren(...QUESTIONS.map((_, i) => {
        const d = document.createElement('button');
        d.className = 'point' + (rep[i] !== null ? ' repondu' : '') + (i === k ? ' courant' : '');
        d.title = `Question ${i + 1}`;
        d.onclick = () => { k = i; maj(); };
        return d;
    }));
    $('prec').disabled = k === 0;
    $('suiv').disabled = k === QUESTIONS.length - 1;
}

function dessinerResultat(p) {
    const r = $('resultat');
    if (!p.n) { r.innerHTML = '<span class="text-slate-500">Répondez aux questions : votre point apparaîtra sur la carte, et se déplacera à chaque réponse.</span>'; return; }
    const [a, b] = plusProches(p);
    const reste = QUESTIONS.length - p.n;
    r.innerHTML = `<div class="font-bold text-base" style="color:${a.c.coul}">${a.c.nom}</div>
        <div class="text-sm mt-1">${a.c.idee}</div>
        <div class="text-xs text-slate-500 mt-1">Quelques voix : ${a.c.qui}.</div>
        <div class="text-xs text-slate-500 mt-1">Ensuite : <span style="color:${b.c.coul};font-weight:700">${b.c.nom}</span>.
        ${reste ? `Encore ${reste} question${reste > 1 ? 's' : ''} pour préciser.` : ''}</div>`;
}

function maj() { const p = position(); dessinerQuestion(); dessinerCarte(p); dessinerResultat(p); }
$('prec').onclick = () => { if (k > 0) { k--; maj(); } };
$('suiv').onclick = () => { if (k < QUESTIONS.length - 1) { k++; maj(); } };
$('recommencer').onclick = () => { rep = Array(QUESTIONS.length).fill(null); k = 0; maj(); };
maj();
</script>
<script src="https://cdn.jsdelivr.net/npm/iframe-resizer/js/iframeResizer.contentWindow.min.js"></script>
</body>
</html>
