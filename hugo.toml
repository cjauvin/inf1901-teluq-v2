baseURL = 'https://cjauvin.github.io/inf1901-teluq-v2/'
languageCode = 'fr'
defaultContentLanguage = 'fr'

title = "INF1901 - Initiation à l'IA : concepts et réflexions"
theme = 'hugo-book'

# Le gabarit x (message de X) va chercher le message au moment de la construction ; si X ne répond pas,
# on veut un avertissement, pas un déploiement en échec.
ignoreLogs = ['shortcode-x-getremote']

# --- Paramètres du thème hugo-book ---
[params]
BookTheme = "auto"
BookToC = true
BookSearch = true
BookPortableLinks = "warning"
BookLogo = "images/paperclip-logo.png"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
